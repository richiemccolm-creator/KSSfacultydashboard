<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DM Planner 2026–27 — Art &amp; Drama</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="design-tokens.css">
  <link rel="stylesheet" href="dm-planner.css">
  <link rel="icon" type="image/png" href="faculty-hub-logo.png">
  <script>
    window.DMP_EMBED = new URLSearchParams(window.location.search).get('embed') === '1';
    if (window.DMP_EMBED) {
      document.documentElement.classList.add('dmp-embed-pending');
      window.__authGuardLoginPath = 'login.html';
    }
  </script>
  <script src="app-version.js"></script>
  <script>
    (function () {
      if (window.ensureAppVersionInUrl) window.ensureAppVersionInUrl();
    })();
  </script>
  <script src="config.js"></script>
  <script src="embed-chrome.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-init.js"></script>
  <script src="allowlist-check.js"></script>
  <script src="auth-guard.js"></script>
  <script src="dm-planner-seed-2627.js"></script>
  <script src="dm-planner-service.js"></script>
</head>
<body>
  <main class="dmp-shell">
    <header class="dmp-header">
      <div class="dmp-header-inner">
        <a class="dmp-brand" href="faculty-hub.html">Faculty Hub</a>
        <h1>DM Planner 2026–27</h1>
        <p>Art &amp; Drama faculty meetings and moderation across the year.</p>
      </div>
    </header>

    <div class="dmp-toolbar" role="region" aria-label="Planner controls">
      <div class="dmp-toolbar-main">
        <div class="dmp-next" id="dmp-next"></div>
      </div>
      <div class="dmp-toolbar-actions" id="dmp-toolbar-actions"></div>
      <div class="dmp-filters" id="dmp-filters"></div>
      <span class="dmp-sync" id="dmp-sync" aria-live="polite"></span>
    </div>

    <div class="dmp-banner" id="dmp-banner" hidden></div>

    <div class="dmp-main">
      <div class="dmp-stage" id="dmp-stage">
        <section class="dmp-chart" aria-label="Year chart">
          <div class="dmp-legend" id="dmp-legend"></div>
          <div class="dmp-gantt-scroll" id="dmp-gantt-scroll">
            <div id="dmp-gantt"></div>
          </div>
        </section>
        <aside class="dmp-doc" id="dmp-doc" aria-label="Meeting workspace"></aside>
      </div>
    </div>

    <div id="dmp-print" class="dmp-print" aria-hidden="true"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="dm-planner-app.js"></script>
</body>
</html>
