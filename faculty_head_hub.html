<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Faculty Head Hub">
<title>Faculty Head Hub — Overview</title>
<link rel="icon" type="image/png" href="faculty-hub-logo.png">
<script src="config.js"></script>
<script src="embed-chrome.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-init.js"></script>
<script src="allowlist-check.js"></script>
<script src="auth-guard.js"></script>
<script src="fh-access.js"></script>
<script src="data-service.js"></script>
<script src="calendar-request-service.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="design-tokens.css">
<link rel="stylesheet" href="faculty-shell.css">
<link rel="stylesheet" href="fh-mobile-shell.css">
<style>
.ov{max-width:1180px;margin:0 auto;padding:16px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.ov *{box-sizing:border-box}
.ov-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ov-date{margin:0;font-size:var(--fs-sm);color:var(--ink-500)}
.ov-head h1{margin:2px 0 0;font-family:var(--font-heading);font-size:var(--fs-2xl);font-weight:700;letter-spacing:-.02em;color:var(--ink-900);line-height:1.15}
.ov-actions{display:flex;gap:8px;flex-wrap:wrap}
.ov .btn{min-height:44px;justify-content:center;text-decoration:none}
.ov .btn-sm{min-height:36px;padding:6px 12px;font-size:var(--fs-xs)}
.ov .btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}

.ov-panel{background:#fff;border:1px solid var(--navy-100);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column}
.ov-panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:14px 16px 10px}
.ov-panel-head h2{margin:0;font-size:var(--fs-md);font-weight:700;color:var(--ink-900)}
.ov-panel-head a{font-size:var(--fs-sm);font-weight:600;color:var(--navy-700);text-decoration:none;white-space:nowrap;min-height:32px;display:inline-flex;align-items:center}
.ov-panel-head a:hover{text-decoration:underline}
.ov-muted{margin:0;padding:4px 16px 16px;font-size:var(--fs-sm);color:var(--ink-500);line-height:1.45}

.ov-todo{list-style:none;margin:0;padding:0}
.ov-todo li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--navy-100)}
.ov-dot{width:10px;height:10px;border-radius:50%;background:var(--navy-400)}
.ov-dot.is-request{background:#5b3fd1}
.ov-dot.is-warn{background:var(--warning-600)}
.ov-dot.is-draft{background:var(--ink-400)}
.ov-todo-title{font-size:var(--fs-base);font-weight:600;color:var(--ink-900);line-height:1.35;overflow-wrap:anywhere}
.ov-todo-detail{margin-top:2px;font-size:var(--fs-sm);color:var(--ink-500);line-height:1.4;overflow-wrap:anywhere}
.ov-todo-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ov-clear{display:flex;align-items:center;gap:10px;margin:0;padding:4px 16px 16px;font-size:var(--fs-sm);color:var(--success-600);font-weight:600}
.ov-clear svg{width:18px;height:18px}

.ov-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.ov-counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 12px}
.ov-count{padding:10px;border-radius:var(--r-md);background:var(--navy-050);text-decoration:none;color:inherit;min-height:44px}
.ov-count strong{display:block;font-size:var(--fs-xl);font-weight:700;color:var(--ink-900);line-height:1.1}
.ov-count span{font-size:var(--fs-xs);color:var(--ink-500)}
.ov-list{list-style:none;margin:0;padding:0 0 6px}
.ov-list li{display:flex;gap:12px;align-items:flex-start;padding:10px 16px;border-top:1px solid var(--navy-100)}
.ov-when{flex-shrink:0;width:44px;text-align:center;border-radius:8px;background:var(--navy-050);padding:5px 0;line-height:1.1}
.ov-when b{display:block;font-size:var(--fs-md);color:var(--ink-900)}
.ov-when small{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--ink-500);text-transform:uppercase}
.ov-item-title{font-size:var(--fs-sm);font-weight:600;color:var(--ink-900);line-height:1.35;overflow-wrap:anywhere}
.ov-item-meta{margin-top:2px;font-size:var(--fs-xs);color:var(--ink-500)}
.pill{display:inline-flex;align-items:center;padding:1px 7px;border-radius:99px;font-size:11px;font-weight:700;margin-right:4px}
.pill-scheduled{background:#efeaff;color:#5b3fd1}
.pill-live{background:#e6f7ed;color:#15803d}
.pill-meeting{background:var(--navy-050);color:var(--navy-700)}
.ov-bar{height:6px;border-radius:99px;background:var(--navy-050);overflow:hidden;margin-top:6px}
.ov-bar i{display:block;height:100%;border-radius:99px;background:var(--navy-700)}
.ov-bar i.is-done{background:var(--success-600)}
.ov-track{flex:1;min-width:0}
.ov-track-row{display:flex;justify-content:space-between;gap:8px}
.ov-skel{margin:0;padding:4px 16px 16px;font-size:var(--fs-sm);color:var(--ink-400)}

.ov-toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);max-width:calc(100vw - 32px);background:var(--ink-900);color:#fff;padding:12px 18px;border-radius:var(--r-pill);z-index:1000;display:none;font-size:var(--fs-sm)}
.ov-toast.show{display:block}

@media (max-width:1000px){
  .ov-grid{grid-template-columns:1fr 1fr}
  .ov-grid > .ov-panel:first-child{grid-column:1 / -1}
}
@media (max-width:680px){
  .ov-grid{grid-template-columns:1fr}
  .ov-head h1{font-size:var(--fs-xl)}
  .ov-actions{width:100%}
  .ov-actions .btn{flex:1}
  .ov-todo li{grid-template-columns:auto 1fr}
  .ov-todo-actions{grid-column:2;justify-content:flex-start}
}
</style>
</head>
<body class="fh-mobile-page fh-hub-page">
<main class="ov">
  <header class="ov-head">
    <div>
      <p class="ov-date" id="ovDate"></p>
      <h1 id="ovGreeting">Faculty Head Hub</h1>
    </div>
    <div class="ov-actions">
      <a class="btn" href="fh_calendar.html">Add calendar event</a>
      <a class="btn btn-primary" href="fh_announcements.html?new=1">New announcement</a>
    </div>
  </header>

  <section class="ov-panel" aria-labelledby="ovTodoHeading">
    <div class="ov-panel-head"><h2 id="ovTodoHeading">Needs your attention</h2></div>
    <div id="ovTodo" aria-live="polite"><p class="ov-skel">Checking…</p></div>
  </section>

  <div class="ov-grid">
    <section class="ov-panel" aria-labelledby="ovAnnHeading">
      <div class="ov-panel-head"><h2 id="ovAnnHeading">Announcements</h2><a href="fh_announcements.html">Manage</a></div>
      <div id="ovAnn"><p class="ov-skel">Loading…</p></div>
    </section>
    <section class="ov-panel" aria-labelledby="ovSoonHeading">
      <div class="ov-panel-head"><h2 id="ovSoonHeading">Coming up</h2><a href="fh_calendar.html">Calendar</a></div>
      <div id="ovSoon"><p class="ov-skel">Loading…</p></div>
    </section>
    <section class="ov-panel" aria-labelledby="ovTrackHeading">
      <div class="ov-panel-head"><h2 id="ovTrackHeading">Tracking</h2><a href="fh_tracking.html">Open</a></div>
      <div id="ovTrack"><p class="ov-skel">Loading…</p></div>
    </section>
  </div>
</main>
<div id="ovToast" class="ov-toast" role="status" aria-live="polite"></div>

<script>
(function() {
  'use strict';

  var SOON_DAYS = 14;
  var MINUTES_LOOKBACK_DAYS = 45;

  function $(id) { return document.getElementById(id); }
  function esc(v) {
    return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function href(h) { return window.fhNavHref ? fhNavHref(h) : h; }
  var toastTimer = null;
  function toast(msg) {
    var t = $('ovToast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { t.classList.remove('show'); }, 3200);
  }
  function pad(n) { return String(n).padStart(2, '0'); }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function parseYmd(s) { return new Date(String(s).slice(0, 10) + 'T12:00:00'); }
  function dayLabel(d) {
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var that = new Date(d); that.setHours(0, 0, 0, 0);
    var diff = Math.round((that - today) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Tomorrow';
    if (diff === -1) return 'Yesterday';
    return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  }
  function whenLabel(iso) {
    var d = new Date(iso);
    return isNaN(d.getTime()) ? '' : dayLabel(d) + ', ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }
  // A source that fails resolves to null, so one outage doesn't blank the page.
  function safe(p) { return Promise.resolve(p).catch(function() { return null; }); }

  // ---- Header -----------------------------------------------------------
  function renderHeader() {
    var now = new Date();
    $('ovDate').textContent = now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
    var h = now.getHours();
    var greeting = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
    $('ovGreeting').textContent = greeting;
    if (!window.supabase || !window.supabase.auth) return;
    window.supabase.auth.getSession().then(function(res) {
      var user = res && res.data && res.data.session && res.data.session.user;
      var first = user ? String(user.email || '').split('@')[0].split(/[._-]/)[0] : '';
      if (first) $('ovGreeting').textContent = greeting + ', ' + first.charAt(0).toUpperCase() + first.slice(1).toLowerCase();
    }).catch(function() {});
  }

  // ---- Tracking ---------------------------------------------------------
  // One row per class: how many pupils have any scores entered.
  function trackingByClass(rows) {
    var out = [];
    (rows || []).forEach(function(r) {
      if (!r || (r.data_type !== 'drama-v3' && r.data_type !== 'art-v2')) return;
      var subj = r.data_type === 'drama-v3' ? 'Drama' : 'Art & Design';
      var data = r.data || {};
      var pupilsRoot = data.pupils || {};
      var scoresRoot = data.scores || {};
      Object.keys(pupilsRoot).forEach(function(yg) {
        var classes = pupilsRoot[yg] || {};
        Object.keys(classes).forEach(function(cls) {
          var pupils = Array.isArray(classes[cls]) ? classes[cls] : [];
          if (!pupils.length) return;
          var scored = pupils.filter(function(p) {
            var s = p && p.id && scoresRoot[yg] && scoresRoot[yg][p.id];
            return s && Object.keys(s).length;
          }).length;
          out.push({ label: cls + ' ' + subj, teacher: r.teacherName && r.teacherName !== 'Unknown' ? r.teacherName : '', scored: scored, total: pupils.length });
        });
      });
    });
    out.sort(function(a, b) { return (a.scored / a.total) - (b.scored / b.total) || a.label.localeCompare(b.label); });
    return out;
  }

  // ---- Needs your attention --------------------------------------------
  function renderTodo(d) {
    var items = [];
    var failed = [];

    if (d.requests == null) failed.push('calendar requests');
    (d.requests || []).forEach(function(r) {
      var who = d.requesters[r.requester_id] || 'A member of staff';
      var dates = CalendarRequestService.formatDateRange(r).split(' – ').map(function(x) { return dayLabel(parseYmd(x)); }).join(' – ');
      items.push({
        kind: 'request',
        title: 'Calendar request: ' + r.title,
        detail: who + ' · ' + dates,
        actions: '<button class="btn btn-primary btn-sm" type="button" data-approve="' + esc(r.id) + '">Approve</button>' +
                 '<button class="btn btn-sm" type="button" data-decline="' + esc(r.id) + '">Decline</button>'
      });
    });

    if (d.announcements == null) failed.push('announcements');
    var anns = d.announcements || [];
    var drafts = anns.filter(function(a) { return a.state === 'draft'; });
    if (drafts.length) {
      items.push({
        kind: 'draft',
        title: plural(drafts.length, 'announcement draft') + ' not posted yet',
        detail: drafts.slice(0, 2).map(function(a) { return a.title; }).join(' · ') + (drafts.length > 2 ? ' …' : ''),
        actions: '<a class="btn btn-sm" href="' + esc(href('fh_announcements.html?tab=draft')) + '">Review drafts</a>'
      });
    }
    if (d.announcements && !anns.some(function(a) { return a.state === 'live'; })) {
      items.push({
        kind: 'warn',
        title: 'Nothing is live on the staff home page',
        detail: 'Staff see an empty announcements card.',
        actions: '<a class="btn btn-sm" href="' + esc(href('fh_announcements.html?new=1')) + '">Post one</a>'
      });
    }

    if (d.meetings == null) failed.push('meetings');
    var today = ymd(new Date());
    var since = ymd(addDays(new Date(), -MINUTES_LOOKBACK_DAYS));
    (d.meetings || []).filter(function(m) {
      var md = String(m.meeting_date || '').slice(0, 10);
      return md && md < today && md >= since && m.minutes_recording_status !== 'complete';
    }).slice(0, 3).forEach(function(m) {
      items.push({
        kind: 'warn',
        title: 'Minutes not finished: ' + (m.title || 'Department meeting'),
        detail: 'Meeting on ' + dayLabel(parseYmd(m.meeting_date)),
        actions: '<a class="btn btn-sm" href="' + esc(href('fh_department_meetings.html')) + '">Open minutes</a>'
      });
    });

    if (d.tracking == null) failed.push('tracking');
    var gaps = (d.tracking || []).filter(function(t) { return t.scored < t.total; });
    if (gaps.length) {
      items.push({
        kind: 'warn',
        title: plural(gaps.length, 'class', 'classes') + ' with pupils missing scores',
        detail: gaps.slice(0, 3).map(function(t) { return t.label + ' (' + t.scored + '/' + t.total + ')'; }).join(' · ') + (gaps.length > 3 ? ' …' : ''),
        actions: '<a class="btn btn-sm" href="' + esc(href('fh_tracking.html')) + '">Open tracking</a>'
      });
    }

    var html = '';
    if (items.length) {
      html = '<ul class="ov-todo">' + items.map(function(it) {
        return '<li><span class="ov-dot is-' + it.kind + '" aria-hidden="true"></span>' +
          '<div><div class="ov-todo-title">' + esc(it.title) + '</div>' +
          (it.detail ? '<div class="ov-todo-detail">' + esc(it.detail) + '</div>' : '') + '</div>' +
          '<div class="ov-todo-actions">' + it.actions + '</div></li>';
      }).join('') + '</ul>';
    } else if (!failed.length) {
      html = '<p class="ov-clear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>You’re all caught up.</p>';
    }
    if (failed.length) {
      html += '<p class="ov-muted">Couldn’t check ' + esc(failed.join(', ')) + '. Refresh to try again.</p>';
    }
    $('ovTodo').innerHTML = html;
  }

  // ---- Announcements panel ---------------------------------------------
  function renderAnnouncements(anns) {
    var el = $('ovAnn');
    if (anns == null) { el.innerHTML = '<p class="ov-muted">Announcements didn’t load.</p>'; return; }
    var by = function(s) { return anns.filter(function(a) { return a.state === s; }); };
    var live = by('live'), scheduled = by('scheduled'), drafts = by('draft');
    var count = function(n, label, tab) {
      return '<a class="ov-count" href="' + esc(href('fh_announcements.html?tab=' + tab)) + '"><strong>' + n + '</strong><span>' + label + '</span></a>';
    };
    scheduled.sort(function(a, b) { return String(a.publish_at).localeCompare(String(b.publish_at)); });
    live.sort(function(a, b) { return String(b.posted_at).localeCompare(String(a.posted_at)); });
    var rows = scheduled.slice(0, 2).map(function(a) {
      return '<li><div><div class="ov-item-title"><span class="pill pill-scheduled">Scheduled</span>' + esc(a.title) + '</div>' +
        '<div class="ov-item-meta">Goes live ' + esc(whenLabel(a.publish_at)) + '</div></div></li>';
    }).concat(live.slice(0, 3).map(function(a) {
      return '<li><div><div class="ov-item-title"><span class="pill pill-live">Live</span>' + esc(a.title) + '</div>' +
        '<div class="ov-item-meta">Since ' + esc(whenLabel(a.posted_at)) + (a.featured_banner ? ' · Home banner' : '') + '</div></div></li>';
    }));
    el.innerHTML = '<div class="ov-counts">' + count(live.length, 'Live', 'live') + count(scheduled.length, 'Scheduled', 'scheduled') + count(drafts.length, 'Drafts', 'draft') + '</div>' +
      (rows.length ? '<ul class="ov-list">' + rows.join('') + '</ul>' : '<p class="ov-muted">No live or scheduled announcements.</p>');
  }

  // ---- Coming up panel --------------------------------------------------
  function renderSoon(events, meetings) {
    var el = $('ovSoon');
    if (events == null && meetings == null) { el.innerHTML = '<p class="ov-muted">The calendar didn’t load.</p>'; return; }
    var today = ymd(new Date());
    var until = ymd(addDays(new Date(), SOON_DAYS));
    var list = [];
    (events || []).forEach(function(e) {
      var d = String(e.date || '').slice(0, 10);
      if (d >= today && d <= until) list.push({ date: d, title: e.title || 'Untitled event', meta: e.category && e.category !== 'general' ? e.category : '' });
    });
    (meetings || []).forEach(function(m) {
      var d = String(m.meeting_date || '').slice(0, 10);
      if (d >= today && d <= until) list.push({ date: d, title: m.title || 'Department meeting', meeting: true });
    });
    list.sort(function(a, b) { return a.date.localeCompare(b.date); });
    if (!list.length) { el.innerHTML = '<p class="ov-muted">Nothing on the shared calendar in the next ' + SOON_DAYS + ' days.</p>'; return; }
    el.innerHTML = '<ul class="ov-list">' + list.slice(0, 6).map(function(it) {
      var d = parseYmd(it.date);
      return '<li><div class="ov-when"><small>' + esc(d.toLocaleDateString('en-GB', { month: 'short' })) + '</small><b>' + d.getDate() + '</b></div>' +
        '<div><div class="ov-item-title">' + (it.meeting ? '<span class="pill pill-meeting">Meeting</span>' : '') + esc(it.title) + '</div>' +
        '<div class="ov-item-meta">' + esc(dayLabel(d)) + (it.meta ? ' · ' + esc(it.meta) : '') + '</div></div></li>';
    }).join('') + '</ul>';
  }

  // ---- Tracking panel ---------------------------------------------------
  function renderTracking(classes) {
    var el = $('ovTrack');
    if (classes == null) { el.innerHTML = '<p class="ov-muted">Tracking data didn’t load.</p>'; return; }
    if (!classes.length) { el.innerHTML = '<p class="ov-muted">No classes in the Drama or Art trackers yet.</p>'; return; }
    var done = classes.filter(function(c) { return c.scored >= c.total; }).length;
    el.innerHTML = '<p class="ov-muted" style="padding-bottom:10px">' + done + ' of ' + plural(classes.length, 'class', 'classes') + ' have scores for every pupil.</p>' +
      '<ul class="ov-list">' + classes.slice(0, 6).map(function(c) {
        var pct = Math.round((c.scored / c.total) * 100);
        return '<li><div class="ov-track"><div class="ov-track-row"><span class="ov-item-title">' + esc(c.label) + '</span>' +
          '<span class="ov-item-meta">' + c.scored + '/' + c.total + '</span></div>' +
          (c.teacher ? '<div class="ov-item-meta">' + esc(c.teacher) + '</div>' : '') +
          '<div class="ov-bar" role="img" aria-label="' + pct + '% of pupils have scores"><i class="' + (pct >= 100 ? 'is-done' : '') + '" style="width:' + pct + '%"></i></div></div></li>';
      }).join('') + '</ul>';
  }

  // ---- Load -------------------------------------------------------------
  function load() {
    var ds = window.DataService || {};
    var crs = window.CalendarRequestService;
    return Promise.all([
      safe(ds.getAnnouncementsForManage && ds.getAnnouncementsForManage()),
      safe(ds.getSharedCalendarEvents && ds.getSharedCalendarEvents()),
      safe(ds.listDepartmentMeetings && ds.listDepartmentMeetings()),
      safe(ds.getAllForMonitoring && ds.getAllForMonitoring()),
      safe(crs && crs.listPendingForReview())
    ]).then(function(res) {
      var requests = res[4];
      var ids = (requests || []).map(function(r) { return r.requester_id; });
      return safe(requests && requests.length ? crs.getRequesterProfiles(ids) : {}).then(function(profiles) {
        var d = {
          announcements: res[0],
          events: res[1],
          meetings: res[2],
          tracking: res[3] == null ? null : trackingByClass(res[3]),
          requests: requests,
          requesters: profiles || {}
        };
        renderTodo(d);
        renderAnnouncements(d.announcements);
        renderSoon(d.events, d.meetings);
        renderTracking(d.tracking);
        if (window.fhNavPatchPageLinks) fhNavPatchPageLinks(document.querySelector('.ov'));
      });
    });
  }

  // Approve or decline calendar requests without leaving the overview.
  $('ovTodo').addEventListener('click', function(e) {
    var approve = e.target.closest('[data-approve]');
    var decline = e.target.closest('[data-decline]');
    if (!approve && !decline) return;
    var btn = approve || decline;
    var id = btn.getAttribute(approve ? 'data-approve' : 'data-decline');
    var action;
    if (approve) {
      action = CalendarRequestService.approveRequest(id);
    } else {
      var reason = window.prompt('Reason for declining (optional, shown to the teacher):', '');
      if (reason === null) return;
      action = CalendarRequestService.rejectRequest(id, reason);
    }
    var buttons = btn.closest('li').querySelectorAll('button');
    buttons.forEach(function(b) { b.disabled = true; });
    action.then(function() {
      toast(approve ? 'Approved. It’s on the shared calendar.' : 'Request declined.');
      return load();
    }).catch(function(err) {
      buttons.forEach(function(b) { b.disabled = false; });
      toast((err && err.message) || 'That didn’t work. Try again.');
    });
  });

  renderHeader();
  var started = false;
  function start() {
    if (started) return;
    started = true;
    load();
  }
  if (window.__authReady) start();
  else window.addEventListener('auth-guard-ready', start);
})();
</script>
