<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quality Calendar Poster</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-init.js"></script>
<script src="allowlist-check.js"></script>
<script src="auth-guard.js"></script>
<script src="data-service.js"></script>
<link rel="icon" type="image/png" href="faculty-hub-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style id="page-size">@page { size: A3 landscape; margin: 9mm; }</style>
<style>
:root {
  --navy: #1e2d4a;
  --navy-dark: #16243c;
  --text: #1a202c;
  --text2: #4a5568;
  --text3: #718096;
  --border: #e2e8f0;
  --border2: #cbd5e0;
  --bg: #e9ecf1;
  --paper: #ffffff;
  --qi13: #16243c; --qi13-tint: #e6e9ef;
  --qi23: #0d9488; --qi23-tint: #dcf3f0;
  --qi31: #7c3aed; --qi31-tint: #eee6fd;
  --qi32: #b45309; --qi32-tint: #fbeedd;
  --font-head: 'Manrope', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body { background: var(--bg); color: var(--text); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }

/* ── Screen toolbar (not printed) ── */
.toolbar {
  position: sticky; top: 0; z-index: 5;
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center;
  padding: 10px 16px; background: var(--navy-dark); color: #fff; font-size: 13px;
}
.toolbar label { display: flex; align-items: center; gap: 6px; opacity: .9; }
.toolbar select, .toolbar button {
  font: inherit; border-radius: 6px; padding: 6px 10px; border: 1px solid rgba(255,255,255,.25);
  background: rgba(255,255,255,.08); color: #fff; cursor: pointer;
}
.toolbar select option { color: var(--text); }
.toolbar button.primary { background: #fff; color: var(--navy-dark); font-weight: 600; border-color: #fff; }
.toolbar .hint { opacity: .65; font-size: 12px; }

/* ── Poster sheet ── */
.sheet-wrap { padding: 24px 16px 48px; overflow-x: auto; }
.sheet {
  width: 402mm; min-height: 279mm; margin: 0 auto; background: var(--paper);
  box-shadow: 0 6px 30px rgba(22,36,60,.15); padding: 9mm 10mm 8mm;
  display: flex; flex-direction: column; gap: 5mm;
}
body.a4 .sheet { width: 279mm; min-height: 192mm; padding: 6mm 7mm; gap: 3.5mm; }

.poster-head {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 10mm;
  padding-bottom: 4mm; border-bottom: 2.5px solid var(--navy-dark);
}
.eyebrow { font: 700 11px/1 var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--qi23); margin-bottom: 7px; }
h1 { font: 800 40px/1 var(--font-head); color: var(--navy-dark); letter-spacing: -.02em; }
h1 .year { color: var(--text3); font-weight: 700; }
.sub { margin-top: 6px; font-size: 13px; color: var(--text2); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: flex-end; max-width: 52%; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--text2); white-space: nowrap; }
.legend-swatch { width: 12px; height: 12px; border-radius: 3px; }

/* ── Grid ── */
table { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; flex: 1; }
col.c-act { width: 15.5%; }
thead th {
  font: 700 12px/1 var(--font-head); letter-spacing: .06em; text-transform: uppercase;
  color: #fff; background: var(--navy-dark); padding: 8px 4px; text-align: center;
}
thead th:first-child { text-align: left; padding-left: 10px; border-top-left-radius: 6px; }
thead th:last-child { border-top-right-radius: 6px; }
thead th.term-start { box-shadow: inset 2px 0 0 rgba(255,255,255,.35); }

tr.cat-row td {
  padding: 6px 10px 5px; font: 800 11px/1.1 var(--font-head); letter-spacing: .08em; text-transform: uppercase; color: #fff;
}
tr.cat-row.qi13 td { background: var(--qi13); }
tr.cat-row.qi23 td { background: var(--qi23); }
tr.cat-row.qi31 td { background: var(--qi31); }
tr.cat-row.qi32 td { background: var(--qi32); }

tr.act-row td { border-bottom: 1px solid var(--border); vertical-align: middle; }
tr.act-row td + td { border-left: 1px solid var(--border); }
tr.act-row td.term-start { border-left: 1.5px solid var(--border2); }
tr.act-row:nth-child(even) td { background: #fafbfc; }
td.act-name { padding: 6px 8px 6px 10px; font: 600 12.5px/1.25 var(--font-body); color: var(--text); }
tr.act-row td.act-name { border-left: 4px solid var(--cat); }
td.cell { padding: 4px 3px; text-align: center; }

.chip {
  display: block; margin: 2px auto; padding: 3px 4px; border-radius: 4px;
  font: 700 11px/1.15 var(--font-body); color: var(--cat); background: var(--cat-tint);
  border: 1px solid color-mix(in srgb, var(--cat) 28%, transparent);
}
.chip.all { background: var(--cat); color: #fff; border-color: var(--cat); }

.qi13 { --cat: var(--qi13); --cat-tint: var(--qi13-tint); }
.qi23 { --cat: var(--qi23); --cat-tint: var(--qi23-tint); }
.qi31 { --cat: var(--qi31); --cat-tint: var(--qi31-tint); }
.qi32 { --cat: var(--qi32); --cat-tint: var(--qi32-tint); }

.poster-foot {
  display: flex; justify-content: space-between; align-items: center; gap: 8mm;
  font-size: 11px; color: var(--text3); padding-top: 1mm;
}
.poster-foot .key { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.poster-foot .chip { display: inline-block; margin: 0; min-width: 34px; }

/* A4: tighten everything */
body.a4 h1 { font-size: 24px; }
body.a4 .sub, body.a4 .legend-item { font-size: 9.5px; }
body.a4 thead th { font-size: 9.5px; padding: 6px 3px; }
body.a4 tr.cat-row td { font-size: 8.5px; padding: 4px 7px; }
body.a4 td.act-name { font-size: 9px; padding: 3px 6px; }
body.a4 td.cell { padding: 2px; }
body.a4 .chip { font-size: 8px; padding: 1px 3px; margin: 1px auto; }
body.a4 .poster-head { padding-bottom: 2.5mm; }
body.a4 .eyebrow { font-size: 8.5px; margin-bottom: 4px; }
body.a4 .poster-foot { font-size: 8.5px; }

.load-error { max-width: 560px; margin: 60px auto; padding: 20px; background: #fff; border-radius: 8px; font-size: 14px; line-height: 1.5; }

@media print {
  body { background: #fff; }
  .toolbar { display: none; }
  .sheet-wrap { padding: 0; overflow: visible; }
  .sheet { box-shadow: none; margin: 0; width: auto; min-height: 0; padding: 0; height: calc(297mm - 18mm); }
  body.a4 .sheet { height: calc(210mm - 18mm); }
  tr { break-inside: avoid; }
}
</style>
</head>
<body>

<div class="toolbar">
  <label>Paper
    <select id="paper">
      <option value="a3">A3 landscape</option>
      <option value="a4">A4 landscape</option>
    </select>
  </label>
  <label>Session <select id="session"></select></label>
  <button type="button" class="primary" onclick="window.print()">Print poster</button>
  <span class="hint">In the print dialog, turn on “Background graphics” and set margins to Default.</span>
</div>

<div class="sheet-wrap">
  <div class="sheet" id="sheet"></div>
</div>

<script src="quality-calendar-qi-focus.js"></script>
<script src="quality-calendar-months.js"></script>
<script>
(function () {
  var MONTHS = window.QualityCalendarMonthsData;
  var ORDER = window.QualityCalendarMonthsOrder;
  var sheet = document.getElementById('sheet');

  if (!Array.isArray(MONTHS) || !MONTHS.length) {
    sheet.outerHTML = '<div class="load-error">The calendar data didn’t load. Keep this file in the same folder as ' +
      '<code>quality-calendar-qi-focus.js</code> and <code>quality-calendar-months.js</code>.</div>';
    return;
  }

  var CAT_ORDER = ['qi13', 'qi23', 'qi31', 'qi32'];
  var CAT_NAMES = {
    qi13: 'QI 1.3 Leadership of change',
    qi23: 'QI 2.3 Learning, teaching & assessment',
    qi31: 'QI 3.1 Wellbeing, equality & inclusion',
    qi32: 'QI 3.2 Raising attainment & achievement'
  };
  var MONTH_LONG = { Aug: 'Aug', Sept: 'Sep', Oct: 'Oct', Nov: 'Nov', Dec: 'Dec', Jan: 'Jan', Feb: 'Feb', Mar: 'Mar', Apr: 'Apr', May: 'May', June: 'Jun' };
  var TERM_STARTS = { Aug: true, Jan: true };   // calendar-year break, as a visual guide

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
  }

  /** Scottish session: August → July. */
  function defaultSession() {
    var d = new Date();
    var y0 = d.getMonth() >= 7 ? d.getFullYear() : d.getFullYear() - 1;
    return y0;
  }

  // Rows: one per activity, grouped by QI area, in first-seen order through the year.
  var rows = {}; CAT_ORDER.forEach(function (c) { rows[c] = []; });
  var seen = {};
  var lookup = {};   // month::key → focus[]
  MONTHS.forEach(function (md) {
    md.categories.forEach(function (cat) {
      cat.activities.forEach(function (act) {
        lookup[md.month + '::' + act.key] = act.focus;
        if (!seen[act.key]) { seen[act.key] = true; rows[cat.cat].push(act); }
      });
    });
  });

  function chips(focus) {
    return focus.map(function (f) {
      if (f === '*') return '<span class="chip all">All</span>';
      return '<span class="chip">' + esc(f.replace(/^Process (\w)/, function (m, c) { return c.toUpperCase(); })) + '</span>';
    }).join('');
  }

  function render(y0) {
    var session = y0 + '–' + String(y0 + 1).slice(-2);
    var html = '';
    html += '<header class="poster-head"><div>' +
      '<div class="eyebrow">Knightswood Secondary · Art &amp; Drama</div>' +
      '<h1>Quality Calendar <span class="year">' + session + '</span></h1>' +
      '<p class="sub">Self-evaluation and quality improvement activities by month, grouped by HGIOS4 quality indicator.</p>' +
      '</div><div class="legend">' +
      CAT_ORDER.map(function (c) {
        return '<span class="legend-item"><span class="legend-swatch" style="background:var(--' + c + ')"></span>' + esc(CAT_NAMES[c]) + '</span>';
      }).join('') + '</div></header>';

    html += '<table><colgroup><col class="c-act">' + ORDER.map(function () { return '<col>'; }).join('') + '</colgroup>';
    html += '<thead><tr><th>Activity</th>' + ORDER.map(function (m) {
      var yr = (m === 'Aug' || m === 'Sept' || m === 'Oct' || m === 'Nov' || m === 'Dec') ? y0 : y0 + 1;
      return '<th' + (TERM_STARTS[m] && m !== 'Aug' ? ' class="term-start"' : '') + '>' + MONTH_LONG[m] +
        (TERM_STARTS[m] ? ' <span style="opacity:.6;font-weight:600">' + String(yr).slice(-2) + '</span>' : '') + '</th>';
    }).join('') + '</tr></thead><tbody>';

    CAT_ORDER.forEach(function (c) {
      if (!rows[c].length) return;
      html += '<tr class="cat-row ' + c + '"><td colspan="' + (ORDER.length + 1) + '">' + esc(CAT_NAMES[c]) + '</td></tr>';
      rows[c].forEach(function (act) {
        html += '<tr class="act-row ' + c + '"><td class="act-name">' + esc(act.name) + '</td>';
        ORDER.forEach(function (m) {
          var focus = lookup[m + '::' + act.key];
          var cls = 'cell' + (TERM_STARTS[m] && m !== 'Aug' ? ' term-start' : '');
          html += '<td class="' + cls + '">' + (focus ? chips(focus) : '') + '</td>';
        });
        html += '</tr>';
      });
    });
    html += '</tbody></table>';

    html += '<footer class="poster-foot"><div class="key qi23">' +
      '<span class="chip all">All</span> all year groups' +
      '<span class="chip">S1-3</span> year-group focus for that month' +
      '</div><div>Faculty Hub · Quality Calendar · source: QI Calendar (Quality_Calendar_Full.xlsx)</div></footer>';

    sheet.innerHTML = html;
  }

  // Session picker: this session, the previous one and the next one.
  var sel = document.getElementById('session');
  var cur = defaultSession();
  var asked = parseInt(new URLSearchParams(location.search).get('session'), 10);   // e.g. ?session=2026 from the planner
  var years = [cur - 1, cur, cur + 1];
  if (asked > 2000 && asked < 2100) {
    if (years.indexOf(asked) === -1) years.push(asked);
    years.sort();
    cur = asked;
  }
  years.forEach(function (y) {
    var o = document.createElement('option');
    o.value = y; o.textContent = y + '–' + String(y + 1).slice(-2);
    if (y === cur) o.selected = true;
    sel.appendChild(o);
  });
  sel.addEventListener('change', function () { render(+sel.value); });

  document.getElementById('paper').addEventListener('change', function (e) {
    var a4 = e.target.value === 'a4';
    document.body.classList.toggle('a4', a4);
    document.getElementById('page-size').textContent = '@page { size: ' + (a4 ? 'A4' : 'A3') + ' landscape; margin: 9mm; }';
  });

  render(cur);
})();
</script>
</body>
</html>
