<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Leadership — Faculty Head</title>
<link rel="icon" type="image/png" href="faculty-hub-logo.png">
<script src="config.js"></script>
<script src="embed-chrome.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-init.js"></script>
<script src="allowlist-check.js"></script>
<script src="auth-guard.js"></script>
<script src="fh-access.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="design-tokens.css">
<link rel="stylesheet" href="faculty-shell.css">
<link rel="stylesheet" href="fh-mobile-shell.css">
<style>
.lead-page{max-width:1080px;margin:0 auto;padding:16px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.lead-page *{box-sizing:border-box}
.lead-page h1{font-family:var(--font-heading);font-size:var(--fs-xl);font-weight:700;letter-spacing:-.02em;color:var(--ink-900);margin:0}
.lead-intro{margin:4px 0 0;color:var(--ink-500);font-size:var(--fs-sm);line-height:1.45}
.lead-group{margin-top:24px}
.lead-group h2{margin:0 0 10px;font-size:var(--fs-xs);font-weight:700;color:var(--ink-500);text-transform:uppercase;letter-spacing:.08em}
.lead-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.lead-card{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;min-height:44px;background:#fff;border:1px solid var(--navy-100);border-radius:var(--r-lg);text-decoration:none;color:inherit;transition:border-color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
.lead-card:focus-visible{outline:none;box-shadow:var(--sh-ring)}
.lead-icon{width:34px;height:34px;border-radius:9px;background:var(--navy-050);color:var(--navy-700);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lead-icon svg{width:17px;height:17px}
.lead-title{font-size:var(--fs-base);font-weight:600;color:var(--ink-900);line-height:1.3}
.lead-desc{margin-top:3px;font-size:var(--fs-sm);color:var(--ink-500);line-height:1.4}
.lead-where{margin-top:6px;font-size:var(--fs-xs);color:var(--ink-400)}
@media (hover:hover) and (pointer:fine){
  .lead-card:hover{border-color:var(--navy-400);box-shadow:var(--sh-sm)}
}
</style>
</head>
<body class="fh-mobile-page fh-hub-page">
<main class="lead-page">
  <h1>Leadership</h1>
  <p class="lead-intro">Planning, quality and running the faculty. Tools marked “Opens in Staff Hub” live there and open in the staff view.</p>
  <div id="leadGroups"></div>
</main>
<script src="fh-nav-config.js"></script>
<script>
(function() {
  'use strict';
  var ICONS = {
    dip: '<path d="M12 20l9-5-9-5-9 5 9 5z"/><path d="M12 12l9-5-9-5-9 5 9 5z"/>',
    gantt: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h2v6H7zM11 12h2v3h-2zM15 8h2v7h-2z"/>',
    quality: '<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
    visits: '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',
    targets: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
    meetings: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    procurement: '<path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>',
    backup: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>'
  };
  function esc(v) {
    return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  var groups = (window.FH_NAV && FH_NAV.leadershipTools) || [];
  document.getElementById('leadGroups').innerHTML = groups.map(function(g) {
    return '<section class="lead-group"><h2>' + esc(g.group) + '</h2><div class="lead-grid">' +
      g.items.map(function(it) {
        var inStaffHub = it.href.indexOf('faculty-hub.html') === 0;
        var href = window.fhNavHref ? fhNavHref(it.href) : it.href;
        return '<a class="lead-card" href="' + esc(href) + '">' +
          '<span class="lead-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">' + (ICONS[it.icon] || ICONS.dip) + '</svg></span>' +
          '<span><span class="lead-title">' + esc(it.label) + '</span>' +
          '<span class="lead-desc" style="display:block">' + esc(it.desc) + '</span>' +
          (inStaffHub ? '<span class="lead-where" style="display:block">Opens in Staff Hub</span>' : '') +
          '</span></a>';
      }).join('') + '</div></section>';
  }).join('');
  if (window.fhEmbedPatchLinks) window.fhEmbedPatchLinks();
})();
</script>
<script src="fh-top-nav.js"></script>
</body>
</html>
