<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Senior Phase Tracking — Faculty Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../tracking-suite-theme.css">
  <link rel="stylesheet" href="spt-styles.css">
  <script src="spt-config.js"></script>
</head>
<body class="th-suite th-suite--senior">
  <script>
    (function() {
      if (window.SptConfig && !window.SptConfig.useSeedData) {
        document.body.classList.add('spt-hub-mode');
      } else {
        document.body.classList.add('spt-dev-seed');
      }
    })();
  </script>
  <div class="ts-top-bar ts-top-bar--teal" id="spt-top-bar" aria-hidden="true"></div>
  <div class="ts-page-bg" aria-hidden="true"></div>

  <header class="spt-hub-chrome is-hidden" id="spt-hub-chrome">
    <span class="ts-phase-badge ts-phase-badge--senior">Senior Phase</span>
    <span class="spt-hub-chrome-title">Senior Phase Tracking</span>
    <span class="spt-hub-chrome-sub">Qualification courses · S4–S6</span>
  </header>

  <header class="dev-banner" id="dev-banner" role="banner">
    <div class="dev-banner-main">
      <a href="../../tracking_monitoring_landing.html" class="dev-banner-home is-hidden" id="hub-back-link">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        Tracking home
      </a>
      <div>
        <strong>Senior Phase Tracking</strong>
        <p id="dev-banner-note" hidden></p>
      </div>
    </div>
    <div class="dev-banner-controls">
      <button type="button" class="layout-toggle" id="nav-toggle" aria-pressed="false" title="Toggle navigation (N)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 9l-3 3 3 3"/></svg>
        <span id="nav-toggle-label">Hide menu</span>
      </button>
      <label for="dev-role">View as</label>
      <select id="dev-role" aria-label="Simulated role">
        <option value="faculty_head">Faculty Head / Admin</option>
        <option value="class_teacher">Class Teacher</option>
        <option value="read_only">Read Only / SLT</option>
      </select>
      <label for="dev-teacher">Teacher</label>
      <select id="dev-teacher" aria-label="Simulated teacher"></select>
    </div>
  </header>

  <div class="app-shell" id="app-shell">
    <button type="button" class="nav-edge-tab" id="nav-edge-open" aria-label="Show navigation" title="Show menu (N)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="sidebar-brand">
        <div class="sidebar-brand-title">Senior Phase</div>
        <div class="sidebar-brand-sub">Tracking</div>
      </div>
      <nav class="sidebar-primary" aria-label="Primary">
        <button type="button" class="nav-btn active" data-route="dashboard" id="nav-home">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
          Home
        </button>
        <button type="button" class="nav-btn" data-route="courses" id="nav-classes">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19h16M6 17V7M10 17V4M14 17v-6M18 17V9"/></svg>
          My classes
        </button>
        <button type="button" class="nav-btn" data-route="attention" id="nav-attention">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
          Needs attention
        </button>
        <button type="button" class="nav-btn" data-route="register" id="nav-register">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3V3z"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>
          Register
        </button>
      </nav>
      <div class="sidebar-more-wrap">
        <button type="button" class="nav-more-toggle" id="nav-more-toggle" aria-expanded="false" aria-controls="nav-more">
          More
          <svg class="nav-more-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="sidebar-more" id="nav-more" hidden>
          <button type="button" class="nav-btn nav-btn--quiet" data-route="alerts" id="nav-alerts">Alerts</button>
          <button type="button" class="nav-btn nav-btn--quiet" data-route="feedback" id="nav-feedback">Concern updates</button>
          <button type="button" class="nav-btn nav-btn--quiet" data-route="setup" id="nav-setup">Setup</button>
          <button type="button" class="nav-btn nav-btn--quiet" data-route="evidence">Evidence bank</button>
          <button type="button" class="nav-btn nav-btn--quiet" data-route="level-changes">Level changes</button>
          <button type="button" class="nav-btn nav-btn--quiet" data-route="interventions">Interventions</button>
          <button type="button" class="nav-btn nav-btn--quiet" data-route="import">Import</button>
          <button type="button" class="nav-btn nav-btn--quiet" data-route="reports">Reports</button>
          <button type="button" class="nav-btn nav-btn--quiet" data-route="overview" id="nav-overview">Charts</button>
        </div>
      </div>
    </aside>
    <main class="main" id="app-main" role="main"></main>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop" aria-hidden="true"></div>
  <aside class="drawer" id="pupil-drawer" aria-label="Pupil profile">
    <div class="drawer-head">
      <div>
        <h2 id="drawer-title">Pupil profile</h2>
        <p id="drawer-sub" class="drawer-sub"></p>
      </div>
      <button type="button" class="drawer-close" id="drawer-close" aria-label="Close">&times;</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <div class="modal-backdrop" id="modal-backdrop" hidden></div>
  <div class="modal" id="app-modal" role="dialog" aria-modal="true" hidden>
    <div class="modal-head">
      <h2 id="modal-title">Dialog</h2>
      <button type="button" class="drawer-close" id="modal-close" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>

  <script src="../../config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../supabase-init.js"></script>
  <script src="../../data-service.js"></script>
  <script src="spt-evidence.js"></script>
  <script src="spt-baseline.js"></script>
  <script src="spt-exam-mark.js"></script>
  <script>
    (function() {
      if (!window.SptConfig || !window.SptConfig.useSeedData) return;
      ['spt-seed-roster.js', 'spt-seed.js'].forEach(function(src) {
        document.write('<script src="' + src + '"><\/script>');
      });
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="spt-working-grade.js"></script>
  <script src="spt-risk.js"></script>
  <script src="spt-prelim.js"></script>
  <script src="spt-concerns.js"></script>
  <script src="spt-interventions.js"></script>
  <script src="spt-feedback.js"></script>
  <script src="spt-level-change.js"></script>
  <script src="spt-store.js"></script>
  <script src="spt-sync.js"></script>
  <script src="spt-hub-staff.js"></script>
  <script src="spt-template.js"></script>
  <script src="spt-import.js"></script>
  <script src="spt-attendance-import.js"></script>
  <script src="spt-reports.js"></script>
  <script src="spt-export.js"></script>
  <script src="spt-qs-bridge.js"></script>
  <script src="spt-app.js"></script>
  <div class="ts-bottom-bar ts-bottom-bar--teal" aria-hidden="true"></div>
</body>
</html>
