<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drama Timeline Posters</title>
<link rel="icon" type="image/png" href="faculty-hub-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<script src="academic-calendar-defaults.js"></script>
<script src="curriculum-units.js"></script>
<script src="drama-curriculum-manifest.js"></script>
<script src="drama-curriculum-calendar.js"></script>
<style id="page-size">@page { size: A3 landscape; margin: 9mm; }</style>
<style>
/*
 * BGE Drama course timeline posters — one A3 landscape sheet per year group.
 * Built from DramaCurriculumCalendar (drama-curriculum-calendar.js), so the poster
 * follows the same week plan as the Teacher Planner banner. ?year=S2 prints one year.
 */
:root {
  --navy: #1e2d4a;
  --navy-dark: #16243c;
  --text: #1a202c;
  --text2: #4a5568;
  --text3: #718096;
  --border: #e2e8f0;
  --border2: #cbd5e0;
  --bg: #e9ecf1;
  --paper: #ffffff;
  --holiday: #eef1f5;
  --drama: #e11d48;
  --font-head: 'Manrope', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, sans-serif;
  --label-w: 64mm;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body { background: var(--bg); color: var(--text); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }

/* ── Screen toolbar (not printed) ── */
.toolbar {
  position: sticky; top: 0; z-index: 5;
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center;
  padding: 10px 16px; background: var(--navy-dark); color: #fff; font-size: 13px;
}
.toolbar label { display: flex; align-items: center; gap: 6px; opacity: .9; }
.toolbar select, .toolbar button {
  font: inherit; border-radius: 6px; padding: 6px 10px; border: 1px solid rgba(255,255,255,.25);
  background: rgba(255,255,255,.08); color: #fff; cursor: pointer;
}
.toolbar select option { color: var(--text); }
.toolbar button.primary { background: #fff; color: var(--navy-dark); font-weight: 600; border-color: #fff; }
.toolbar .hint { opacity: .65; font-size: 12px; }

/* ── Poster sheet ── */
.sheets { padding: 24px 16px 48px; overflow-x: auto; display: flex; flex-direction: column; gap: 28px; }
.sheet {
  width: 402mm; height: 279mm; margin: 0 auto; background: var(--paper);
  box-shadow: 0 6px 30px rgba(22,36,60,.15); padding: 10mm 11mm 8mm;
  display: flex; flex-direction: column; gap: 6mm; overflow: hidden;
  border-top: 5mm solid var(--year);
}

.poster-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 10mm; }
.eyebrow { font: 700 12px/1 var(--font-body); letter-spacing: .16em; text-transform: uppercase; color: var(--year); margin-bottom: 8px; }
h1 { font: 800 64px/.95 var(--font-head); color: var(--navy-dark); letter-spacing: -.03em; }
h1 .year { color: var(--year); }
.sub { margin-top: 8px; font-size: 15px; color: var(--text2); }
.stats { display: flex; gap: 7mm; }
.stat { text-align: right; }
.stat b { display: block; font: 800 36px/1 var(--font-head); color: var(--navy-dark); }
.stat span { font: 600 11px/1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--text3); }

/* ── Gantt ── */
.gantt {
  flex: 1; min-height: 0;
  display: grid; grid-template-columns: var(--label-w) repeat(var(--cols), 1fr);
  border: 1.5px solid var(--navy-dark); border-radius: 8px; overflow: hidden; position: relative;
}
.g-corner { background: var(--navy-dark); color: rgba(255,255,255,.7); font: 700 10px/1 var(--font-body); letter-spacing: .1em; text-transform: uppercase; padding: 0 10px; display: flex; align-items: flex-end; padding-bottom: 6px; }
.g-term { background: var(--navy-dark); color: #fff; font: 800 12px/1 var(--font-head); letter-spacing: .1em; text-transform: uppercase; padding: 8px 6px 5px; text-align: center; border-left: 1px solid rgba(255,255,255,.18); }
.g-term.break { background: #2b3a55; color: rgba(255,255,255,.55); font-size: 9px; letter-spacing: .04em; }
.g-month { background: #2b3a55; color: #fff; font: 700 11px/1 var(--font-body); padding: 5px 5px; border-left: 1px solid rgba(255,255,255,.18); white-space: nowrap; overflow: hidden; }
.g-wk { background: #f4f6f9; color: var(--text3); font: 600 9.5px/1 var(--font-body); text-align: center; padding: 5px 0; border-bottom: 1.5px solid var(--navy-dark); border-left: 1px solid var(--border); }
.g-wk.hol { background: var(--holiday); }
.g-wk-label { background: #f4f6f9; border-bottom: 1.5px solid var(--navy-dark); font: 700 9.5px/1 var(--font-body); color: var(--text3); letter-spacing: .06em; text-transform: uppercase; padding: 5px 10px; }

.g-label {
  display: flex; align-items: center; gap: 9px; padding: 0 10px; border-bottom: 1px solid var(--border);
  background: #fff; z-index: 2; min-height: 0;
}
.g-num {
  flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--c); color: #fff;
  display: grid; place-items: center; font: 800 15px/1 var(--font-head);
}
.g-name { font: 700 16px/1.15 var(--font-head); color: var(--navy-dark); }
.g-name small { display: block; font: 500 12px/1.2 var(--font-body); color: var(--text3); margin-top: 2px; }
.g-cell { border-bottom: 1px solid var(--border); border-left: 1px solid #f0f2f5; }
.g-cell.hol { background: var(--holiday); }
.g-cell.month-start { border-left-color: var(--border2); }

.g-hol {
  z-index: 4; display: flex; align-items: center; justify-content: center; pointer-events: none;
  background: repeating-linear-gradient(135deg, rgba(148,163,184,.22) 0 3px, rgba(255,255,255,.55) 3px 7px);
  border-left: 1px solid var(--border2); border-right: 1px solid var(--border2);
}
.g-hol span {
  writing-mode: vertical-rl; transform: rotate(180deg); font: 800 10.5px/1 var(--font-head);
  letter-spacing: .14em; text-transform: uppercase; color: #64748b; background: rgba(255,255,255,.9); padding: 6px 2px; border-radius: 3px;
}

.g-bar {
  z-index: 3; align-self: center; height: 62%; max-height: 16mm; margin: 0 1px;
  background: linear-gradient(90deg, var(--c), color-mix(in srgb, var(--c) 78%, #fff));
  border-radius: 6px; color: #fff; display: flex; align-items: center; gap: 6px; padding: 0 8px; overflow: hidden;
  box-shadow: 0 1px 0 rgba(0,0,0,.08), inset 0 -2px 0 rgba(0,0,0,.12);
  font: 700 14px/1.1 var(--font-head); white-space: nowrap;
}
.g-bar .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.g-bar .wks { font: 600 10px/1 var(--font-body); opacity: .85; }
.g-bar.short { justify-content: center; padding: 0 2px; }
.g-bar .tp {
  margin-left: auto; flex: none; background: #fff; color: var(--c); border-radius: 999px;
  font: 800 11px/1 var(--font-head); padding: 5px 8px; letter-spacing: .03em;
}
.g-bar.short .tp { margin-left: 0; }
.g-bar.note { background: repeating-linear-gradient(135deg, var(--c) 0 8px, color-mix(in srgb, var(--c) 82%, #fff) 8px 16px); }

.g-marker { z-index: 5; pointer-events: none; border-left: 2px dashed var(--navy-dark); position: relative; }
.g-marker span {
  position: absolute; top: 6px; right: 6px; white-space: nowrap; background: var(--navy-dark); color: #fff;
  font: 700 9.5px/1 var(--font-body); padding: 4px 6px; border-radius: 4px; letter-spacing: .04em;
}

/* ── Unit cards ── */
.cards { display: grid; grid-template-columns: repeat(var(--card-cols), 1fr); gap: 4mm; flex: none; height: 62mm; }
.card {
  border: 1px solid var(--border); border-top: 4px solid var(--c); border-radius: 8px; padding: 9px 11px 10px;
  display: flex; flex-direction: column; gap: 6px; min-height: 0; overflow: hidden; background: #fff;
}
.card-top { display: flex; align-items: center; gap: 7px; }
.card-top .g-num { width: 22px; height: 22px; font-size: 11px; }
.card h3 { font: 800 13.5px/1.15 var(--font-head); color: var(--navy-dark); }
.card .when { font: 600 10.5px/1.3 var(--font-body); color: var(--c); }
.card p { font-size: 10.5px; line-height: 1.4; color: var(--text2); }
.card .assess { margin-top: auto; padding-top: 6px; border-top: 1px dashed var(--border2); font-size: 10px; line-height: 1.35; color: var(--text2); }
.card .assess b { color: var(--c); font: 800 10px/1 var(--font-head); letter-spacing: .04em; }
.chips { display: flex; flex-wrap: wrap; gap: 3px; }
.chips span { font: 600 9px/1 var(--font-body); padding: 3px 6px; border-radius: 999px; background: color-mix(in srgb, var(--c) 12%, #fff); color: color-mix(in srgb, var(--c) 80%, #000); }

.poster-foot { display: flex; justify-content: space-between; align-items: center; gap: 8mm; font-size: 10.5px; color: var(--text3); }
.key { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.key i { display: inline-block; width: 22px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }
.key .k-unit { background: var(--year); }
.key .k-hol { background: repeating-linear-gradient(135deg, rgba(148,163,184,.4) 0 3px, #fff 3px 6px); border: 1px solid var(--border2); }
.key .k-tp { background: #fff; border: 1.5px solid var(--year); border-radius: 999px; width: 26px; }
.key .k-line { width: 0; height: 12px; border-left: 2px dashed var(--navy-dark); border-radius: 0; }

/* A4: scale the whole sheet down so the layout stays identical */
body.a4 .sheet { zoom: .707; }

.load-error { max-width: 560px; margin: 60px auto; padding: 20px; background: #fff; border-radius: 8px; font-size: 14px; line-height: 1.5; }

@media print {
  body { background: #fff; }
  .toolbar { display: none; }
  .sheets { padding: 0; gap: 0; overflow: visible; display: block; }
  .sheet { box-shadow: none; margin: 0; width: auto; height: calc(297mm - 18mm); break-after: page; page-break-after: always; }
  .sheet:last-child { break-after: auto; page-break-after: auto; }
  body.a4 .sheet { zoom: 1; height: calc(210mm - 14mm); padding: 6mm 7mm 5mm; border-top-width: 3.5mm; gap: 4mm; }
  body.a4 .cards { height: 44mm; gap: 2.5mm; }
  body.a4 { --label-w: 46mm; }
  body.a4 h1 { font-size: 40px; }
  body.a4 .sub { font-size: 11px; }
  body.a4 .stat b { font-size: 24px; }
  body.a4 .stat span, body.a4 .eyebrow { font-size: 8.5px; }
  body.a4 .g-name { font-size: 10px; } body.a4 .g-name small { font-size: 8px; }
  body.a4 .g-num { width: 20px; height: 20px; font-size: 9.5px; }
  body.a4 .g-term, body.a4 .g-month { font-size: 8.5px; } body.a4 .g-wk { font-size: 7px; }
  body.a4 .g-bar { font-size: 8.5px; padding: 0 4px; } body.a4 .g-bar .tp { font-size: 7.5px; padding: 2px 4px; } body.a4 .g-bar .wks { font-size: 7px; }
  body.a4 .g-hol span { font-size: 7.5px; }
  body.a4 .card { padding: 6px 7px; gap: 4px; } body.a4 .card h3 { font-size: 10px; }
  body.a4 .card .when, body.a4 .card p, body.a4 .card .assess { font-size: 7.5px; }
  body.a4 .chips span { font-size: 6.5px; } body.a4 .poster-foot { font-size: 8px; }
}
</style>
</head>
<body>
<div class="toolbar">
  <label>Year group
    <select id="year-select">
      <option value="all">All (S1–S3)</option>
      <option value="S1">S1</option>
      <option value="S2">S2</option>
      <option value="S3">S3</option>
    </select>
  </label>
  <label>Paper
    <select id="paper-select">
      <option value="a3">A3 landscape</option>
      <option value="a4">A4 landscape</option>
    </select>
  </label>
  <button type="button" class="primary" onclick="window.print()">Print posters</button>
  <span class="hint">One poster per page · turn on “Background graphics” if colours are missing</span>
</div>
<div class="sheets" id="sheets"></div>

<script>
(function () {
  'use strict';

  var YEAR_COLOURS = { S1: '#e11d48', S2: '#2563eb', S3: '#7c3aed' };
  var YEAR_LEVEL = { S1: 'Third Level', S2: 'Third Level', S3: 'Fourth Level' };
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var MONTHS_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function parseIso(str) {
    var p = String(str).split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }

  function shortDate(iso, addDays) {
    var d = parseIso(iso);
    if (addDays) d.setDate(d.getDate() + addDays);
    return d.getDate() + ' ' + MONTHS[d.getMonth()];
  }

  /** Calendar columns: one per Monday, with month, term and holiday runs. */
  function buildColumns(weeks) {
    var cols = weeks.map(function (w, i) {
      var d = parseIso(w.monday);
      return { i: i, monday: w.monday, schoolWeek: w.schoolWeek, holiday: w.holiday, month: d.getMonth(), year: d.getFullYear() };
    });
    // Drop trailing columns with no teaching (summer).
    while (cols.length && !cols[cols.length - 1].schoolWeek) cols.pop();
    return cols;
  }

  function runs(cols, keyFn) {
    var out = [];
    cols.forEach(function (c, i) {
      var k = keyFn(c);
      var last = out[out.length - 1];
      if (last && last.key === k) last.to = i;
      else out.push({ key: k, from: i, to: i, col: c });
    });
    return out;
  }

  function colForSchoolWeek(cols, n) {
    for (var i = 0; i < cols.length; i++) if (cols[i].schoolWeek === n) return i;
    return -1;
  }

  function sessionLabel(cols) {
    var a = cols[0].year, b = cols[cols.length - 1].year;
    return a + '–' + String(b).slice(2);
  }

  function renderSheet(year, plan, cols) {
    var blocks = plan[year] || [];
    var manifest = (window.DRAMA_CURRICULUM && window.DRAMA_CURRICULUM.units) || {};
    var tps = (window.CURRICULUM_TPS && window.CURRICULUM_TPS.drama && window.CURRICULUM_TPS.drama[year.toLowerCase()]) || [];
    var tpByLabel = {};
    tps.forEach(function (t) { tpByLabel[t.label] = t; });

    var N = cols.length;
    var ROW0 = 4; // rows 1–3 are term, month, week number headers
    var html = [];

    // Header rows
    html.push('<div class="g-corner" style="grid-row:1 / 3;grid-column:1">' + esc(sessionLabel(cols)) + ' session</div>');
    var termNo = 0;
    runs(cols, function (c) { return c.schoolWeek ? 'term' : 'break:' + c.holiday; }).forEach(function (r) {
      var isBreak = r.key !== 'term';
      if (!isBreak) termNo++;
      var span = r.to - r.from + 1;
      html.push('<div class="g-term' + (isBreak ? ' break' : '') + '" style="grid-row:1;grid-column:' + (r.from + 2) + ' / span ' + span + '">' +
        (isBreak ? '' : 'Term ' + termNo) + '</div>');
    });
    runs(cols, function (c) { return c.year + '-' + c.month; }).forEach(function (r) {
      var span = r.to - r.from + 1;
      var label = span >= 3 ? MONTHS_LONG[r.col.month] : MONTHS[r.col.month];
      html.push('<div class="g-month" style="grid-row:2;grid-column:' + (r.from + 2) + ' / span ' + span + '">' + label + '</div>');
    });
    html.push('<div class="g-wk-label" style="grid-row:3;grid-column:1">School week</div>');
    cols.forEach(function (c, i) {
      html.push('<div class="g-wk' + (c.schoolWeek ? '' : ' hol') + '" style="grid-row:3;grid-column:' + (i + 2) + '">' + (c.schoolWeek || '') + '</div>');
    });

    // Unit rows
    var lastRow = ROW0 + blocks.length - 1;
    blocks.forEach(function (b, bi) {
      var row = ROW0 + bi;
      var num = bi + 1;
      html.push('<div class="g-label" style="grid-row:' + row + ';--c:' + b.colour + '"><span class="g-num">' + num + '</span>' +
        '<span class="g-name">' + esc(b.title) + '<small>Weeks ' + b.from + (b.to !== b.from ? '–' + b.to : '') + (b.tpLabel ? ' · ' + b.tpLabel : '') + '</small></span></div>');
      cols.forEach(function (c, i) {
        var monthStart = i > 0 && cols[i - 1].month !== c.month;
        html.push('<div class="g-cell' + (c.schoolWeek ? '' : ' hol') + (monthStart ? ' month-start' : '') + '" style="grid-row:' + row + ';grid-column:' + (i + 2) + '"></div>');
      });
      var a = colForSchoolWeek(cols, b.from);
      var z = colForSchoolWeek(cols, b.to);
      if (a < 0 || z < 0) return;
      var span = z - a + 1;
      var short = span < 6;
      var inner = short
        ? (b.tpLabel ? '<span class="tp">' + esc(b.tpLabel) + '</span>' : '')
        : '<span class="t">' + esc(b.title) + '</span>' + (span >= 7 ? ' <span class="wks">Wks ' + b.from + '–' + b.to + '</span>' : '') +
          (b.tpLabel ? '<span class="tp">' + esc(b.tpLabel) + '</span>' : '');
      html.push('<div class="g-bar' + (short ? ' short' : '') + (b.note ? ' note' : '') + '" title="' + esc(b.title) + '" style="grid-row:' + row + ';grid-column:' + (a + 2) + ' / span ' + span + ';--c:' + b.colour + '">' + inner + '</div>');
    });

    // Holiday overlays across all unit rows
    runs(cols, function (c) { return c.schoolWeek ? '' : c.holiday; }).forEach(function (r) {
      if (!r.key) return;
      var span = r.to - r.from + 1;
      var label = r.key.replace(/\s*&\s*New Year/, '').replace(/ Week$/, '');
      html.push('<div class="g-hol" style="grid-row:' + ROW0 + ' / ' + (lastRow + 1) + ';grid-column:' + (r.from + 2) + ' / span ' + span + '"><span>' + esc(label) + '</span></div>');
    });

    // New timetable marker
    var ntBlock = null;
    Object.keys(plan).forEach(function (y) {
      (plan[y] || []).forEach(function (b) { if (b.note && (!ntBlock || b.from < ntBlock.from)) ntBlock = b; });
    });
    if (ntBlock) {
      var nc = colForSchoolWeek(cols, ntBlock.from);
      if (nc >= 0) {
        html.push('<div class="g-marker" style="grid-row:' + ROW0 + ' / ' + (lastRow + 1) + ';grid-column:' + (nc + 2) + '"><span>' + esc(ntBlock.note) + ' · w/c ' + shortDate(cols[nc].monday) + '</span></div>');
      }
    }

    // Unit cards
    var cards = blocks.map(function (b, bi) {
      var u = b.unitId ? manifest[b.unitId] : null;
      var tp = b.tpLabel ? tpByLabel[b.tpLabel] : null;
      var a = colForSchoolWeek(cols, b.from), z = colForSchoolWeek(cols, b.to);
      var when = a >= 0 && z >= 0 ? shortDate(cols[a].monday) + ' – ' + shortDate(cols[z].monday, 4) : '';
      var skills = (u && u.meta_skills) || (tp && tp.meta_skills) || [];
      var desc = (u && u.desc) || '';
      if (u && u.year !== year) desc = '';
      return '<div class="card" style="--c:' + b.colour + '">' +
        '<div class="card-top"><span class="g-num">' + (bi + 1) + '</span><h3>' + esc(b.title) + '</h3></div>' +
        '<div class="when">Wks ' + b.from + (b.to !== b.from ? '–' + b.to : '') + (when ? ' · ' + when : '') + (b.note ? ' · ' + esc(b.note) : '') + '</div>' +
        (desc ? '<p>' + esc(desc) + '</p>' : '') +
        (skills.length ? '<div class="chips">' + skills.map(function (s) { return '<span>' + esc(s) + '</span>'; }).join('') + '</div>' : '') +
        (b.assessed ? '<div class="assess"><b>' + esc(b.tpLabel) + ' ASSESSMENT</b><br>' + esc(b.assessed) + '</div>' : '') +
        '</div>';
    }).join('');

    var teachingWeeks = cols.filter(function (c) { return c.schoolWeek; }).length;
    var tpCount = blocks.filter(function (b) { return b.tpLabel; }).length;

    return '<section class="sheet" style="--year:' + YEAR_COLOURS[year] + ';--cols:' + N + ';--card-cols:' + Math.max(blocks.length, 4) + '">' +
      '<header class="poster-head"><div>' +
        '<div class="eyebrow">Expressive Arts · Drama · BGE ' + esc(YEAR_LEVEL[year]) + ' · Session ' + esc(sessionLabel(cols)) + '</div>' +
        '<h1><span class="year">' + year + '</span> Drama Course Timeline</h1>' +
        '<div class="sub">What every ' + year + ' Drama class is learning, week by week, and when each Tracking Point is assessed.</div>' +
      '</div><div class="stats">' +
        '<div class="stat"><b>' + blocks.length + '</b><span>Units</span></div>' +
        '<div class="stat"><b>' + tpCount + '</b><span>Tracking points</span></div>' +
        '<div class="stat"><b>' + teachingWeeks + '</b><span>Teaching weeks</span></div>' +
      '</div></header>' +
      '<div class="gantt" style="grid-template-rows:auto auto auto repeat(' + blocks.length + ', minmax(0, 1fr))">' + html.join('') + '</div>' +
      '<div class="cards">' + cards + '</div>' +
      '<footer class="poster-foot"><div class="key">' +
        '<span><i class="k-unit"></i>Unit</span>' +
        '<span><i class="k-tp"></i>Tracking point assessed</span>' +
        '<span><i class="k-hol"></i>School holiday</span>' +
        (ntBlock ? '<span><i class="k-line"></i>New timetable starts</span>' : '') +
      '</div><div>Faculty Hub · Drama curriculum calendar · printed ' + esc(new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })) + '</div></footer>' +
      '</section>';
  }

  function render() {
    var root = document.getElementById('sheets');
    var cal = window.DramaCurriculumCalendar;
    if (!cal) {
      root.innerHTML = '<div class="load-error">The Drama curriculum calendar could not be loaded. Check that drama-curriculum-calendar.js is available.</div>';
      return;
    }
    var plan = cal.getPlan();
    var cols = buildColumns(cal.getWeeks());
    var pick = document.getElementById('year-select').value;
    var years = pick === 'all' ? cal.YEARS : [pick];
    root.innerHTML = years.map(function (y) { return renderSheet(y, plan, cols); }).join('');
  }

  function applyPaper() {
    var a4 = document.getElementById('paper-select').value === 'a4';
    document.body.classList.toggle('a4', a4);
    document.getElementById('page-size').textContent = '@page { size: ' + (a4 ? 'A4' : 'A3') + ' landscape; margin: ' + (a4 ? '7mm' : '9mm') + '; }';
  }

  var params = new URLSearchParams(location.search);
  var yearParam = (params.get('year') || '').toUpperCase();
  if (/^S[1-3]$/.test(yearParam)) document.getElementById('year-select').value = yearParam;
  if ((params.get('paper') || '').toLowerCase() === 'a4') document.getElementById('paper-select').value = 'a4';

  document.getElementById('year-select').addEventListener('change', render);
  document.getElementById('paper-select').addEventListener('change', applyPaper);
  applyPaper();
  render();
})();
</script>
</body>
</html>
