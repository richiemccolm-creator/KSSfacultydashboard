<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Join Mini Whiteboards | Classroom Toolkit</title>
<script>window.FH_NO_VERSION_RELOAD=true;</script>
<script src="../app-version.js"></script>
<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-init.js"></script>
<link rel="stylesheet" href="../design-tokens.css">
<link rel="stylesheet" href="toolkit-ui.css">
<style>
/* Stop iOS double-tap zoom when pupils tap buttons quickly */
html{touch-action:manipulation}
/* Pupil phone page for Mini Whiteboards. Always stage mode. */
body{--accent:#22c3ee;--accent-stage:#22c3ee;--paper:#F4F1E8}
html,body{height:100%;overscroll-behavior:none}
body{overflow:hidden}

.wrap{
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:20px 16px 32px;
}
.card{width:min(420px,100%);padding:24px 20px}
.logo-wrap{width:min(260px,80%);margin:-6px auto 14px;padding:12px 16px;border-radius:18px;transform:rotate(-2deg);
  background:radial-gradient(rgba(255,255,255,.3) 1.4px,transparent 1.8px) 0 0/14px 14px,var(--accent);border:3px solid #000;box-shadow:5px 5px 0 var(--yel)}
.logo{width:100%;height:auto;display:block;filter:drop-shadow(3px 3px 0 rgba(23,20,31,.55))}
h1{margin:8px 0 6px;text-align:center;font:800 32px/1.05 var(--font-display);letter-spacing:-.04em}
.sub{margin:0 0 14px;text-align:center;color:var(--text-2);font:400 15px/1.45 var(--font)}
.err{min-height:1.3em;margin:0 0 6px;color:#ff9db5;font:500 14px/1.35 var(--font);text-align:center}
label{margin:12px 0 6px}
input{min-height:50px;font-size:17px}
#pin{font:800 26px/1 var(--font-display);letter-spacing:.14em;text-align:center}
.card .btn{width:100%;min-height:54px;margin-top:20px;font-size:18px}
.btn-ghost{min-height:44px;padding:0 14px;flex:none}

/* Drawing view */
.play{
  position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;background:var(--stage);
  /* No pinch zoom, scrolling, text selection or magnifier anywhere on the drawing view */
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.play-bar{flex:none;display:flex;flex-direction:column;gap:4px;padding:12px 16px 10px;border-bottom:3px solid #000;background:var(--stage-2)}
.play-prompt{margin:0;font:800 21px/1.2 var(--font-display);letter-spacing:-.03em;color:var(--yel)}
.play-meta{margin:0;color:var(--muted);font:500 12.5px/1.3 var(--font)}
.stage{flex:1;min-height:0;padding:10px 10px 8px;display:flex}
/* The board fills this area; fitBoard() sizes it (see the comment there) */
.paper{
  flex:1;min-height:0;min-width:0;position:relative;
  display:flex;align-items:center;justify-content:center;touch-action:none;
}
.paper canvas{
  width:100%;height:100%;display:block;flex:none;touch-action:none;cursor:crosshair;
  border-radius:16px;background:var(--paper);box-shadow:0 0 0 3px #000,5px 5px 0 3px #000;
}
.lock{
  position:absolute;inset:0;border-radius:16px;display:flex;align-items:center;justify-content:center;
  background:rgba(23,20,31,.78);color:var(--yel);font:800 22px/1.3 var(--font-display);letter-spacing:-.02em;
  text-align:center;padding:20px;pointer-events:none;
}
.tools{flex:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:8px 12px 12px}
.swatch{width:40px;height:40px;border-radius:50%;border:3px solid #000;flex:none;padding:0;box-shadow:none;transition:transform .15s var(--pop)}
.swatch.on{border-color:#fff;transform:scale(1.12);box-shadow:0 0 0 3px var(--yel)}
.size{width:40px;height:40px;border-radius:11px;border:2px solid var(--stage-line-strong);background:rgba(255,248,236,.05);display:grid;place-items:center;flex:none;padding:0}
.size.on{border-color:var(--yel);background:rgba(255,210,63,.18)}
.size i{display:block;border-radius:50%;background:var(--paper)}
.wait{text-align:center;color:var(--text-2);font:500 16px/1.45 var(--font);padding:24px}

/* Stickers */
.sticker-btn{width:auto;min-width:40px;padding:0 10px;gap:6px;font:800 14px/1 var(--font-display);color:var(--text);display:inline-flex;align-items:center}
.sticker-btn .em{display:inline-flex;line-height:1}
.sticker-btn .em img,.sticker-tray img{display:block;pointer-events:none}
/* Floats over the bottom of the board so opening it never resizes the board */
.sticker-tray{
  position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:2;
  width:min(560px,calc(100% - 16px));padding:10px;border-radius:18px;
  background:rgba(34,29,46,.98);border:3px solid #000;box-shadow:5px 5px 0 var(--yel);
  display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;
}
.sticker-tray button{
  height:52px;border-radius:12px;border:2px solid transparent;background:rgba(255,248,236,.05);
  font-size:30px;line-height:1;padding:0;display:grid;place-items:center;
}
.sticker-tray button:hover{background:rgba(255,255,255,.1)}
.sticker-tray button.on{border-color:var(--yel);background:rgba(255,210,63,.18)}
.sticker-hint{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:1;
  padding:7px 12px;border-radius:999px;background:var(--ink);color:var(--yel);border:2px solid var(--yel);
  font:800 13px/1.2 var(--font-display);white-space:nowrap;pointer-events:none;
}
</style>
</head>
<body class="tk-stage">
<div class="sky" id="sky" aria-hidden="true"></div>
<div class="wrap" id="joinWrap">
  <div class="card" id="viewJoin">
    <div class="logo-wrap">
      <img class="logo" src="whiteboards-logo.png" width="1280" height="533" alt="Mini Whiteboards" decoding="async">
    </div>
    <h1>Join the boards</h1>
    <p class="sub">Enter the PIN from the board, then write your answer.</p>
    <p class="err" id="joinErr"></p>
    <label for="pin">PIN</label>
    <input id="pin" inputmode="numeric" maxlength="6" placeholder="6-digit PIN" autocomplete="one-time-code">
    <label for="nick">Your name</label>
    <input id="nick" maxlength="24" placeholder="First name" autocomplete="nickname">
    <button type="button" class="btn btn-primary" id="btnJoin">Join</button>
  </div>
</div>

<div class="play hidden" id="viewPlay" hidden aria-hidden="true">
  <div class="play-bar">
    <p class="play-prompt" id="playPrompt">Show me your thinking</p>
    <p class="play-meta" id="playMeta"></p>
  </div>
  <div class="stage">
    <div class="paper" id="paper">
      <canvas id="board" width="1000" height="1000"></canvas>
      <p class="sticker-hint hidden" id="stickerHint"></p>
      <div class="sticker-tray hidden" id="stickerTray" role="group" aria-label="Stickers"></div>
      <div class="lock hidden" id="lockMsg">Boards are locked.<br>Look at the class screen.</div>
    </div>
  </div>
  <div class="tools" id="tools"></div>
</div>

<script>
(function () {
  "use strict";

  var PAPER = "#F4F1E8";
  var COLORS = [
    { c: "#1A2340", label: "Ink" },
    { c: "#3B6CFF", label: "Blue" },
    { c: "#F45E68", label: "Red" },
    { c: "#35C796", label: "Green" },
    { c: "#F4A62A", label: "Amber" },
    { c: "#F4F1E8", label: "Eraser" }
  ];
  var SIZES = [3, 6, 12];
  // Sticker ids must match the list in wb_sanitize_strokes (20261018120000_whiteboard_stickers.sql)
  var STICKERS = [
    { id: "thumbs_up", e: "\uD83D\uDC4D", label: "Thumbs up" },
    { id: "thumbs_down", e: "\uD83D\uDC4E", label: "Thumbs down" },
    { id: "clap", e: "\uD83D\uDC4F", label: "Clapping" },
    { id: "star", e: "\u2B50", label: "Star" },
    { id: "heart", e: "\u2764\uFE0F", label: "Heart" },
    { id: "check", e: "\u2705", label: "Tick" },
    { id: "cross", e: "\u274C", label: "Cross" },
    { id: "question", e: "\u2753", label: "Question" },
    { id: "idea", e: "\uD83D\uDCA1", label: "Idea" },
    { id: "think", e: "\uD83E\uDD14", label: "Thinking" },
    { id: "laugh", e: "\uD83D\uDE02", label: "Laughing" },
    { id: "smile", e: "\uD83D\uDE0A", label: "Smile" },
    { id: "wow", e: "\uD83D\uDE2E", label: "Wow" },
    { id: "sad", e: "\uD83D\uDE22", label: "Sad" },
    { id: "fire", e: "\uD83D\uDD25", label: "Fire" },
    { id: "hundred", e: "\uD83D\uDCAF", label: "100" },
    { id: "party", e: "\uD83C\uDF89", label: "Party" },
    { id: "theatre", e: "\uD83C\uDFAD", label: "Theatre masks" },
    { id: "palette", e: "\uD83C\uDFA8", label: "Palette" },
    { id: "rocket", e: "\uD83D\uDE80", label: "Rocket" }
  ];
  var STICKER_BY_ID = {};
  STICKERS.forEach(function (st) { STICKER_BY_ID[st.id] = st; });
  var STICKER_SIZES = { 3: 70, 6: 110, 12: 170 };
  var MAX_STICKERS = 40;
  // The server rejects a board over 250 items or about 100 KB (wb_sanitize_strokes). Stay under
  // both, so saving never silently stops: each point number costs about 12 bytes there.
  var MAX_ITEMS = 249; // one of the 250 slots holds the board shape
  var MAX_BYTES = 92000;
  var RPC_TIMEOUT = 10000;
  var TOKEN_KEY = "kss-wb-token";
  var $ = function (id) { return document.getElementById(id); };
  var state = {
    pin: "",
    token: "",
    nickname: "",
    poll: null,
    strokes: [],
    round: 1,
    rev: 0,
    color: "#1A2340",
    width: 6,
    drawing: false,
    stroke: null,
    dirty: false,
    syncing: false,
    locked: false,
    closed: false,
    cache: null,
    sticker: null,
    trayOpen: false
  };

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function buildSky() {
    var sky = $("sky");
    if (!sky || sky.dataset.ready) return;
    sky.dataset.ready = "1";
    var html = "";
    for (var i = 0; i < 22; i++) {
      var size = 2 + Math.random() * 5;
      html += '<span class="spark' + (i % 3 === 0 ? " amber" : "") + '" style="width:' + size + "px;height:" + size +
        "px;left:" + (Math.random() * 100) + "%;top:" + (Math.random() * 100) +
        "%;animation-duration:" + (1.4 + Math.random() * 2.6) +
        "s;animation-delay:" + (Math.random() * 3) + 's"></span>';
    }
    sky.innerHTML = html;
  }

  function getToken() {
    try {
      var t = localStorage.getItem(TOKEN_KEY);
      if (t && t.length >= 16) return t;
    } catch (e) {}
    var fresh = "";
    var chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    for (var i = 0; i < 24; i++) fresh += chars.charAt(Math.floor(Math.random() * chars.length));
    try { localStorage.setItem(TOKEN_KEY, fresh); } catch (e2) {}
    return fresh;
  }

  // A request that never answers (patchy school wifi) gives up after a while,
  // so it can't hold up every save or check that comes after it
  function rpc(name, args) {
    if (!window.supabase) return Promise.reject(new Error("Not connected"));
    var timer;
    var timeout = new Promise(function (resolve, reject) {
      timer = setTimeout(function () { reject(new Error("Timed out")); }, RPC_TIMEOUT);
    });
    var call = Promise.resolve(window.supabase.rpc(name, args)).then(function (res) {
      if (res.error) throw res.error;
      return res.data;
    });
    return Promise.race([call, timeout]).then(function (data) {
      clearTimeout(timer);
      return data;
    }, function (err) {
      clearTimeout(timer);
      throw err;
    });
  }

  // A missing function means the tool's database setup hasn't been run yet
  function joinError(err) {
    var code = err && err.code;
    if (code === "PGRST202" || code === "PGRST205" || code === "42883") {
      return "This activity isn't switched on yet. Tell your teacher.";
    }
    return (err && err.message) || "Could not join";
  }

  function canvasEl() { return $("board"); }

  function pointFromEvent(e) {
    var canvas = canvasEl();
    var r = canvas.getBoundingClientRect();
    var x = ((e.clientX - r.left) / Math.max(1, r.width)) * 1000;
    var y = ((e.clientY - r.top) / Math.max(1, r.height)) * 1000;
    return [
      Math.max(0, Math.min(1000, Math.round(x))),
      Math.max(0, Math.min(1000, Math.round(y)))
    ];
  }

  // The board fills the screen. Its shape (height / width) is taken from the screen while the
  // board is empty, then kept once there is ink, so rotating or Safari's toolbar sliding in and
  // out never stretches a drawing. Points are stored as 0-1000 across and 0-1000 down.
  var boardFit = { w: 0, h: 0 };
  function boardHasInk() {
    return state.strokes.length > 0 || !!state.stroke;
  }
  function fitBoard(force) {
    var canvas = canvasEl();
    var paper = $("paper");
    if (!canvas || !paper) return;
    var availW = paper.clientWidth || 320;
    var availH = paper.clientHeight || 240;
    var empty = !boardHasInk();
    if (!force && !empty && boardFit.w && availW === boardFit.w && Math.abs(availH - boardFit.h) < 140) return;
    boardFit.w = availW;
    boardFit.h = availH;
    if (empty) state.aspect = Math.max(0.3, Math.min(2.5, availH / availW));
    var aspect = state.aspect || 0.75;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var cssW = Math.max(1, Math.floor(Math.min(availW, availH / aspect)));
    var cssH = Math.max(1, Math.floor(cssW * aspect));
    canvas.style.width = cssW + "px";
    canvas.style.height = cssH + "px";
    canvas.width = Math.max(1, Math.round(cssW * dpr));
    canvas.height = Math.max(1, Math.round(cssH * dpr));
  }

  function strokeStyle(ctx, s, sx, sy) {
    ctx.strokeStyle = s.c || "#1A2340";
    ctx.fillStyle = ctx.strokeStyle;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = Math.max(1.5, (s.w || 4) * sx); // line widths are in board-width units
  }

  // While a line is being drawn, add just the newest bit instead of redrawing everything
  function drawSegment(s, from) {
    var canvas = canvasEl();
    var p = s.p;
    if (!canvas || from < 2 || p.length < from + 2) return;
    var ctx = canvas.getContext("2d");
    var sx = canvas.width / 1000;
    var sy = canvas.height / 1000;
    strokeStyle(ctx, s, sx, sy);
    ctx.beginPath();
    ctx.moveTo(p[from - 2] * sx, p[from - 1] * sy);
    for (var i = from; i < p.length; i += 2) ctx.lineTo(p[i] * sx, p[i + 1] * sy);
    ctx.stroke();
  }

  // Stickers are drawn from image files so they look the same on every device;
  // a device's own emoji font can come out as dark blobs, so it is only a fallback while loading
  var stickerImgs = {};
  function stickerImg(id, onReady) {
    var img = stickerImgs[id];
    if (!img) {
      img = new Image();
      img.decoding = "async";
      img.onload = function () { if (onReady) onReady(); };
      img.src = "stickers/" + id + ".svg";
      stickerImgs[id] = img;
    }
    return img.complete && img.naturalWidth ? img : null;
  }

  function drawSticker(ctx, s, sx, sy) {
    var st = STICKER_BY_ID[s.e];
    if (!st || !s.p || s.p.length < 2) return;
    var size = Math.max(12, (s.w || 110) * sx);
    var img = stickerImg(s.e, paint);
    if (img) {
      ctx.drawImage(img, s.p[0] * sx - size / 2, s.p[1] * sy - size / 2, size, size);
      return;
    }
    ctx.save();
    ctx.fillStyle = "#1A2340";
    ctx.font = size + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(st.e, s.p[0] * sx, s.p[1] * sy);
    ctx.restore();
  }

  function paint() {
    var canvas = canvasEl();
    if (!canvas) return;
    if (!boardFit.w) fitBoard(true);
    var w = canvas.width;
    var h = canvas.height;
    var ctx = canvas.getContext("2d");
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, w, h);
    var sx = w / 1000;
    var sy = h / 1000;
    var all = state.strokes.slice();
    if (state.stroke) all.push(state.stroke);
    all.forEach(function (s) {
      var p = s && s.p;
      if (!p || p.length < 2) return;
      if (s.e) { drawSticker(ctx, s, sx, sy); return; }
      strokeStyle(ctx, s, sx, sy);
      if (p.length < 4) {
        ctx.beginPath();
        ctx.arc(p[0] * sx, p[1] * sy, ctx.lineWidth / 2, 0, Math.PI * 2);
        ctx.fill();
        return;
      }
      ctx.beginPath();
      ctx.moveTo(p[0] * sx, p[1] * sy);
      for (var i = 2; i < p.length; i += 2) ctx.lineTo(p[i] * sx, p[i + 1] * sy);
      ctx.stroke();
    });
  }

  function currentWidth() {
    // Whole number: the server reads the width as an int and drops anything else to 4
    return state.color === PAPER ? Math.max(14, Math.round(state.width * 2.2)) : state.width;
  }

  // Rough size of a stroke on the server, to match its size limit
  function itemBytes(s) {
    return 56 + ((s && s.p && s.p.length) || 0) * 12;
  }
  function boardBytes() {
    var total = 16;
    for (var i = 0; i < state.strokes.length; i++) total += itemBytes(state.strokes[i]);
    return total;
  }
  function boardFull(extraBytes) {
    return state.strokes.length >= MAX_ITEMS || boardBytes() + (extraBytes || 0) > MAX_BYTES;
  }
  function showFull() {
    showStickerHint("Your board is full. Undo or Clear to keep going.");
  }

  function startStroke(e) {
    e.preventDefault();
    if (state.locked || state.closed) return;
    var pen = e.pointerType === "pen";
    if (pen) state.penAt = Date.now();
    // Palm rejection: ignore touches for a short while after the Pencil was last used, but let
    // fingers draw again after that, for pupils who put the Pencil down
    else if (e.pointerType === "touch" && state.penAt && Date.now() - state.penAt < 8000) return;
    if (state.drawing) {
      // The Pencil wins over a palm that landed first; any new Pencil touch means the last one lifted
      if (pen) dropStroke(state.strokePen);
      else return; // a second finger while a line is being drawn
    }
    if (boardFull(state.sticker ? 0 : 200)) { showFull(); return; }
    if (state.sticker) { placeSticker(e); return; }
    var canvas = canvasEl();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    var pt = pointFromEvent(e);
    state.drawing = true;
    state.pointerId = e.pointerId;
    state.strokePen = pen;
    state.fullShown = false;
    state.stroke = { c: state.color, w: currentWidth(), p: [pt[0], pt[1]] };
    paint();
  }

  function stickerCount() {
    return state.strokes.filter(function (s) { return s && s.e; }).length;
  }

  function placeSticker(e) {
    if (stickerCount() >= MAX_STICKERS) {
      showStickerHint("That's the most stickers for one board");
      return;
    }
    if (state.trayOpen) setTray(false);
    var pt = pointFromEvent(e);
    state.strokes.push({ e: state.sticker, w: STICKER_SIZES[state.width] || 110, p: [pt[0], pt[1]] });
    state.dirty = true;
    paint();
    scheduleSync();
  }

  // Drop points that sit on a nearly straight line between their neighbours (Douglas-Peucker).
  // An Apple Pencil sends up to 240 points a second; most add nothing you can see, and they
  // would fill the board's size limit after a few words.
  function simplify(p, tol) {
    var n = p.length / 2;
    if (n < 3) return p;
    var keep = new Uint8Array(n);
    keep[0] = keep[n - 1] = 1;
    var stack = [0, n - 1];
    while (stack.length) {
      var b = stack.pop(), a = stack.pop();
      var ax = p[a * 2], ay = p[a * 2 + 1], bx = p[b * 2], by = p[b * 2 + 1];
      var dx = bx - ax, dy = by - ay, len = Math.sqrt(dx * dx + dy * dy) || 1;
      var far = -1, farD = tol;
      for (var i = a + 1; i < b; i++) {
        var d = Math.abs((p[i * 2] - ax) * dy - (p[i * 2 + 1] - ay) * dx) / len;
        if (d > farD) { farD = d; far = i; }
      }
      if (far > 0) { keep[far] = 1; stack.push(a, far, far, b); }
    }
    var out = [];
    for (var k = 0; k < n; k++) if (keep[k]) out.push(p[k * 2], p[k * 2 + 1]);
    return out;
  }
  function finishStroke(s) {
    if (s && s.p && s.p.length > 4) s.p = simplify(s.p, 1.2);
    return s;
  }

  function addPoint(e) {
    var pt = pointFromEvent(e);
    var p = state.stroke.p;
    var lx = p[p.length - 2];
    var ly = p[p.length - 1];
    if (Math.abs(pt[0] - lx) + Math.abs(pt[1] - ly) < 3) return;
    if (p.length >= 400) {
      // The server keeps strokes short, so carry on seamlessly in a new stroke
      var done = finishStroke(state.stroke);
      if (state.strokes.length >= MAX_ITEMS - 1 || boardFull(itemBytes(done) + 200)) {
        if (!state.fullShown) { state.fullShown = true; showFull(); }
        return;
      }
      state.strokes.push(done);
      state.dirty = true;
      state.stroke = { c: state.stroke.c, w: state.stroke.w, p: [lx, ly] };
      p = state.stroke.p;
    }
    p.push(pt[0], pt[1]);
  }

  function moveStroke(e) {
    if (!state.drawing || !state.stroke || e.pointerId !== state.pointerId) return;
    e.preventDefault();
    var before = state.stroke;
    var from = before.p.length;
    var events = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if (!events.length) events = [e];
    events.forEach(addPoint);
    if (state.stroke !== before) paint();
    else drawSegment(state.stroke, from);
  }

  function endStroke(e) {
    if (!state.drawing) return;
    if (e && e.pointerId !== state.pointerId) return;
    if (e && e.cancelable) e.preventDefault();
    state.drawing = false;
    state.pointerId = null;
    if (state.stroke && state.stroke.p && state.stroke.p.length >= 2) {
      state.strokes.push(finishStroke(state.stroke));
      state.dirty = true;
      scheduleSync();
    }
    state.stroke = null;
    paint();
  }

  // Throw away the line in progress: a palm that touched down just before the Pencil
  function dropStroke(wasPen) {
    if (wasPen) { endStroke(); return; } // the last Pencil line just lost its lift-off: keep it
    state.drawing = false;
    state.pointerId = null;
    state.stroke = null;
    paint();
  }

  // Boards from the server carry their shape as {a: height/width x 1000}. Older boards have no
  // shape item and use the original 4:3 layout (y 0-750), so convert those to 0-1000.
  function importBoard(list) {
    var aspect = null;
    var out = [];
    (Array.isArray(list) ? list : []).forEach(function (s) {
      if (!s) return;
      if (s.a != null) { if (aspect == null) aspect = s.a / 1000; return; }
      out.push(s);
    });
    if (out.length && aspect == null) {
      out = out.map(function (s) {
        var p = (s.p || []).slice();
        for (var i = 1; i < p.length; i += 2) p[i] = Math.round(p[i] * 1000 / 750);
        var copy = {};
        Object.keys(s).forEach(function (k) { copy[k] = s[k]; });
        copy.p = p;
        return copy;
      });
      aspect = 0.75;
    }
    state.strokes = out;
    if (aspect != null && out.length) state.aspect = aspect;
    fitBoard(true);
    paint();
  }

  function exportBoard() {
    if (!state.strokes.length) return [];
    return [{ a: Math.round((state.aspect || 0.75) * 1000) }].concat(state.strokes);
  }

  function scheduleSync(delay) {
    clearTimeout(scheduleSync._t);
    scheduleSync._t = setTimeout(syncNow, delay || 450);
  }

  function syncNow() {
    if (!state.dirty || state.syncing || !state.token || state.locked || state.closed) return;
    state.syncing = true;
    var failed = false;
    var payload = exportBoard();
    rpc("wb_submit_strokes", {
      p_token: state.token,
      p_strokes: payload,
      p_round: state.round
    }).then(function (data) {
      if (data && data.ok) {
        state.dirty = false;
        state.rev = data.rev || state.rev;
        return;
      }
      if (data && data.reason === "round") {
        state.round = data.round || (state.round + 1);
        state.dirty = false;
        importBoard(data.strokes);
        return;
      }
      if (data && data.reason === "locked") {
        state.locked = true;
        renderLock();
      }
    }).catch(function (err) {
      failed = true;
      var msg = String((err && err.message) || "");
      if (/too large|too many/i.test(msg)) showFull();
    }).then(function () {
      state.syncing = false;
      // Keep trying, but back off while saves are failing so a weak connection isn't swamped
      state.syncFails = failed ? Math.min((state.syncFails || 0) + 1, 5) : 0;
      if (state.dirty) scheduleSync(failed ? 450 * Math.pow(2, state.syncFails) : 450);
    });
  }

  function undo() {
    if (state.locked || !state.strokes.length) return;
    state.strokes.pop();
    state.dirty = true;
    if (!state.strokes.length) fitBoard(true); // empty again: take the screen's shape
    paint();
    scheduleSync();
  }

  function wipeLocal() {
    if (state.locked) return;
    state.strokes = [];
    state.dirty = true;
    fitBoard(true);
    paint();
    scheduleSync();
  }

  function renderTools() {
    var html = COLORS.map(function (col) {
      var erase = col.c === PAPER;
      return '<button type="button" class="swatch' + (state.color === col.c ? " on" : "") +
        '" data-c="' + col.c + '" title="' + col.label + '" aria-label="' + col.label +
        '" style="background:' + (erase ? "repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/12px 12px" : col.c) + '"></button>';
    }).join("");
    html += SIZES.map(function (w) {
      var px = 6 + w;
      return '<button type="button" class="size' + (state.width === w ? " on" : "") +
        '" data-w="' + w + '" aria-label="Thickness ' + w + '"><i style="width:' + px + "px;height:" + px + 'px"></i></button>';
    }).join("");
    var chosen = state.sticker && STICKER_BY_ID[state.sticker];
    html += '<button type="button" class="size sticker-btn' + (state.sticker || state.trayOpen ? " on" : "") +
      '" id="btnStickers" aria-expanded="' + (state.trayOpen ? "true" : "false") + '" aria-controls="stickerTray">' +
      '<span class="em" aria-hidden="true">' + (chosen ? '<img src="stickers/' + chosen.id + '.svg" alt="" width="24" height="24">' : '<img src="stickers/smile.svg" alt="" width="24" height="24">') + "</span>Stickers</button>";
    html += '<button type="button" class="btn btn-ghost" id="btnUndo">Undo</button>';
    if (canFullscreen() && !isFullscreen()) {
      html += '<button type="button" class="btn btn-ghost" id="btnFull" aria-label="Full screen">' +
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>';
    }
    html += '<button type="button" class="btn btn-ghost" id="btnWipe">Clear</button>';
    $("tools").innerHTML = html;
    $("tools").querySelectorAll("[data-c]").forEach(function (btn) {
      btn.onclick = function () {
        state.color = btn.getAttribute("data-c");
        state.sticker = null; // picking a pen goes back to drawing
        setTray(false);
        renderTools();
      };
    });
    $("tools").querySelectorAll("[data-w]").forEach(function (btn) {
      btn.onclick = function () {
        state.width = parseInt(btn.getAttribute("data-w"), 10) || 6;
        renderTools();
      };
    });
    $("btnStickers").onclick = function () { setTray(!state.trayOpen); };
    $("btnUndo").onclick = undo;
    if ($("btnFull")) $("btnFull").onclick = enterFullscreen;
    $("btnWipe").onclick = wipeLocal;
    updateStickerHint();
  }

  function renderTray() {
    $("stickerTray").innerHTML = STICKERS.map(function (st) {
      return '<button type="button" data-sticker="' + st.id + '" class="' + (state.sticker === st.id ? "on" : "") +
        '" aria-label="' + st.label + '" title="' + st.label + '"><img src="stickers/' + st.id + '.svg" alt="" width="34" height="34"></button>';
    }).join("");
    $("stickerTray").querySelectorAll("[data-sticker]").forEach(function (btn) {
      btn.onclick = function () {
        state.sticker = btn.getAttribute("data-sticker");
        setTray(false);
      };
    });
  }

  function setTray(open) {
    state.trayOpen = !!open;
    if (state.trayOpen) renderTray();
    $("stickerTray").classList.toggle("hidden", !state.trayOpen);
    renderTools();
  }

  function showStickerHint(text) {
    var el = $("stickerHint");
    el.textContent = text;
    el.classList.remove("hidden");
    clearTimeout(showStickerHint._t);
    showStickerHint._t = setTimeout(updateStickerHint, 2200);
  }

  function updateStickerHint() {
    var el = $("stickerHint");
    if (!el) return;
    var st = state.sticker && STICKER_BY_ID[state.sticker];
    if (st && !state.trayOpen) {
      el.textContent = "Tap the board to add " + st.e + ". Pick a pen to draw again.";
      el.classList.remove("hidden");
    } else {
      el.classList.add("hidden");
    }
  }

  function renderLock() {
    $("lockMsg").classList.toggle("hidden", !(state.locked || state.closed));
    if (state.closed) $("lockMsg").innerHTML = "This session has ended.<br>Look at the board with your class.";
    else $("lockMsg").innerHTML = "Boards are locked.<br>Look at the class screen.";
  }

  function showPlay() {
    $("joinWrap").classList.add("hidden");
    $("viewPlay").classList.remove("hidden");
    $("viewPlay").hidden = false;
    $("viewPlay").setAttribute("aria-hidden", "false");
    renderTools();
    STICKERS.forEach(function (st) { stickerImg(st.id, paint); });
    fitBoard(true);
    paint();
    requestAnimationFrame(function () {
      fitBoard(true);
      paint();
    });
  }

  // iPads (not iPhones) let a page go full screen after a tap; that hides Safari's bars
  function canFullscreen() {
    var el = document.documentElement;
    return !!(el.requestFullscreen || el.webkitRequestFullscreen) && (navigator.maxTouchPoints || 0) > 1;
  }
  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function enterFullscreen() {
    if (!canFullscreen() || isFullscreen()) return;
    try {
      var el = document.documentElement;
      var go = el.requestFullscreen || el.webkitRequestFullscreen;
      var res = go.call(el);
      if (res && res.catch) res.catch(function () {});
    } catch (e) {}
  }

  function join() {
    var pin = String($("pin").value || "").replace(/\D/g, "").slice(0, 6);
    var nick = String($("nick").value || "").trim();
    $("joinErr").textContent = "";
    if (pin.length !== 6) {
      $("joinErr").textContent = "Enter the 6-digit PIN from the board.";
      return;
    }
    if (!nick) {
      $("joinErr").textContent = "Enter your name so your teacher knows whose board this is.";
      return;
    }
    state.token = getToken();
    enterFullscreen(); // must happen straight from the tap on Join
    $("btnJoin").disabled = true;
    rpc("wb_join_session", {
      p_pin: pin,
      p_nickname: nick,
      p_token: state.token
    }).then(function (data) {
      state.pin = pin;
      state.nickname = data.nickname || nick;
      state.round = data.round || 1;
      state.rev = data.rev || 0;
      state.locked = !!data.locked;
      $("playPrompt").textContent = data.prompt || "Show me your thinking";
      showPlay();
      importBoard(data.strokes);
      renderLock();
      startPoll();
    }).catch(function (err) {
      $("joinErr").textContent = joinError(err);
    }).then(function () {
      $("btnJoin").disabled = false;
    });
  }

  function refresh() {
    if (!state.pin || state.refreshing) return; // the last check hasn't answered yet
    state.refreshing = true;
    rpc("wb_get_session_state", {
      p_pin: state.pin,
      p_token: state.token
    }).then(function (data) {
      state.cache = data || {};
      var meta = (data.nickname || state.nickname || "") +
        (data.anonymous ? " · Name hidden on the board" : "") +
        " · " + (data.player_count || 0) + " joined";
      $("playMeta").textContent = meta;
      if (data.prompt) $("playPrompt").textContent = data.prompt;
      if (data.status === "closed") {
        state.closed = true;
        renderLock();
        return;
      }
      state.locked = !!data.locked;
      renderLock();
      if ((data.round || 1) !== state.round) {
        state.round = data.round || 1;
        state.dirty = false;
        importBoard(data.strokes);
      }
    }).catch(function () {}).then(function () {
      state.refreshing = false;
    });
  }

  function startPoll() {
    if (state.poll) clearInterval(state.poll);
    refresh();
    state.poll = setInterval(refresh, 1600);
  }

  function boot() {
    buildSky();
    state.token = getToken();
    try {
      var pin = new URLSearchParams(location.search).get("c") || "";
      pin = String(pin).replace(/\D/g, "").slice(0, 6);
      if (pin) $("pin").value = pin;
    } catch (e) {}
    $("btnJoin").onclick = join;
    $("pin").addEventListener("keydown", function (e) { if (e.key === "Enter") join(); });
    $("nick").addEventListener("keydown", function (e) { if (e.key === "Enter") join(); });

    var canvas = canvasEl();
    canvas.addEventListener("pointerdown", startStroke);
    canvas.addEventListener("pointermove", moveStroke);
    canvas.addEventListener("pointerup", endStroke);
    canvas.addEventListener("pointercancel", endStroke);
    // Safari sometimes loses the lift-off (an edge swipe, a system gesture); finish the line
    // instead of leaving the board waiting for it forever
    canvas.addEventListener("lostpointercapture", endStroke);
    window.addEventListener("resize", function () { fitBoard(false); paint(); });
    ["fullscreenchange", "webkitfullscreenchange"].forEach(function (name) {
      document.addEventListener(name, function () {
        setTimeout(function () { fitBoard(true); paint(); if (state.pin) renderTools(); }, 200);
      });
    });
    window.addEventListener("orientationchange", function () {
      setTimeout(function () { fitBoard(true); paint(); }, 250);
    });
    // Safari ignores user-scalable=no, so stop its pinch and double-tap zoom directly
    ["gesturestart", "gesturechange", "gestureend"].forEach(function (name) {
      document.addEventListener(name, function (e) { e.preventDefault(); }, { passive: false });
    });
    document.addEventListener("touchmove", function (e) {
      if (e.touches && e.touches.length > 1) e.preventDefault();
    }, { passive: false });
    document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) endStroke();
      else if (state.dirty) syncNow();
    });
  }

  boot();
})();
</script>
</body>
</html>
