<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Join Mini Whiteboards — Classroom Toolkit</title>
<script src="../app-version.js"></script>
<script>(function(){if(window.ensureAppVersionInUrl)window.ensureAppVersionInUrl();})();</script>
<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-init.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#030712; --text:#F5F7FF; --text-2:#B6C0D9; --muted:#7D8AA8;
  --line:rgba(124,148,205,.18);
  --paper:#F4F1E8; --ink:#1A2340;
  --cyan:#3BD6FF; --amber:#F4A62A; --mint:#35C796; --coral:#F45E68; --blue:#3B6CFF;
  --font:"Inter",ui-sans-serif,system-ui,sans-serif;
  --font-display:"General Sans","Inter",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%;overscroll-behavior:none}
html{color-scheme:dark}
body{
  margin:0;min-height:100vh;font-family:var(--font);color:var(--text);
  background:
    radial-gradient(ellipse 55% 42% at 14% -8%,rgba(59,214,255,.28),transparent 50%),
    radial-gradient(ellipse 48% 36% at 92% 8%,rgba(244,166,42,.16),transparent 45%),
    var(--bg);
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.spark{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle,#fff,rgba(140,230,255,.85) 40%,transparent 70%);
  box-shadow:0 0 8px rgba(59,214,255,.7);
  animation:twinkle ease-in-out infinite;
}
.spark.amber{
  background:radial-gradient(circle,#fff,rgba(255,210,120,.85) 40%,transparent 70%);
  box-shadow:0 0 8px rgba(244,166,42,.7);
}
@keyframes twinkle{
  0%,100%{opacity:.2;transform:scale(.7)}
  50%{opacity:1;transform:scale(1.25)}
}

.wrap{
  position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:20px 16px 32px;gap:16px;
}
.card{
  width:min(440px,100%);border-radius:24px;padding:26px 18px;
  background:linear-gradient(155deg,rgba(59,214,255,.1),#070f1e 52%);
  border:1px solid rgba(59,214,255,.3);
  box-shadow:0 20px 48px rgba(0,0,0,.4),0 0 48px rgba(59,214,255,.12);
}
.logo-wrap{width:min(260px,78%);margin:0 auto 10px}
.logo{width:100%;height:auto;display:block;filter:drop-shadow(0 0 18px rgba(59,214,255,.45))}
h1{margin:8px 0 6px;text-align:center;font:800 28px/1.1 var(--font-display);letter-spacing:-.03em}
.sub{margin:0 0 16px;text-align:center;color:var(--text-2);font:500 14.5px/1.45 var(--font)}
.err{min-height:1.2em;margin:0 0 8px;color:#FFB4B9;font:650 13px/1.3 var(--font);text-align:center}
label{display:block;font:700 11px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
input{
  width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:#070f22;
  padding:0 14px;outline:none;
}
input:focus{border-color:rgba(59,214,255,.55);box-shadow:0 0 0 3px rgba(59,214,255,.16)}
.btn{
  width:100%;height:52px;margin-top:16px;border:none;border-radius:16px;font:800 16px/1 var(--font);
  color:#041018;background:linear-gradient(135deg,#3BD6FF,#35C796 60%,#F4A62A);
  box-shadow:0 12px 28px -8px rgba(59,214,255,.55);
}
.btn:disabled{opacity:.45}
.btn-ghost{
  width:auto;height:40px;margin:0;padding:0 12px;border-radius:12px;
  background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--line);font:650 13px/1 var(--font);
  box-shadow:none;
}

.play{
  position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;
  background:#0a1224;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.play-bar{
  flex:none;display:flex;flex-direction:column;gap:6px;padding:10px 14px 8px;
  background:linear-gradient(180deg,#0d1831,#0a1224);
  border-bottom:1px solid var(--line);
}
.play-prompt{margin:0;font:800 18px/1.2 var(--font-display);letter-spacing:-.02em}
.play-meta{margin:0;color:var(--muted);font:600 12px/1.3 var(--font)}
.stage{
  flex:1;min-height:0;padding:10px 10px 8px;display:flex;
}
.paper{
  flex:1;min-height:0;border-radius:18px;overflow:hidden;position:relative;
  background:var(--paper);box-shadow:0 16px 40px rgba(0,0,0,.35);
  touch-action:none;
}
.paper canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.lock{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(244,241,232,.72);color:var(--ink);font:800 18px/1.3 var(--font-display);
  text-align:center;padding:20px;pointer-events:none;
}
.tools{
  flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px 12px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.swatch{
  width:38px;height:38px;border-radius:50%;border:3px solid transparent;flex:none;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);
}
.swatch.on{border-color:#fff;box-shadow:0 0 0 3px rgba(59,214,255,.55)}
.size{
  width:38px;height:38px;border-radius:12px;border:1px solid var(--line);
  background:#12203c;color:#fff;display:grid;place-items:center;flex:none;
}
.size.on{border-color:#3BD6FF;background:rgba(59,214,255,.2)}
.size i{display:block;border-radius:50%;background:#F4F1E8}
.wait{text-align:center;color:var(--text-2);font:650 16px/1.45 var(--font);padding:24px}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="sky" id="sky" aria-hidden="true"></div>
<div class="wrap" id="joinWrap">
  <div class="card" id="viewJoin">
    <div class="logo-wrap">
      <img class="logo" src="whiteboards-logo.png" width="1280" height="533" alt="Mini Whiteboards" decoding="async">
    </div>
    <h1>Join the boards</h1>
    <p class="sub">Enter the PIN from the board, then write your answer.</p>
    <p class="err" id="joinErr"></p>
    <label for="pin">PIN</label>
    <input id="pin" inputmode="numeric" maxlength="6" placeholder="6-digit PIN" autocomplete="one-time-code">
    <label for="nick">Your name</label>
    <input id="nick" maxlength="24" placeholder="First name" autocomplete="nickname">
    <button type="button" class="btn" id="btnJoin">Join</button>
  </div>
</div>

<div class="play hidden" id="viewPlay" hidden aria-hidden="true">
  <div class="play-bar">
    <p class="play-prompt" id="playPrompt">Show me your thinking</p>
    <p class="play-meta" id="playMeta"></p>
  </div>
  <div class="stage">
    <div class="paper" id="paper">
      <canvas id="board" width="1000" height="750"></canvas>
      <div class="lock hidden" id="lockMsg">Boards are locked.<br>Look at the class screen.</div>
    </div>
  </div>
  <div class="tools" id="tools"></div>
</div>

<script>
(function () {
  "use strict";

  var PAPER = "#F4F1E8";
  var COLORS = [
    { c: "#1A2340", label: "Ink" },
    { c: "#3B6CFF", label: "Blue" },
    { c: "#F45E68", label: "Red" },
    { c: "#35C796", label: "Green" },
    { c: "#F4A62A", label: "Amber" },
    { c: "#F4F1E8", label: "Eraser" }
  ];
  var SIZES = [3, 6, 12];
  var TOKEN_KEY = "kss-wb-token";
  var $ = function (id) { return document.getElementById(id); };
  var state = {
    pin: "",
    token: "",
    nickname: "",
    poll: null,
    strokes: [],
    round: 1,
    rev: 0,
    color: "#1A2340",
    width: 6,
    drawing: false,
    stroke: null,
    dirty: false,
    syncing: false,
    locked: false,
    closed: false,
    cache: null
  };

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function buildSky() {
    var sky = $("sky");
    if (!sky || sky.dataset.ready) return;
    sky.dataset.ready = "1";
    var html = "";
    for (var i = 0; i < 22; i++) {
      var size = 2 + Math.random() * 5;
      html += '<span class="spark' + (i % 3 === 0 ? " amber" : "") + '" style="width:' + size + "px;height:" + size +
        "px;left:" + (Math.random() * 100) + "%;top:" + (Math.random() * 100) +
        "%;animation-duration:" + (1.4 + Math.random() * 2.6) +
        "s;animation-delay:" + (Math.random() * 3) + 's"></span>';
    }
    sky.innerHTML = html;
  }

  function getToken() {
    try {
      var t = localStorage.getItem(TOKEN_KEY);
      if (t && t.length >= 16) return t;
    } catch (e) {}
    var fresh = "";
    var chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    for (var i = 0; i < 24; i++) fresh += chars.charAt(Math.floor(Math.random() * chars.length));
    try { localStorage.setItem(TOKEN_KEY, fresh); } catch (e2) {}
    return fresh;
  }

  function rpc(name, args) {
    if (!window.supabase) return Promise.reject(new Error("Not connected"));
    return window.supabase.rpc(name, args).then(function (res) {
      if (res.error) throw res.error;
      return res.data;
    });
  }

  function canvasEl() { return $("board"); }

  function pointFromEvent(e) {
    var canvas = canvasEl();
    var r = canvas.getBoundingClientRect();
    var x = ((e.clientX - r.left) / Math.max(1, r.width)) * 1000;
    var y = ((e.clientY - r.top) / Math.max(1, r.height)) * 750;
    return [
      Math.max(0, Math.min(1000, Math.round(x))),
      Math.max(0, Math.min(750, Math.round(y)))
    ];
  }

  function paint() {
    var canvas = canvasEl();
    if (!canvas) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var cssW = canvas.clientWidth || canvas.getBoundingClientRect().width || 320;
    var cssH = canvas.clientHeight || canvas.getBoundingClientRect().height || 240;
    var w = Math.max(1, Math.round(cssW * dpr));
    var h = Math.max(1, Math.round(cssH * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
    var ctx = canvas.getContext("2d");
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, w, h);
    var sx = w / 1000;
    var sy = h / 750;
    var all = state.strokes.slice();
    if (state.stroke) all.push(state.stroke);
    all.forEach(function (s) {
      var p = s && s.p;
      if (!p || p.length < 2) return;
      ctx.strokeStyle = s.c || "#1A2340";
      ctx.fillStyle = ctx.strokeStyle;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = Math.max(1.5, (s.w || 4) * Math.min(sx, sy));
      if (p.length < 4) {
        ctx.beginPath();
        ctx.arc(p[0] * sx, p[1] * sy, ctx.lineWidth / 2, 0, Math.PI * 2);
        ctx.fill();
        return;
      }
      ctx.beginPath();
      ctx.moveTo(p[0] * sx, p[1] * sy);
      for (var i = 2; i < p.length; i += 2) ctx.lineTo(p[i] * sx, p[i + 1] * sy);
      ctx.stroke();
    });
  }

  function currentWidth() {
    return state.color === PAPER ? Math.max(14, state.width * 2.2) : state.width;
  }

  function startStroke(e) {
    if (state.locked || state.closed) return;
    if (state.strokes.length >= 250) return;
    e.preventDefault();
    var canvas = canvasEl();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    var pt = pointFromEvent(e);
    state.drawing = true;
    state.stroke = { c: state.color, w: currentWidth(), p: [pt[0], pt[1]] };
    paint();
  }

  function moveStroke(e) {
    if (!state.drawing || !state.stroke) return;
    e.preventDefault();
    var pt = pointFromEvent(e);
    var p = state.stroke.p;
    var lx = p[p.length - 2];
    var ly = p[p.length - 1];
    if (Math.abs(pt[0] - lx) + Math.abs(pt[1] - ly) < 2) return;
    if (p.length >= 400) return;
    p.push(pt[0], pt[1]);
    paint();
  }

  function endStroke(e) {
    if (!state.drawing) return;
    if (e) e.preventDefault();
    state.drawing = false;
    if (state.stroke && state.stroke.p && state.stroke.p.length >= 2) {
      state.strokes.push(state.stroke);
      state.dirty = true;
      scheduleSync();
    }
    state.stroke = null;
    paint();
  }

  function scheduleSync() {
    clearTimeout(scheduleSync._t);
    scheduleSync._t = setTimeout(syncNow, 450);
  }

  function syncNow() {
    if (!state.dirty || state.syncing || !state.token || state.locked || state.closed) return;
    state.syncing = true;
    var payload = state.strokes;
    rpc("wb_submit_strokes", {
      p_token: state.token,
      p_strokes: payload,
      p_round: state.round
    }).then(function (data) {
      if (data && data.ok) {
        state.dirty = false;
        state.rev = data.rev || state.rev;
        return;
      }
      if (data && data.reason === "round") {
        state.round = data.round || (state.round + 1);
        state.strokes = Array.isArray(data.strokes) ? data.strokes : [];
        state.dirty = false;
        paint();
        return;
      }
      if (data && data.reason === "locked") {
        state.locked = true;
        renderLock();
      }
    }).catch(function () {
    }).then(function () {
      state.syncing = false;
      if (state.dirty) scheduleSync();
    });
  }

  function undo() {
    if (state.locked || !state.strokes.length) return;
    state.strokes.pop();
    state.dirty = true;
    paint();
    scheduleSync();
  }

  function wipeLocal() {
    if (state.locked) return;
    state.strokes = [];
    state.dirty = true;
    paint();
    scheduleSync();
  }

  function renderTools() {
    var html = COLORS.map(function (col) {
      var erase = col.c === PAPER;
      return '<button type="button" class="swatch' + (state.color === col.c ? " on" : "") +
        '" data-c="' + col.c + '" title="' + col.label + '" aria-label="' + col.label +
        '" style="background:' + (erase ? "repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/12px 12px" : col.c) + '"></button>';
    }).join("");
    html += SIZES.map(function (w) {
      var px = 6 + w;
      return '<button type="button" class="size' + (state.width === w ? " on" : "") +
        '" data-w="' + w + '" aria-label="Thickness ' + w + '"><i style="width:' + px + "px;height:" + px + 'px"></i></button>';
    }).join("");
    html += '<button type="button" class="btn-ghost" id="btnUndo">Undo</button>';
    html += '<button type="button" class="btn-ghost" id="btnWipe">Clear</button>';
    $("tools").innerHTML = html;
    $("tools").querySelectorAll("[data-c]").forEach(function (btn) {
      btn.onclick = function () {
        state.color = btn.getAttribute("data-c");
        renderTools();
      };
    });
    $("tools").querySelectorAll("[data-w]").forEach(function (btn) {
      btn.onclick = function () {
        state.width = parseInt(btn.getAttribute("data-w"), 10) || 6;
        renderTools();
      };
    });
    $("btnUndo").onclick = undo;
    $("btnWipe").onclick = wipeLocal;
  }

  function renderLock() {
    $("lockMsg").classList.toggle("hidden", !(state.locked || state.closed));
    if (state.closed) $("lockMsg").innerHTML = "This session has ended.<br>Look at the board with your class.";
    else $("lockMsg").innerHTML = "Boards are locked.<br>Look at the class screen.";
  }

  function showPlay() {
    $("joinWrap").classList.add("hidden");
    $("viewPlay").classList.remove("hidden");
    $("viewPlay").hidden = false;
    $("viewPlay").setAttribute("aria-hidden", "false");
    renderTools();
    requestAnimationFrame(function () {
      paint();
    });
  }

  function join() {
    var pin = String($("pin").value || "").replace(/\D/g, "").slice(0, 6);
    var nick = String($("nick").value || "").trim();
    $("joinErr").textContent = "";
    if (pin.length !== 6) {
      $("joinErr").textContent = "Enter the 6-digit PIN from the board.";
      return;
    }
    if (!nick) {
      $("joinErr").textContent = "Enter your name so your teacher knows whose board this is.";
      return;
    }
    state.token = getToken();
    $("btnJoin").disabled = true;
    rpc("wb_join_session", {
      p_pin: pin,
      p_nickname: nick,
      p_token: state.token
    }).then(function (data) {
      state.pin = pin;
      state.nickname = data.nickname || nick;
      state.round = data.round || 1;
      state.rev = data.rev || 0;
      state.strokes = Array.isArray(data.strokes) ? data.strokes : [];
      state.locked = !!data.locked;
      $("playPrompt").textContent = data.prompt || "Show me your thinking";
      showPlay();
      renderLock();
      startPoll();
    }).catch(function (err) {
      $("joinErr").textContent = (err && err.message) || "Could not join";
    }).then(function () {
      $("btnJoin").disabled = false;
    });
  }

  function refresh() {
    if (!state.pin) return;
    rpc("wb_get_session_state", {
      p_pin: state.pin,
      p_token: state.token
    }).then(function (data) {
      state.cache = data || {};
      var meta = (data.nickname || state.nickname || "") +
        (data.anonymous ? " · Name hidden on the board" : "") +
        " · " + (data.player_count || 0) + " joined";
      $("playMeta").textContent = meta;
      if (data.prompt) $("playPrompt").textContent = data.prompt;
      if (data.status === "closed") {
        state.closed = true;
        renderLock();
        return;
      }
      state.locked = !!data.locked;
      renderLock();
      if ((data.round || 1) !== state.round) {
        state.round = data.round || 1;
        state.strokes = Array.isArray(data.strokes) ? data.strokes : [];
        state.dirty = false;
        paint();
      }
    }).catch(function () {});
  }

  function startPoll() {
    if (state.poll) clearInterval(state.poll);
    refresh();
    state.poll = setInterval(refresh, 1600);
  }

  function boot() {
    buildSky();
    state.token = getToken();
    try {
      var pin = new URLSearchParams(location.search).get("c") || "";
      pin = String(pin).replace(/\D/g, "").slice(0, 6);
      if (pin) $("pin").value = pin;
    } catch (e) {}
    $("btnJoin").onclick = join;
    $("pin").addEventListener("keydown", function (e) { if (e.key === "Enter") join(); });
    $("nick").addEventListener("keydown", function (e) { if (e.key === "Enter") join(); });

    var canvas = canvasEl();
    canvas.addEventListener("pointerdown", startStroke);
    canvas.addEventListener("pointermove", moveStroke);
    canvas.addEventListener("pointerup", endStroke);
    canvas.addEventListener("pointercancel", endStroke);
    window.addEventListener("resize", paint);
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden && state.dirty) syncNow();
    });
  }

  boot();
})();
</script>
</body>
</html>
