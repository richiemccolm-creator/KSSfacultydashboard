<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Join Mini Whiteboards | Classroom Toolkit</title>
<script>window.FH_NO_VERSION_RELOAD=true;</script>
<script src="../app-version.js"></script>
<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-init.js"></script>
<link rel="stylesheet" href="../design-tokens.css">
<link rel="stylesheet" href="toolkit-ui.css">
<style>
/* Stop iOS double-tap zoom when pupils tap buttons quickly */
html{touch-action:manipulation}
/* Pupil phone page for Mini Whiteboards. Always stage mode. */
body{--accent:#0e7490;--accent-stage:#3bd6ff;--paper:#F4F1E8}
html,body{height:100%;overscroll-behavior:none}
body{overflow:hidden}

.wrap{
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:20px 16px 32px;
}
.card{width:min(420px,100%);padding:24px 20px}
.logo-wrap{width:min(240px,74%);margin:0 auto 12px}
.logo{width:100%;height:auto;display:block}
h1{margin:4px 0 6px;text-align:center;font:700 26px/1.15 var(--font-display);letter-spacing:-.025em}
.sub{margin:0 0 14px;text-align:center;color:var(--text-2);font:400 15px/1.45 var(--font)}
.err{min-height:1.3em;margin:0 0 6px;color:#ffb4b9;font:500 14px/1.35 var(--font);text-align:center}
label{margin:12px 0 6px}
input{min-height:50px;font-size:17px}
#pin{font:700 22px/1 var(--font-display);letter-spacing:.12em;text-align:center}
.card .btn{width:100%;min-height:52px;margin-top:18px;font-size:16px}
.btn-ghost{min-height:44px;padding:0 14px;flex:none}

/* Drawing view */
.play{
  position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;background:var(--stage);
  /* No pinch zoom, scrolling, text selection or magnifier anywhere on the drawing view */
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.play-bar{flex:none;display:flex;flex-direction:column;gap:4px;padding:12px 16px 10px;border-bottom:1px solid var(--stage-line)}
.play-prompt{margin:0;font:700 19px/1.25 var(--font-display);letter-spacing:-.02em}
.play-meta{margin:0;color:var(--muted);font:500 12.5px/1.3 var(--font)}
.stage{flex:1;min-height:0;padding:10px 10px 8px;display:flex}
/* The board is always 4:3 so it matches the tiles on the class screen; paint() sizes it to fit */
.paper{
  flex:1;min-height:0;min-width:0;position:relative;
  display:flex;align-items:center;justify-content:center;touch-action:none;
}
.paper canvas{
  width:100%;height:100%;display:block;flex:none;touch-action:none;cursor:crosshair;
  border-radius:14px;background:var(--paper);box-shadow:0 12px 32px rgba(0,0,0,.35);
}
.lock{
  position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;justify-content:center;
  background:rgba(11,20,39,.72);color:#fff;font:700 18px/1.35 var(--font-display);
  text-align:center;padding:20px;pointer-events:none;
}
.tools{flex:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:8px 12px 12px}
.swatch{width:40px;height:40px;border-radius:50%;border:3px solid transparent;flex:none;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.swatch.on{border-color:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent-stage) 60%,transparent)}
.size{width:40px;height:40px;border-radius:10px;border:1px solid var(--stage-line-strong);background:rgba(255,255,255,.04);display:grid;place-items:center;flex:none;padding:0}
.size.on{border-color:var(--accent-stage);background:color-mix(in srgb,var(--accent-stage) 18%,transparent)}
.size i{display:block;border-radius:50%;background:var(--paper)}
.wait{text-align:center;color:var(--text-2);font:500 16px/1.45 var(--font);padding:24px}

/* Stickers */
.sticker-btn{width:auto;min-width:40px;padding:0 10px;gap:6px;font:600 14px/1 var(--font);color:var(--text);display:inline-flex;align-items:center}
.sticker-btn .em{display:inline-flex;line-height:1}
.sticker-btn .em img,.sticker-tray img{display:block;pointer-events:none}
/* Floats over the bottom of the board so opening it never resizes the board */
.sticker-tray{
  position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:2;
  width:min(560px,calc(100% - 16px));padding:10px;border-radius:14px;
  background:rgba(17,28,51,.97);border:1px solid var(--stage-line-strong);box-shadow:0 12px 32px rgba(0,0,0,.45);
  display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;
}
.sticker-tray button{
  height:52px;border-radius:10px;border:1px solid transparent;background:rgba(255,255,255,.04);
  font-size:30px;line-height:1;padding:0;display:grid;place-items:center;
}
.sticker-tray button:hover{background:rgba(255,255,255,.1)}
.sticker-tray button.on{border-color:var(--accent-stage);background:color-mix(in srgb,var(--accent-stage) 18%,transparent)}
.sticker-hint{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:1;
  padding:7px 12px;border-radius:999px;background:rgba(11,20,39,.85);color:#fff;
  font:600 13px/1.2 var(--font);white-space:nowrap;pointer-events:none;
}
</style>
</head>
<body class="tk-stage">
<div class="sky" id="sky" aria-hidden="true"></div>
<div class="wrap" id="joinWrap">
  <div class="card" id="viewJoin">
    <div class="logo-wrap">
      <img class="logo" src="whiteboards-logo.png" width="1280" height="533" alt="Mini Whiteboards" decoding="async">
    </div>
    <h1>Join the boards</h1>
    <p class="sub">Enter the PIN from the board, then write your answer.</p>
    <p class="err" id="joinErr"></p>
    <label for="pin">PIN</label>
    <input id="pin" inputmode="numeric" maxlength="6" placeholder="6-digit PIN" autocomplete="one-time-code">
    <label for="nick">Your name</label>
    <input id="nick" maxlength="24" placeholder="First name" autocomplete="nickname">
    <button type="button" class="btn btn-primary" id="btnJoin">Join</button>
  </div>
</div>

<div class="play hidden" id="viewPlay" hidden aria-hidden="true">
  <div class="play-bar">
    <p class="play-prompt" id="playPrompt">Show me your thinking</p>
    <p class="play-meta" id="playMeta"></p>
  </div>
  <div class="stage">
    <div class="paper" id="paper">
      <canvas id="board" width="1000" height="750"></canvas>
      <p class="sticker-hint hidden" id="stickerHint"></p>
      <div class="sticker-tray hidden" id="stickerTray" role="group" aria-label="Stickers"></div>
      <div class="lock hidden" id="lockMsg">Boards are locked.<br>Look at the class screen.</div>
    </div>
  </div>
  <div class="tools" id="tools"></div>
</div>

<script>
(function () {
  "use strict";

  var PAPER = "#F4F1E8";
  var COLORS = [
    { c: "#1A2340", label: "Ink" },
    { c: "#3B6CFF", label: "Blue" },
    { c: "#F45E68", label: "Red" },
    { c: "#35C796", label: "Green" },
    { c: "#F4A62A", label: "Amber" },
    { c: "#F4F1E8", label: "Eraser" }
  ];
  var SIZES = [3, 6, 12];
  // Sticker ids must match the list in wb_sanitize_strokes (20261018120000_whiteboard_stickers.sql)
  var STICKERS = [
    { id: "thumbs_up", e: "\uD83D\uDC4D", label: "Thumbs up" },
    { id: "thumbs_down", e: "\uD83D\uDC4E", label: "Thumbs down" },
    { id: "clap", e: "\uD83D\uDC4F", label: "Clapping" },
    { id: "star", e: "\u2B50", label: "Star" },
    { id: "heart", e: "\u2764\uFE0F", label: "Heart" },
    { id: "check", e: "\u2705", label: "Tick" },
    { id: "cross", e: "\u274C", label: "Cross" },
    { id: "question", e: "\u2753", label: "Question" },
    { id: "idea", e: "\uD83D\uDCA1", label: "Idea" },
    { id: "think", e: "\uD83E\uDD14", label: "Thinking" },
    { id: "laugh", e: "\uD83D\uDE02", label: "Laughing" },
    { id: "smile", e: "\uD83D\uDE0A", label: "Smile" },
    { id: "wow", e: "\uD83D\uDE2E", label: "Wow" },
    { id: "sad", e: "\uD83D\uDE22", label: "Sad" },
    { id: "fire", e: "\uD83D\uDD25", label: "Fire" },
    { id: "hundred", e: "\uD83D\uDCAF", label: "100" },
    { id: "party", e: "\uD83C\uDF89", label: "Party" },
    { id: "theatre", e: "\uD83C\uDFAD", label: "Theatre masks" },
    { id: "palette", e: "\uD83C\uDFA8", label: "Palette" },
    { id: "rocket", e: "\uD83D\uDE80", label: "Rocket" }
  ];
  var STICKER_BY_ID = {};
  STICKERS.forEach(function (st) { STICKER_BY_ID[st.id] = st; });
  var STICKER_SIZES = { 3: 70, 6: 110, 12: 170 };
  var MAX_STICKERS = 40;
  var TOKEN_KEY = "kss-wb-token";
  var $ = function (id) { return document.getElementById(id); };
  var state = {
    pin: "",
    token: "",
    nickname: "",
    poll: null,
    strokes: [],
    round: 1,
    rev: 0,
    color: "#1A2340",
    width: 6,
    drawing: false,
    stroke: null,
    dirty: false,
    syncing: false,
    locked: false,
    closed: false,
    cache: null,
    sticker: null,
    trayOpen: false
  };

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function buildSky() {
    var sky = $("sky");
    if (!sky || sky.dataset.ready) return;
    sky.dataset.ready = "1";
    var html = "";
    for (var i = 0; i < 22; i++) {
      var size = 2 + Math.random() * 5;
      html += '<span class="spark' + (i % 3 === 0 ? " amber" : "") + '" style="width:' + size + "px;height:" + size +
        "px;left:" + (Math.random() * 100) + "%;top:" + (Math.random() * 100) +
        "%;animation-duration:" + (1.4 + Math.random() * 2.6) +
        "s;animation-delay:" + (Math.random() * 3) + 's"></span>';
    }
    sky.innerHTML = html;
  }

  function getToken() {
    try {
      var t = localStorage.getItem(TOKEN_KEY);
      if (t && t.length >= 16) return t;
    } catch (e) {}
    var fresh = "";
    var chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    for (var i = 0; i < 24; i++) fresh += chars.charAt(Math.floor(Math.random() * chars.length));
    try { localStorage.setItem(TOKEN_KEY, fresh); } catch (e2) {}
    return fresh;
  }

  function rpc(name, args) {
    if (!window.supabase) return Promise.reject(new Error("Not connected"));
    return window.supabase.rpc(name, args).then(function (res) {
      if (res.error) throw res.error;
      return res.data;
    });
  }

  // A missing function means the tool's database setup hasn't been run yet
  function joinError(err) {
    var code = err && err.code;
    if (code === "PGRST202" || code === "PGRST205" || code === "42883") {
      return "This activity isn't switched on yet. Tell your teacher.";
    }
    return (err && err.message) || "Could not join";
  }

  function canvasEl() { return $("board"); }

  function pointFromEvent(e) {
    var canvas = canvasEl();
    var r = canvas.getBoundingClientRect();
    var x = ((e.clientX - r.left) / Math.max(1, r.width)) * 1000;
    var y = ((e.clientY - r.top) / Math.max(1, r.height)) * 750;
    return [
      Math.max(0, Math.min(1000, Math.round(x))),
      Math.max(0, Math.min(750, Math.round(y)))
    ];
  }

  // Size the 4:3 board to fit. Safari's toolbar sliding in and out changes the height a little
  // while pupils draw; ignore that so the board (and the drawing) never jumps in size.
  var boardFit = { w: 0, h: 0 };
  function fitBoard(force) {
    var canvas = canvasEl();
    var paper = $("paper");
    if (!canvas || !paper) return;
    var availW = paper.clientWidth || 320;
    var availH = paper.clientHeight || 240;
    if (!force && boardFit.w && availW === boardFit.w && Math.abs(availH - boardFit.h) < 140) return;
    boardFit.w = availW;
    boardFit.h = availH;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var cssW = Math.max(1, Math.floor(Math.min(availW, availH * 4 / 3)));
    var cssH = Math.max(1, Math.floor(cssW * 3 / 4));
    canvas.style.width = cssW + "px";
    canvas.style.height = cssH + "px";
    canvas.width = Math.max(1, Math.round(cssW * dpr));
    canvas.height = Math.max(1, Math.round(cssH * dpr));
  }

  function strokeStyle(ctx, s, sx, sy) {
    ctx.strokeStyle = s.c || "#1A2340";
    ctx.fillStyle = ctx.strokeStyle;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = Math.max(1.5, (s.w || 4) * Math.min(sx, sy));
  }

  // While a line is being drawn, add just the newest bit instead of redrawing everything
  function drawSegment(s, from) {
    var canvas = canvasEl();
    var p = s.p;
    if (!canvas || from < 2 || p.length < from + 2) return;
    var ctx = canvas.getContext("2d");
    var sx = canvas.width / 1000;
    var sy = canvas.height / 750;
    strokeStyle(ctx, s, sx, sy);
    ctx.beginPath();
    ctx.moveTo(p[from - 2] * sx, p[from - 1] * sy);
    for (var i = from; i < p.length; i += 2) ctx.lineTo(p[i] * sx, p[i + 1] * sy);
    ctx.stroke();
  }

  // Stickers are drawn from image files so they look the same on every device;
  // a device's own emoji font can come out as dark blobs, so it is only a fallback while loading
  var stickerImgs = {};
  function stickerImg(id, onReady) {
    var img = stickerImgs[id];
    if (!img) {
      img = new Image();
      img.decoding = "async";
      img.onload = function () { if (onReady) onReady(); };
      img.src = "stickers/" + id + ".svg";
      stickerImgs[id] = img;
    }
    return img.complete && img.naturalWidth ? img : null;
  }

  function drawSticker(ctx, s, sx, sy) {
    var st = STICKER_BY_ID[s.e];
    if (!st || !s.p || s.p.length < 2) return;
    var size = Math.max(12, (s.w || 110) * sx);
    var img = stickerImg(s.e, paint);
    if (img) {
      ctx.drawImage(img, s.p[0] * sx - size / 2, s.p[1] * sy - size / 2, size, size);
      return;
    }
    ctx.save();
    ctx.fillStyle = "#1A2340";
    ctx.font = size + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(st.e, s.p[0] * sx, s.p[1] * sy);
    ctx.restore();
  }

  function paint() {
    var canvas = canvasEl();
    if (!canvas) return;
    if (!boardFit.w) fitBoard(true);
    var w = canvas.width;
    var h = canvas.height;
    var ctx = canvas.getContext("2d");
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, w, h);
    var sx = w / 1000;
    var sy = h / 750;
    var all = state.strokes.slice();
    if (state.stroke) all.push(state.stroke);
    all.forEach(function (s) {
      var p = s && s.p;
      if (!p || p.length < 2) return;
      if (s.e) { drawSticker(ctx, s, sx, sy); return; }
      strokeStyle(ctx, s, sx, sy);
      if (p.length < 4) {
        ctx.beginPath();
        ctx.arc(p[0] * sx, p[1] * sy, ctx.lineWidth / 2, 0, Math.PI * 2);
        ctx.fill();
        return;
      }
      ctx.beginPath();
      ctx.moveTo(p[0] * sx, p[1] * sy);
      for (var i = 2; i < p.length; i += 2) ctx.lineTo(p[i] * sx, p[i + 1] * sy);
      ctx.stroke();
    });
  }

  function currentWidth() {
    // Whole number: the server reads the width as an int and drops anything else to 4
    return state.color === PAPER ? Math.max(14, Math.round(state.width * 2.2)) : state.width;
  }

  function startStroke(e) {
    e.preventDefault();
    if (state.locked || state.closed) return;
    if (e.pointerType === "pen") state.penSeen = true;
    else if (state.penSeen && e.pointerType === "touch") return; // palm resting on the screen
    if (state.drawing) return; // a second finger while a line is being drawn
    if (state.strokes.length >= 250) return;
    if (state.sticker) { placeSticker(e); return; }
    var canvas = canvasEl();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    var pt = pointFromEvent(e);
    state.drawing = true;
    state.pointerId = e.pointerId;
    state.stroke = { c: state.color, w: currentWidth(), p: [pt[0], pt[1]] };
    paint();
  }

  function stickerCount() {
    return state.strokes.filter(function (s) { return s && s.e; }).length;
  }

  function placeSticker(e) {
    if (stickerCount() >= MAX_STICKERS) {
      showStickerHint("That's the most stickers for one board");
      return;
    }
    if (state.trayOpen) setTray(false);
    var pt = pointFromEvent(e);
    state.strokes.push({ e: state.sticker, w: STICKER_SIZES[state.width] || 110, p: [pt[0], pt[1]] });
    state.dirty = true;
    paint();
    scheduleSync();
  }

  function addPoint(e) {
    var pt = pointFromEvent(e);
    var p = state.stroke.p;
    var lx = p[p.length - 2];
    var ly = p[p.length - 1];
    if (Math.abs(pt[0] - lx) + Math.abs(pt[1] - ly) < 2) return;
    if (p.length >= 400) {
      // The server keeps strokes short, so carry on seamlessly in a new stroke
      if (state.strokes.length >= 249) return;
      state.strokes.push(state.stroke);
      state.dirty = true;
      state.stroke = { c: state.stroke.c, w: state.stroke.w, p: [lx, ly] };
      p = state.stroke.p;
    }
    p.push(pt[0], pt[1]);
  }

  function moveStroke(e) {
    if (!state.drawing || !state.stroke || e.pointerId !== state.pointerId) return;
    e.preventDefault();
    var before = state.stroke;
    var from = before.p.length;
    var events = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if (!events.length) events = [e];
    events.forEach(addPoint);
    if (state.stroke !== before) paint();
    else drawSegment(state.stroke, from);
  }

  function endStroke(e) {
    if (!state.drawing) return;
    if (e && e.pointerId !== state.pointerId) return;
    if (e) e.preventDefault();
    state.drawing = false;
    state.pointerId = null;
    if (state.stroke && state.stroke.p && state.stroke.p.length >= 2) {
      state.strokes.push(state.stroke);
      state.dirty = true;
      scheduleSync();
    }
    state.stroke = null;
    paint();
  }

  function scheduleSync() {
    clearTimeout(scheduleSync._t);
    scheduleSync._t = setTimeout(syncNow, 450);
  }

  function syncNow() {
    if (!state.dirty || state.syncing || !state.token || state.locked || state.closed) return;
    state.syncing = true;
    var payload = state.strokes;
    rpc("wb_submit_strokes", {
      p_token: state.token,
      p_strokes: payload,
      p_round: state.round
    }).then(function (data) {
      if (data && data.ok) {
        state.dirty = false;
        state.rev = data.rev || state.rev;
        return;
      }
      if (data && data.reason === "round") {
        state.round = data.round || (state.round + 1);
        state.strokes = Array.isArray(data.strokes) ? data.strokes : [];
        state.dirty = false;
        paint();
        return;
      }
      if (data && data.reason === "locked") {
        state.locked = true;
        renderLock();
      }
    }).catch(function () {
    }).then(function () {
      state.syncing = false;
      if (state.dirty) scheduleSync();
    });
  }

  function undo() {
    if (state.locked || !state.strokes.length) return;
    state.strokes.pop();
    state.dirty = true;
    paint();
    scheduleSync();
  }

  function wipeLocal() {
    if (state.locked) return;
    state.strokes = [];
    state.dirty = true;
    paint();
    scheduleSync();
  }

  function renderTools() {
    var html = COLORS.map(function (col) {
      var erase = col.c === PAPER;
      return '<button type="button" class="swatch' + (state.color === col.c ? " on" : "") +
        '" data-c="' + col.c + '" title="' + col.label + '" aria-label="' + col.label +
        '" style="background:' + (erase ? "repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/12px 12px" : col.c) + '"></button>';
    }).join("");
    html += SIZES.map(function (w) {
      var px = 6 + w;
      return '<button type="button" class="size' + (state.width === w ? " on" : "") +
        '" data-w="' + w + '" aria-label="Thickness ' + w + '"><i style="width:' + px + "px;height:" + px + 'px"></i></button>';
    }).join("");
    var chosen = state.sticker && STICKER_BY_ID[state.sticker];
    html += '<button type="button" class="size sticker-btn' + (state.sticker || state.trayOpen ? " on" : "") +
      '" id="btnStickers" aria-expanded="' + (state.trayOpen ? "true" : "false") + '" aria-controls="stickerTray">' +
      '<span class="em" aria-hidden="true">' + (chosen ? '<img src="stickers/' + chosen.id + '.svg" alt="" width="24" height="24">' : '<img src="stickers/smile.svg" alt="" width="24" height="24">') + "</span>Stickers</button>";
    html += '<button type="button" class="btn btn-ghost" id="btnUndo">Undo</button>';
    html += '<button type="button" class="btn btn-ghost" id="btnWipe">Clear</button>';
    $("tools").innerHTML = html;
    $("tools").querySelectorAll("[data-c]").forEach(function (btn) {
      btn.onclick = function () {
        state.color = btn.getAttribute("data-c");
        state.sticker = null; // picking a pen goes back to drawing
        setTray(false);
        renderTools();
      };
    });
    $("tools").querySelectorAll("[data-w]").forEach(function (btn) {
      btn.onclick = function () {
        state.width = parseInt(btn.getAttribute("data-w"), 10) || 6;
        renderTools();
      };
    });
    $("btnStickers").onclick = function () { setTray(!state.trayOpen); };
    $("btnUndo").onclick = undo;
    $("btnWipe").onclick = wipeLocal;
    updateStickerHint();
  }

  function renderTray() {
    $("stickerTray").innerHTML = STICKERS.map(function (st) {
      return '<button type="button" data-sticker="' + st.id + '" class="' + (state.sticker === st.id ? "on" : "") +
        '" aria-label="' + st.label + '" title="' + st.label + '"><img src="stickers/' + st.id + '.svg" alt="" width="34" height="34"></button>';
    }).join("");
    $("stickerTray").querySelectorAll("[data-sticker]").forEach(function (btn) {
      btn.onclick = function () {
        state.sticker = btn.getAttribute("data-sticker");
        setTray(false);
      };
    });
  }

  function setTray(open) {
    state.trayOpen = !!open;
    if (state.trayOpen) renderTray();
    $("stickerTray").classList.toggle("hidden", !state.trayOpen);
    renderTools();
  }

  function showStickerHint(text) {
    var el = $("stickerHint");
    el.textContent = text;
    el.classList.remove("hidden");
    clearTimeout(showStickerHint._t);
    showStickerHint._t = setTimeout(updateStickerHint, 2200);
  }

  function updateStickerHint() {
    var el = $("stickerHint");
    if (!el) return;
    var st = state.sticker && STICKER_BY_ID[state.sticker];
    if (st && !state.trayOpen) {
      el.textContent = "Tap the board to add " + st.e + ". Pick a pen to draw again.";
      el.classList.remove("hidden");
    } else {
      el.classList.add("hidden");
    }
  }

  function renderLock() {
    $("lockMsg").classList.toggle("hidden", !(state.locked || state.closed));
    if (state.closed) $("lockMsg").innerHTML = "This session has ended.<br>Look at the board with your class.";
    else $("lockMsg").innerHTML = "Boards are locked.<br>Look at the class screen.";
  }

  function showPlay() {
    $("joinWrap").classList.add("hidden");
    $("viewPlay").classList.remove("hidden");
    $("viewPlay").hidden = false;
    $("viewPlay").setAttribute("aria-hidden", "false");
    renderTools();
    STICKERS.forEach(function (st) { stickerImg(st.id, paint); });
    fitBoard(true);
    paint();
    requestAnimationFrame(function () {
      fitBoard(true);
      paint();
    });
  }

  function join() {
    var pin = String($("pin").value || "").replace(/\D/g, "").slice(0, 6);
    var nick = String($("nick").value || "").trim();
    $("joinErr").textContent = "";
    if (pin.length !== 6) {
      $("joinErr").textContent = "Enter the 6-digit PIN from the board.";
      return;
    }
    if (!nick) {
      $("joinErr").textContent = "Enter your name so your teacher knows whose board this is.";
      return;
    }
    state.token = getToken();
    $("btnJoin").disabled = true;
    rpc("wb_join_session", {
      p_pin: pin,
      p_nickname: nick,
      p_token: state.token
    }).then(function (data) {
      state.pin = pin;
      state.nickname = data.nickname || nick;
      state.round = data.round || 1;
      state.rev = data.rev || 0;
      state.strokes = Array.isArray(data.strokes) ? data.strokes : [];
      state.locked = !!data.locked;
      $("playPrompt").textContent = data.prompt || "Show me your thinking";
      showPlay();
      renderLock();
      startPoll();
    }).catch(function (err) {
      $("joinErr").textContent = joinError(err);
    }).then(function () {
      $("btnJoin").disabled = false;
    });
  }

  function refresh() {
    if (!state.pin) return;
    rpc("wb_get_session_state", {
      p_pin: state.pin,
      p_token: state.token
    }).then(function (data) {
      state.cache = data || {};
      var meta = (data.nickname || state.nickname || "") +
        (data.anonymous ? " · Name hidden on the board" : "") +
        " · " + (data.player_count || 0) + " joined";
      $("playMeta").textContent = meta;
      if (data.prompt) $("playPrompt").textContent = data.prompt;
      if (data.status === "closed") {
        state.closed = true;
        renderLock();
        return;
      }
      state.locked = !!data.locked;
      renderLock();
      if ((data.round || 1) !== state.round) {
        state.round = data.round || 1;
        state.strokes = Array.isArray(data.strokes) ? data.strokes : [];
        state.dirty = false;
        paint();
      }
    }).catch(function () {});
  }

  function startPoll() {
    if (state.poll) clearInterval(state.poll);
    refresh();
    state.poll = setInterval(refresh, 1600);
  }

  function boot() {
    buildSky();
    state.token = getToken();
    try {
      var pin = new URLSearchParams(location.search).get("c") || "";
      pin = String(pin).replace(/\D/g, "").slice(0, 6);
      if (pin) $("pin").value = pin;
    } catch (e) {}
    $("btnJoin").onclick = join;
    $("pin").addEventListener("keydown", function (e) { if (e.key === "Enter") join(); });
    $("nick").addEventListener("keydown", function (e) { if (e.key === "Enter") join(); });

    var canvas = canvasEl();
    canvas.addEventListener("pointerdown", startStroke);
    canvas.addEventListener("pointermove", moveStroke);
    canvas.addEventListener("pointerup", endStroke);
    canvas.addEventListener("pointercancel", endStroke);
    window.addEventListener("resize", function () { fitBoard(false); paint(); });
    window.addEventListener("orientationchange", function () {
      setTimeout(function () { fitBoard(true); paint(); }, 250);
    });
    // Safari ignores user-scalable=no, so stop its pinch and double-tap zoom directly
    ["gesturestart", "gesturechange", "gestureend"].forEach(function (name) {
      document.addEventListener(name, function (e) { e.preventDefault(); }, { passive: false });
    });
    document.addEventListener("touchmove", function (e) {
      if (e.touches && e.touches.length > 1) e.preventDefault();
    }, { passive: false });
    document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden && state.dirty) syncNow();
    });
  }

  boot();
})();
</script>
</body>
</html>
