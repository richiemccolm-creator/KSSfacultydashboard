<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Big Timer — Classroom Toolkit</title>
<script src="../app-version.js"></script>
<script>(function(){if(window.ensureAppVersionInUrl)window.ensureAppVersionInUrl();})();</script>
<script src="../config.js"></script>

<script src="../supabase-init.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050B1D; --bg-2:#081126; --surface:#0C1731;
  --line:rgba(124,148,205,.16); --line-strong:rgba(129,156,224,.28);
  --text:#F5F7FF; --text-2:#B6C0D9; --muted:#7D8AA8;
  --blue:#3B6CFF; --blue-soft:rgba(59,108,255,.18);
  --violet:#8658F5; --amber:#F4A62A; --coral:#F45E68; --mint:#35C796;
  --font:"Inter",ui-sans-serif,system-ui,sans-serif;
  --font-display:"General Sans","Inter",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{
  margin:0;font-family:var(--font);color:var(--text);min-height:100vh;
  background:
    radial-gradient(circle at 22% 0%,rgba(59,108,255,.14),transparent 38%),
    radial-gradient(circle at 90% 18%,rgba(134,88,245,.10),transparent 32%),
    var(--bg);
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}

.app{min-height:100vh;display:flex;flex-direction:column}
.top{
  display:flex;align-items:center;gap:14px;padding:14px 20px;
  border-bottom:1px solid rgba(130,150,200,.14);
  background:rgba(5,11,29,.9);backdrop-filter:blur(16px);position:sticky;top:0;z-index:20;
}
.back{
  display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:10px;
  border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--text-2);font:500 13px/1 var(--font);
}
.back:hover{color:#fff;border-color:var(--line-strong)}
.top h1{margin:0;font:650 17px/1.2 var(--font-display);letter-spacing:-.02em}
.top .sub{margin:2px 0 0;font:500 12px/1.2 var(--font);color:var(--muted)}
.top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{
  height:40px;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);
  background:#0D1831;color:var(--text-2);font:600 13.5px/1 var(--font);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:background .15s,border-color .15s,color .15s,filter .15s;
}
.btn:hover{color:#fff;border-color:var(--line-strong)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{
  border:none;color:#fff;
  background:linear-gradient(135deg,#3768FF,#4457D8);
  box-shadow:0 8px 20px -8px rgba(55,104,255,.55);
}
.btn-primary:hover{filter:brightness(1.08);color:#fff}
.btn-ghost{background:transparent}
.btn.on{
  color:#fff;border-color:rgba(59,108,255,.5);
  background:rgba(59,108,255,.22);
}
.btn-icon{width:44px;padding:0}

.main{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px 20px 36px;gap:22px;min-height:0;
}

.label-row{width:min(720px,100%);display:flex;justify-content:center}
.label-input{
  width:min(420px,100%);height:44px;text-align:center;border-radius:12px;
  border:1px solid rgba(132,153,207,.18);background:rgba(13,23,49,.7);
  padding:0 14px;outline:none;font:500 15px/1 var(--font);color:var(--text);
}
.label-input::placeholder{color:var(--muted)}
.label-input:focus{border-color:rgba(59,108,255,.55);box-shadow:0 0 0 3px rgba(59,108,255,.16)}

.presets{
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;
  width:min(720px,100%);
}
.presets .sep{width:1px;height:28px;background:var(--line);margin:0 4px}
.custom{
  display:inline-flex;align-items:center;gap:6px;
  height:44px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:#0D1831;
}
.custom input{
  width:44px;height:32px;border:none;background:transparent;text-align:center;
  font:600 15px/1 var(--font);outline:none;font-variant-numeric:tabular-nums;
}
.custom span{color:var(--muted);font:600 12px/1 var(--font)}

.stage{
  position:relative;width:min(520px,92vw);aspect-ratio:1;
  display:grid;place-items:center;
}
.stage.ended .ring-progress{stroke:var(--coral)!important;filter:drop-shadow(0 0 12px rgba(244,94,104,.55))}
.stage.ended .digits{color:#FFB4B9;animation:flash .7s var(--ease) 2}
@keyframes flash{0%,100%{opacity:1}50%{opacity:.45}}

.ring-svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring-track{fill:none;stroke:rgba(129,156,224,.14);stroke-width:7}
.ring-progress{
  fill:none;stroke:url(#timerGrad);stroke-width:7;stroke-linecap:round;
  filter:drop-shadow(0 0 10px rgba(134,88,245,.45));
  transition:stroke-dashoffset .08s linear;
}
.center{
  position:relative;z-index:1;text-align:center;padding:24px;
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.cap{font:500 14px/1 var(--font);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.digits{
  font:700 clamp(64px,16vw,128px)/1 var(--font-display);
  letter-spacing:-.04em;font-variant-numeric:tabular-nums;
  text-shadow:0 12px 40px rgba(0,0,0,.35);
}
.status{font:500 13px/1.3 var(--font);color:var(--text-2);min-height:1.2em}

.controls{
  display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:min(720px,100%);
}
.controls .btn{min-width:88px}
.controls .btn-primary{min-width:140px}

.hints{
  font:500 12px/1.4 var(--font);color:var(--muted);text-align:center;max-width:520px;
}
.hints kbd{
  display:inline-block;padding:2px 6px;border-radius:5px;border:1px solid var(--line);
  background:rgba(255,255,255,.03);font:600 11px/1 var(--font);color:var(--text-2);
}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);z-index:50;
  background:#fff;color:#081126;font:600 13.5px/1 var(--font);padding:12px 18px;border-radius:12px;
  box-shadow:0 14px 34px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

body.embedded .top .back{display:inline-flex}
html[data-fh-embed="1"] .top{padding-top:10px;padding-bottom:10px}

body:fullscreen .top,
body:-webkit-full-screen .top{
  position:fixed;left:0;right:0;top:0;background:rgba(5,11,29,.75);
}
body:fullscreen .main,
body:-webkit-full-screen .main{padding-top:88px}
body:fullscreen .hints,
body:-webkit-full-screen .hints{opacity:.55}

@media(max-width:640px){
  .top{padding:12px 14px;gap:10px}
  .top .sub{display:none}
  .main{padding:16px 14px 28px;gap:16px}
  .presets .sep{display:none}
  .custom{width:100%;justify-content:center}
  .controls .btn{flex:1 1 calc(50% - 10px)}
  .controls .btn-primary{flex:1 1 100%}
  .hints{display:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .stage.ended .digits{animation:none}
}
</style>
</head>
<body>
<script>(function(){
  try{
    var q=new URLSearchParams(location.search);
    if(q.get('embed')==='1'||q.get('embed')==='true'||sessionStorage.getItem('fh-embed')==='1'){
      document.body.classList.add('embedded');
    }
  }catch(e){}
})();</script>

<div class="app">
  <header class="top">
    <a class="back" id="backLink" href="../classroom_toolkit.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Toolkit
    </a>
    <div>
      <h1>Big Timer</h1>
      <p class="sub">Classroom countdown for Art &amp; Drama</p>
    </div>
    <div class="top-actions">
      <button type="button" class="btn btn-ghost on" id="btnRing" title="Toggle end sound" aria-pressed="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
        Ring
      </button>
      <button type="button" class="btn btn-ghost" id="btnFs" title="Fullscreen (F)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        Fullscreen
      </button>
    </div>
  </header>

  <main class="main">
    <div class="label-row">
      <input type="text" class="label-input" id="activityLabel" maxlength="60" placeholder="Activity label (optional) — e.g. Warm-up" autocomplete="off">
    </div>

    <div class="presets" id="presets" role="group" aria-label="Duration presets">
      <button type="button" class="btn" data-preset="60">1m</button>
      <button type="button" class="btn" data-preset="120">2m</button>
      <button type="button" class="btn" data-preset="180">3m</button>
      <button type="button" class="btn" data-preset="300">5m</button>
      <button type="button" class="btn" data-preset="600">10m</button>
      <span class="sep" aria-hidden="true"></span>
      <div class="custom">
        <input type="number" id="customMin" min="0" max="99" value="5" aria-label="Minutes" inputmode="numeric">
        <span>min</span>
        <input type="number" id="customSec" min="0" max="59" value="0" aria-label="Seconds" inputmode="numeric">
        <span>sec</span>
        <button type="button" class="btn btn-primary" id="btnCustomSet" style="height:32px;min-height:32px;padding:0 12px">Set</button>
      </div>
    </div>

    <div class="stage" id="stage" aria-live="polite">
      <svg class="ring-svg" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="timerGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3B6CFF"/>
            <stop offset=".5" stop-color="#8658F5"/>
            <stop offset="1" stop-color="#D843B2"/>
          </linearGradient>
        </defs>
        <circle class="ring-track" cx="50" cy="50" r="43"/>
        <circle class="ring-progress" id="ringArc" cx="50" cy="50" r="43"
          stroke-dasharray="270.2" stroke-dashoffset="0"/>
      </svg>
      <div class="center">
        <span class="cap" id="capText">Ready</span>
        <div class="digits" id="digits">05:00</div>
        <div class="status" id="statusText"></div>
      </div>
    </div>

    <div class="controls">
      <button type="button" class="btn" id="btnMinus" title="Subtract 30 seconds">−30s</button>
      <button type="button" class="btn btn-primary" id="btnToggle">Start</button>
      <button type="button" class="btn" id="btnReset" title="Reset (R)">Reset</button>
      <button type="button" class="btn" id="btnPlus" title="Add 30 seconds">+30s</button>
    </div>

    <p class="hints">
      <kbd>Space</kbd> start / pause · <kbd>R</kbd> reset · <kbd>F</kbd> fullscreen · presets <kbd>1</kbd>–<kbd>5</kbd>
    </p>
  </main>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "tk_big_timer_v1";
  var CIRC = 2 * Math.PI * 43;
  var PRESET_KEYS = { "1": 60, "2": 120, "3": 180, "4": 300, "5": 600 };

  var $ = function (id) { return document.getElementById(id); };

  var state = {
    total: 300,
    remaining: 300,
    running: false,
    ended: false,
    ring: true,
    label: "",
    lastTs: null
  };

  var audioCtx = null;
  var toastT = null;

  function toast(msg) {
    var el = $("toast");
    if (!el) return;
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastT);
    toastT = setTimeout(function () { el.classList.remove("show"); }, 2000);
  }

  function loadPrefs() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var data = JSON.parse(raw);
      if (data && typeof data.total === "number" && data.total > 0) {
        state.total = Math.min(99 * 60 + 59, Math.max(1, Math.floor(data.total)));
        state.remaining = state.total;
      }
      if (typeof data.ring === "boolean") state.ring = data.ring;
      if (typeof data.label === "string") state.label = data.label.slice(0, 60);
    } catch (e) {}
  }

  function savePrefs() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        total: state.total,
        ring: state.ring,
        label: state.label
      }));
    } catch (e) {}
  }

  function fmt(secs) {
    var s = Math.max(0, Math.ceil(secs));
    var m = Math.floor(s / 60);
    var r = s % 60;
    return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r;
  }

  function clampDuration(sec) {
    return Math.min(99 * 60 + 59, Math.max(1, Math.floor(sec)));
  }

  function ensureAudio() {
    if (audioCtx) return audioCtx;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
    return audioCtx;
  }

  function playChime() {
    if (!state.ring) return;
    var ctx = ensureAudio();
    if (!ctx) return;
    if (ctx.state === "suspended") ctx.resume();
    var now = ctx.currentTime;
    [0, 0.18, 0.36].forEach(function (delay, i) {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = i === 2 ? 880 : 660;
      gain.gain.setValueAtTime(0.0001, now + delay);
      gain.gain.exponentialRampToValueAtTime(0.18, now + delay + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + delay + 0.28);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + delay);
      osc.stop(now + delay + 0.32);
    });
  }

  function syncCustomInputs() {
    var m = Math.floor(state.total / 60);
    var s = state.total % 60;
    $("customMin").value = String(m);
    $("customSec").value = String(s);
  }

  function syncPresetButtons() {
    document.querySelectorAll("[data-preset]").forEach(function (btn) {
      var v = parseInt(btn.getAttribute("data-preset"), 10);
      btn.classList.toggle("on", !state.running && v === state.total);
    });
  }

  function draw() {
    $("digits").textContent = fmt(state.remaining);
    var progress = state.total > 0 ? state.remaining / state.total : 0;
    $("ringArc").setAttribute("stroke-dasharray", CIRC.toFixed(2));
    $("ringArc").setAttribute("stroke-dashoffset", (CIRC * (1 - progress)).toFixed(2));

    var stage = $("stage");
    stage.classList.toggle("ended", state.ended);

    var cap = $("capText");
    var status = $("statusText");
    if (state.ended) {
      cap.textContent = "Time's up";
      status.textContent = state.label ? state.label : "";
    } else if (state.running) {
      cap.textContent = "Time left";
      status.textContent = state.label || "";
    } else if (state.remaining < state.total && state.remaining > 0) {
      cap.textContent = "Paused";
      status.textContent = state.label || "Press Start or Space to continue";
    } else {
      cap.textContent = "Ready";
      status.textContent = state.label || "";
    }

    $("btnToggle").textContent = state.running ? "Pause" : (state.remaining < state.total && !state.ended ? "Resume" : "Start");
    $("btnRing").classList.toggle("on", state.ring);
    $("btnRing").setAttribute("aria-pressed", state.ring ? "true" : "false");
    var canAdjust = !state.running;
    $("btnMinus").disabled = !canAdjust;
    $("btnPlus").disabled = !canAdjust;
    document.querySelectorAll("[data-preset]").forEach(function (b) { b.disabled = state.running; });
    $("btnCustomSet").disabled = state.running;
    $("customMin").disabled = state.running;
    $("customSec").disabled = state.running;
    syncPresetButtons();
  }

  function setDuration(sec, keepRunning) {
    state.total = clampDuration(sec);
    state.remaining = state.total;
    state.ended = false;
    if (!keepRunning) state.running = false;
    state.lastTs = null;
    syncCustomInputs();
    savePrefs();
    draw();
  }

  function adjust(delta) {
    if (state.running) return;
    var next = clampDuration((state.ended ? 0 : state.remaining) + delta);
    if (state.ended || state.remaining === state.total) {
      setDuration(next, false);
    } else {
      state.remaining = next;
      state.total = Math.max(state.total, next);
      state.ended = false;
      savePrefs();
      draw();
    }
  }

  function start() {
    if (state.ended || state.remaining <= 0) {
      state.remaining = state.total;
      state.ended = false;
    }
    state.running = true;
    state.lastTs = null;
    ensureAudio();
    draw();
  }

  function pause() {
    state.running = false;
    state.lastTs = null;
    draw();
  }

  function toggle() {
    if (state.running) pause();
    else start();
  }

  function reset() {
    state.remaining = state.total;
    state.running = false;
    state.ended = false;
    state.lastTs = null;
    draw();
  }

  function onEnded() {
    state.remaining = 0;
    state.running = false;
    state.ended = true;
    state.lastTs = null;
    draw();
    playChime();
  }

  function tick(ts) {
    if (state.running) {
      if (state.lastTs == null) state.lastTs = ts;
      var dt = (ts - state.lastTs) / 1000;
      state.lastTs = ts;
      state.remaining -= dt;
      if (state.remaining <= 0) onEnded();
      else draw();
    } else {
      state.lastTs = null;
    }
    requestAnimationFrame(tick);
  }

  function readCustomSeconds() {
    var m = parseInt($("customMin").value, 10);
    var s = parseInt($("customSec").value, 10);
    if (isNaN(m)) m = 0;
    if (isNaN(s)) s = 0;
    m = Math.min(99, Math.max(0, m));
    s = Math.min(59, Math.max(0, s));
    var total = m * 60 + s;
    return total > 0 ? total : 1;
  }

  function toggleFullscreen() {
    var doc = document;
    var el = document.documentElement;
    if (!doc.fullscreenElement && !doc.webkitFullscreenElement) {
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) req.call(el);
    } else {
      var exit = doc.exitFullscreen || doc.webkitExitFullscreen;
      if (exit) exit.call(doc);
    }
  }

  // events
  $("presets").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-preset]");
    if (!btn || state.running) return;
    setDuration(parseInt(btn.getAttribute("data-preset"), 10), false);
  });

  $("btnCustomSet").addEventListener("click", function () {
    if (state.running) return;
    setDuration(readCustomSeconds(), false);
    toast("Duration set to " + fmt(state.total));
  });

  $("btnToggle").addEventListener("click", toggle);
  $("btnReset").addEventListener("click", reset);
  $("btnMinus").addEventListener("click", function () { adjust(-30); });
  $("btnPlus").addEventListener("click", function () { adjust(30); });

  $("btnRing").addEventListener("click", function () {
    state.ring = !state.ring;
    savePrefs();
    draw();
    toast(state.ring ? "Ring at end on" : "Ring at end off");
  });

  $("btnFs").addEventListener("click", toggleFullscreen);

  $("activityLabel").addEventListener("input", function (e) {
    state.label = String(e.target.value || "").slice(0, 60);
    savePrefs();
    draw();
  });

  document.addEventListener("keydown", function (e) {
    var tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;

    if (e.code === "Space") {
      e.preventDefault();
      toggle();
      return;
    }
    if (e.key === "r" || e.key === "R") {
      e.preventDefault();
      reset();
      return;
    }
    if (e.key === "f" || e.key === "F") {
      e.preventDefault();
      toggleFullscreen();
      return;
    }
    if (PRESET_KEYS[e.key] && !state.running) {
      e.preventDefault();
      setDuration(PRESET_KEYS[e.key], false);
    }
  });

  (function patchBackLink() {
    var a = $("backLink");
    if (!a) return;
    try {
      if (new URLSearchParams(location.search).get("embed") === "1" || sessionStorage.getItem("fh-embed") === "1") {
        a.href = "../classroom_toolkit.html?embed=1";
      }
    } catch (e) {}
  })();

  loadPrefs();
  $("activityLabel").value = state.label || "";
  $("ringArc").setAttribute("stroke-dasharray", CIRC.toFixed(2));
  syncCustomInputs();
  draw();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
