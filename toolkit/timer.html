<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Big Timer — Classroom Toolkit</title>
<script src="../app-version.js"></script>
<script>(function(){if(window.ensureAppVersionInUrl)window.ensureAppVersionInUrl();})();</script>
<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-init.js"></script>
<script src="../allowlist-check.js"></script>
<script>window.__authGuardLoginPath='../login.html';</script>
<script src="../auth-guard.js"></script>
<script src="../classroom-toolkit-library-service.js"></script>
<script src="../embed-chrome.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#030712; --bg-2:#06101F; --surface:#0C1731;
  --line:rgba(124,148,205,.16); --line-strong:rgba(129,156,224,.28);
  --text:#F5F7FF; --text-2:#B6C0D9; --muted:#7D8AA8;
  --blue:#3B6CFF; --blue-soft:rgba(59,108,255,.18);
  --violet:#8658F5; --amber:#F4A62A; --coral:#F45E68; --mint:#35C796;
  --glow:rgba(59,108,255,.55);
  --ring-a:#3B6CFF; --ring-b:#8658F5; --ring-c:#D843B2;
  --font:"Inter",ui-sans-serif,system-ui,sans-serif;
  --font-display:"General Sans","Inter",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --urgency:0;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{
  margin:0;font-family:var(--font);color:var(--text);min-height:100vh;
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  transition:background .6s var(--ease);
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0;
}

/* —— Atmosphere —— */
.fx{
  position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;
}
.fx-mesh{
  position:absolute;inset:-20%;
  background:
    radial-gradient(ellipse 50% 40% at 20% 10%,rgba(59,108,255,.28),transparent 55%),
    radial-gradient(ellipse 45% 35% at 85% 15%,rgba(134,88,245,.22),transparent 50%),
    radial-gradient(ellipse 40% 45% at 70% 90%,rgba(216,67,178,.12),transparent 55%),
    radial-gradient(ellipse 35% 30% at 10% 80%,rgba(53,199,150,.08),transparent 50%);
  animation:meshDrift 18s ease-in-out infinite alternate;
  transition:opacity .8s,filter .8s;
}
.fx-mesh::after{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(circle at 50% 55%,rgba(59,108,255,.08),transparent 42%);
  animation:meshPulse 4.5s ease-in-out infinite;
}
@keyframes meshDrift{
  0%{transform:translate(0,0) scale(1) rotate(0deg)}
  100%{transform:translate(-3%,2%) scale(1.08) rotate(4deg)}
}
@keyframes meshPulse{
  0%,100%{opacity:.55;transform:scale(1)}
  50%{opacity:1;transform:scale(1.12)}
}
.fx-aurora{
  position:absolute;left:-10%;right:-10%;top:30%;height:50%;
  background:linear-gradient(105deg,
    transparent 0%,
    rgba(59,108,255,.07) 25%,
    rgba(134,88,245,.12) 45%,
    rgba(216,67,178,.08) 60%,
    transparent 80%);
  filter:blur(40px);
  animation:auroraSweep 12s ease-in-out infinite;
  opacity:.7;
}
@keyframes auroraSweep{
  0%,100%{transform:translateX(-8%) skewX(-8deg);opacity:.4}
  50%{transform:translateX(8%) skewX(6deg);opacity:.85}
}
.fx-grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(130,160,220,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(130,160,220,.035) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse 70% 60% at 50% 48%,#000 20%,transparent 75%);
  animation:gridBreathe 8s ease-in-out infinite;
}
@keyframes gridBreathe{
  0%,100%{opacity:.35;background-size:56px 56px}
  50%{opacity:.7;background-size:58px 58px}
}
.fx-stars{position:absolute;inset:0}
.fx-star{
  position:absolute;width:2px;height:2px;border-radius:50%;
  background:#fff;opacity:0;
  animation:twinkle var(--dur,3s) ease-in-out var(--delay,0s) infinite;
  box-shadow:0 0 6px rgba(180,200,255,.8);
}
@keyframes twinkle{
  0%,100%{opacity:0;transform:scale(.5)}
  40%{opacity:var(--bright,.7);transform:scale(1)}
  60%{opacity:var(--bright,.4);transform:scale(1.2)}
}
.fx-vignette{
  position:absolute;inset:0;
  background:radial-gradient(ellipse 75% 70% at 50% 48%,transparent 35%,rgba(3,7,18,.75) 100%);
  transition:background .5s;
}
.fx-shock{
  position:absolute;inset:0;opacity:0;pointer-events:none;
  background:radial-gradient(circle at 50% 48%,rgba(255,255,255,.35),transparent 45%);
  mix-blend-mode:screen;
}
.fx-edge{
  position:absolute;inset:0;opacity:0;
  box-shadow:inset 0 0 80px rgba(244,94,104,0),inset 0 0 160px rgba(244,94,104,0);
  transition:opacity .4s,box-shadow .4s;
}

body.is-running .fx-mesh{animation-duration:12s}
body.is-running .fx-aurora{animation-duration:8s;opacity:1}
body.is-warn{
  --glow:rgba(244,166,42,.6);
  --ring-a:#F4A62A; --ring-b:#FF7A3D; --ring-c:#F45E68;
}
body.is-warn .fx-mesh{
  background:
    radial-gradient(ellipse 50% 40% at 20% 10%,rgba(244,166,42,.22),transparent 55%),
    radial-gradient(ellipse 45% 35% at 85% 15%,rgba(255,122,61,.18),transparent 50%),
    radial-gradient(ellipse 40% 45% at 70% 90%,rgba(244,94,104,.14),transparent 55%),
    radial-gradient(ellipse 35% 30% at 10% 80%,rgba(244,166,42,.08),transparent 50%);
}
body.is-critical{
  --glow:rgba(244,94,104,.75);
  --ring-a:#FF4D5A; --ring-b:#F45E68; --ring-c:#FF2D55;
}
body.is-critical .fx-edge{
  opacity:1;
  box-shadow:inset 0 0 90px rgba(244,94,104,.35),inset 0 0 180px rgba(244,94,104,.18);
  animation:edgePulse .7s ease-in-out infinite;
}
@keyframes edgePulse{
  0%,100%{box-shadow:inset 0 0 70px rgba(244,94,104,.28),inset 0 0 150px rgba(244,94,104,.12)}
  50%{box-shadow:inset 0 0 110px rgba(244,94,104,.5),inset 0 0 200px rgba(244,94,104,.25)}
}
body.is-ended .fx-mesh{
  background:
    radial-gradient(ellipse 55% 45% at 50% 45%,rgba(244,94,104,.35),transparent 55%),
    radial-gradient(ellipse 40% 35% at 20% 20%,rgba(255,122,61,.2),transparent 50%),
    radial-gradient(ellipse 40% 35% at 80% 70%,rgba(134,88,245,.18),transparent 50%);
  filter:saturate(1.3);
}
body.is-ended .fx-shock{animation:shockwave .9s var(--ease-out) forwards}
@keyframes shockwave{
  0%{opacity:1;transform:scale(.4)}
  100%{opacity:0;transform:scale(2.2)}
}

.app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
.top{
  display:flex;align-items:center;gap:14px;padding:14px 20px;
  border-bottom:1px solid rgba(130,150,200,.14);
  background:rgba(5,11,29,.75);backdrop-filter:blur(18px);position:sticky;top:0;z-index:20;
}
.back{
  display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:10px;
  border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--text-2);font:500 13px/1 var(--font);
  transition:color .15s,border-color .15s,transform .2s var(--ease);
}
.back:hover{color:#fff;border-color:var(--line-strong);transform:translateX(-2px)}
.top-brand{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.top-logo{
  display:block;height:clamp(40px,5.5vh,56px);width:auto;max-width:min(46vw,300px);
  object-fit:contain;
  filter:drop-shadow(0 0 14px rgba(55,104,255,.4));
  animation:logoGlow 4s ease-in-out infinite;
}
@keyframes logoGlow{
  0%,100%{filter:drop-shadow(0 0 10px rgba(55,104,255,.35))}
  50%{filter:drop-shadow(0 0 22px rgba(134,88,245,.55))}
}
.top h1{margin:0;font:650 17px/1.2 var(--font-display);letter-spacing:-.02em}
.top .sub{margin:0;font:500 12px/1.2 var(--font);color:var(--muted)}
.top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{
  height:40px;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);
  background:#0D1831;color:var(--text-2);font:600 13.5px/1 var(--font);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:background .15s,border-color .15s,color .15s,filter .15s,transform .2s var(--ease),box-shadow .2s;
}
.btn:hover{color:#fff;border-color:var(--line-strong);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-primary{
  border:none;color:#fff;
  background:linear-gradient(135deg,#3768FF,#6B4DE8 50%,#D843B2);
  background-size:200% 200%;
  box-shadow:0 8px 24px -6px rgba(55,104,255,.6),0 0 0 0 rgba(59,108,255,.4);
  animation:ctaShimmer 4s ease infinite;
}
.btn-primary:hover{filter:brightness(1.1);color:#fff;box-shadow:0 10px 28px -4px rgba(134,88,245,.65)}
@keyframes ctaShimmer{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
.btn-ghost{background:transparent}
.btn.on{
  color:#fff;border-color:rgba(59,108,255,.5);
  background:rgba(59,108,255,.22);
  box-shadow:0 0 16px -4px rgba(59,108,255,.45);
}
.btn-icon{width:44px;padding:0}

.main{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px 20px 36px;gap:22px;min-height:0;
}

.label-row{width:min(720px,100%);display:flex;justify-content:center}
.label-input{
  width:min(420px,100%);height:44px;text-align:center;border-radius:12px;
  border:1px solid rgba(132,153,207,.18);background:rgba(13,23,49,.55);
  padding:0 14px;outline:none;font:500 15px/1 var(--font);color:var(--text);
  backdrop-filter:blur(8px);
  transition:border-color .2s,box-shadow .2s,transform .25s var(--ease);
}
.label-input::placeholder{color:var(--muted)}
.label-input:focus{
  border-color:rgba(59,108,255,.55);
  box-shadow:0 0 0 3px rgba(59,108,255,.16),0 0 24px -4px rgba(59,108,255,.35);
  transform:scale(1.02);
}

.presets{
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;
  width:min(720px,100%);
}
.presets .btn{transition:transform .2s var(--ease),background .15s,border-color .15s,box-shadow .25s}
.presets .btn.on{
  animation:presetPop .45s var(--ease-out);
  box-shadow:0 0 20px -4px var(--glow);
}
@keyframes presetPop{
  0%{transform:scale(.92)}
  60%{transform:scale(1.06)}
  100%{transform:scale(1)}
}
.presets .sep{width:1px;height:28px;background:var(--line);margin:0 4px}
.custom{
  display:inline-flex;align-items:center;gap:6px;
  height:44px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:rgba(13,24,49,.8);
  backdrop-filter:blur(8px);
}
.custom input{
  width:44px;height:32px;border:none;background:transparent;text-align:center;
  font:600 15px/1 var(--font);outline:none;font-variant-numeric:tabular-nums;
}
.custom span{color:var(--muted);font:600 12px/1 var(--font)}

/* —— Stage —— */
.stage{
  position:relative;width:min(540px,92vw);aspect-ratio:1;
  display:grid;place-items:center;
  --progress:1;
}
.stage-glow{
  position:absolute;inset:8%;border-radius:50%;
  background:radial-gradient(circle,var(--glow),transparent 68%);
  filter:blur(28px);opacity:.45;
  animation:coreGlow 3.2s ease-in-out infinite;
  transition:background .5s,opacity .4s;
}
@keyframes coreGlow{
  0%,100%{opacity:.35;transform:scale(.92)}
  50%{opacity:.65;transform:scale(1.05)}
}
body.is-running .stage-glow{animation-duration:2s;opacity:.7}
body.is-warn .stage-glow{animation-duration:1.2s}
body.is-critical .stage-glow{animation-duration:.55s;opacity:.9}
body.is-ended .stage-glow{
  background:radial-gradient(circle,rgba(244,94,104,.7),transparent 68%);
  animation:endGlow .8s var(--ease-out) 2;
}
@keyframes endGlow{
  0%,100%{opacity:.4;transform:scale(1)}
  50%{opacity:1;transform:scale(1.25)}
}

.orbit{
  position:absolute;inset:4%;border-radius:50%;
  border:1px solid rgba(130,160,220,.08);
  animation:orbitSpin 28s linear infinite;
}
.orbit::before,.orbit::after{
  content:"";position:absolute;width:8px;height:8px;border-radius:50%;
  background:var(--ring-a);box-shadow:0 0 12px var(--glow);
  top:50%;left:50%;margin:-4px;
}
.orbit::before{transform:translateX(calc(min(270px,46vw) * .92))}
.orbit::after{
  width:5px;height:5px;margin:-2.5px;
  background:var(--ring-c);
  transform:translateX(calc(min(270px,46vw) * -.92));
}
.orbit-2{
  inset:0;animation-duration:40s;animation-direction:reverse;
  border-color:rgba(130,160,220,.05);
  opacity:.6;
}
.orbit-2::before{
  width:6px;height:6px;margin:-3px;
  background:var(--ring-b);
  transform:rotate(120deg) translateX(calc(min(270px,46vw)));
}
.orbit-2::after{
  width:4px;height:4px;margin:-2px;
  background:#fff;opacity:.7;
  transform:rotate(250deg) translateX(calc(min(270px,46vw)));
}
@keyframes orbitSpin{to{transform:rotate(360deg)}}
body.is-running .orbit{animation-duration:16s}
body.is-warn .orbit{animation-duration:10s}
body.is-critical .orbit{animation-duration:5s}

.ripple{
  position:absolute;inset:12%;border-radius:50%;
  border:2px solid rgba(59,108,255,.0);
  pointer-events:none;opacity:0;
}
.stage.is-starting .ripple{animation:rippleOut 1s var(--ease-out) forwards}
@keyframes rippleOut{
  0%{opacity:.8;transform:scale(.7);border-color:rgba(134,88,245,.6)}
  100%{opacity:0;transform:scale(1.45);border-color:rgba(59,108,255,0)}
}

.burst{position:absolute;inset:0;pointer-events:none}
.burst-ray{
  position:absolute;left:50%;top:50%;width:3px;height:18%;
  margin-left:-1.5px;transform-origin:50% 0;
  background:linear-gradient(to bottom,rgba(255,255,255,.9),transparent);
  opacity:0;border-radius:2px;
}
.stage.ended .burst-ray{animation:rayBurst .85s var(--ease-out) forwards}
@keyframes rayBurst{
  0%{opacity:0;transform:rotate(var(--a)) scaleY(.2)}
  30%{opacity:1;transform:rotate(var(--a)) scaleY(1.1)}
  100%{opacity:0;transform:rotate(var(--a)) scaleY(1.4) translateY(8%)}
}

.ring-svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring-track{fill:none;stroke:rgba(129,156,224,.12);stroke-width:6}
.ring-glow{
  fill:none;stroke:url(#timerGrad);stroke-width:14;stroke-linecap:round;
  opacity:.22;filter:blur(4px);
  transition:stroke-dashoffset .08s linear;
}
.ring-progress{
  fill:none;stroke:url(#timerGrad);stroke-width:7;stroke-linecap:round;
  filter:drop-shadow(0 0 12px var(--glow));
  transition:stroke-dashoffset .08s linear,filter .4s;
}
.ring-tick{
  fill:none;stroke:rgba(180,200,255,.12);stroke-width:1.2;
}
body.is-running .ring-progress{filter:drop-shadow(0 0 16px var(--glow))}
body.is-warn .ring-progress,body.is-warn .ring-glow{filter:drop-shadow(0 0 18px rgba(244,166,42,.7))}
body.is-critical .ring-progress{
  filter:drop-shadow(0 0 22px rgba(244,94,104,.85));
  animation:ringCritical .5s ease-in-out infinite;
}
@keyframes ringCritical{
  0%,100%{stroke-width:7}
  50%{stroke-width:9}
}
.stage.ended .ring-progress{
  stroke:url(#timerGradEnd)!important;
  filter:drop-shadow(0 0 28px rgba(244,94,104,.95));
  animation:ringSlam .7s var(--ease-out);
}
.stage.ended .ring-glow{
  stroke:url(#timerGradEnd)!important;
  opacity:.45;filter:blur(6px);
}
@keyframes ringSlam{
  0%{stroke-width:4;opacity:.55}
  45%{stroke-width:16;opacity:1}
  100%{stroke-width:8;opacity:1}
}

.center{
  position:relative;z-index:2;text-align:center;padding:24px;
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.cap{
  font:600 13px/1 var(--font);color:var(--muted);letter-spacing:.18em;text-transform:uppercase;
  transition:color .3s,transform .35s var(--ease),opacity .3s;
  opacity:.85;
}
.cap-live{
  display:inline-flex;align-items:center;gap:8px;
}
.cap-dot{
  width:8px;height:8px;border-radius:50%;background:var(--mint);
  box-shadow:0 0 10px rgba(53,199,150,.8);
  animation:liveDot 1.2s ease-in-out infinite;
  display:none;
}
body.is-running .cap-dot{display:block}
body.is-warn .cap-dot{background:var(--amber);box-shadow:0 0 10px rgba(244,166,42,.8)}
body.is-critical .cap-dot{background:var(--coral);box-shadow:0 0 10px rgba(244,94,104,.9);animation-duration:.5s}
@keyframes liveDot{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.45;transform:scale(.75)}
}
.digits{
  font:700 clamp(68px,17vw,136px)/.95 var(--font-display);
  letter-spacing:-.045em;font-variant-numeric:tabular-nums;
  text-shadow:
    0 0 40px var(--glow),
    0 16px 48px rgba(0,0,0,.45);
  transition:color .35s,text-shadow .35s,transform .15s var(--ease);
  will-change:transform;
}
.digits.tick{animation:digitTick .28s var(--ease-out)}
@keyframes digitTick{
  0%{transform:scale(1.04);filter:brightness(1.25)}
  100%{transform:scale(1);filter:brightness(1)}
}
body.is-warn .digits{
  color:#FFE0A8;
  text-shadow:0 0 48px rgba(244,166,42,.55),0 16px 48px rgba(0,0,0,.45);
}
body.is-critical .digits{
  color:#FFB4B9;
  text-shadow:0 0 56px rgba(244,94,104,.7),0 16px 48px rgba(0,0,0,.45);
  animation:digitUrgent .55s ease-in-out infinite;
}
@keyframes digitUrgent{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.03)}
}
.stage.ended .digits{
  color:#FFB4B9;
  animation:timeUpSlam .7s var(--ease-out), flashEnded 1s var(--ease) .7s 3;
}
@keyframes timeUpSlam{
  0%{transform:scale(.4);opacity:0;filter:blur(12px)}
  55%{transform:scale(1.12);opacity:1;filter:blur(0)}
  100%{transform:scale(1)}
}
@keyframes flashEnded{
  0%,100%{opacity:1}
  50%{opacity:.4}
}
.status{
  font:500 14px/1.35 var(--font);color:var(--text-2);min-height:1.35em;
  transition:opacity .3s,transform .35s var(--ease);
}
.stage.ended .cap{
  color:#FF8A93;letter-spacing:.28em;
  animation:capSlam .55s var(--ease-out);
}
@keyframes capSlam{
  0%{transform:translateY(12px);opacity:0;letter-spacing:.5em}
  100%{transform:translateY(0);opacity:1;letter-spacing:.28em}
}

.controls{
  display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:min(720px,100%);
}
.controls .btn{min-width:88px}
.controls .btn-primary{min-width:140px;position:relative;overflow:hidden}
.controls .btn-primary::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.2) 50%,transparent 60%);
  transform:translateX(-120%);
  transition:none;
}
body.is-running .controls .btn-primary{
  background:linear-gradient(135deg,#1a2a55,#2a3a6e);
  box-shadow:0 6px 18px -8px rgba(0,0,0,.5);
  animation:none;
}
.controls .btn-primary:hover::after{animation:btnSheen .7s var(--ease)}
@keyframes btnSheen{to{transform:translateX(120%)}}

.hints{
  font:500 12px/1.4 var(--font);color:var(--muted);text-align:center;max-width:520px;
  opacity:.8;
}
.hints kbd{
  display:inline-block;padding:2px 6px;border-radius:5px;border:1px solid var(--line);
  background:rgba(255,255,255,.03);font:600 11px/1 var(--font);color:var(--text-2);
}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);z-index:50;
  background:#fff;color:#081126;font:600 13.5px/1 var(--font);padding:12px 18px;border-radius:12px;
  box-shadow:0 14px 34px rgba(0,0,0,.4),0 0 40px -10px rgba(59,108,255,.35);
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s var(--ease);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{
  position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;
  opacity:0;animation:confettiFall var(--fall,2.4s) var(--ease-out) forwards;
  left:var(--x);background:var(--c);
  transform:rotate(var(--r));
}
@keyframes confettiFall{
  0%{opacity:1;transform:translateY(0) rotate(0deg) scale(1)}
  100%{opacity:0;transform:translateY(105vh) rotate(720deg) scale(.6)}
}

body.embedded .top .back{display:inline-flex}
html[data-fh-embed="1"] .top{padding-top:10px;padding-bottom:10px}

body:fullscreen .top,
body:-webkit-full-screen .top{
  position:fixed;left:0;right:0;top:0;background:rgba(5,11,29,.7);
}
body:fullscreen .main,
body:-webkit-full-screen .main{padding-top:88px}
body:fullscreen .hints,
body:-webkit-full-screen .hints{opacity:.45}
body:fullscreen .fx-mesh,
body:-webkit-full-screen .fx-mesh{opacity:1}

@media(max-width:640px){
  .top{padding:12px 14px;gap:10px}
  .top .sub{display:none}
  .main{padding:16px 14px 28px;gap:16px}
  .presets .sep{display:none}
  .custom{width:100%;justify-content:center}
  .controls .btn{flex:1 1 calc(50% - 10px)}
  .controls .btn-primary{flex:1 1 100%}
  .hints{display:none}
  .orbit,.orbit-2{opacity:.5}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  .stage.ended .digits,.digits.tick,.cap-dot,.fx-star,.orbit{animation:none!important}
  .fx-mesh,.fx-aurora,.fx-grid{animation:none!important}
}
</style>
</head>
<body>
<script>(function(){
  try{
    var q=new URLSearchParams(location.search);
    if(q.get('embed')==='1'||q.get('embed')==='true'||sessionStorage.getItem('fh-embed')==='1'){

<div class="fx" aria-hidden="true">
  <div class="fx-mesh"></div>
  <div class="fx-aurora"></div>
  <div class="fx-grid"></div>
  <div class="fx-stars" id="fxStars"></div>
  <div class="fx-vignette"></div>
  <div class="fx-edge"></div>
  <div class="fx-shock" id="fxShock"></div>
</div>
<div class="confetti" id="confetti" aria-hidden="true"></div>

<div class="app">
  <header class="top">
    <a class="back" id="backLink" href="../classroom_toolkit.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Toolkit
    </a>
    <div class="top-brand">
      <img class="top-logo" src="big-timer-logo.png" width="1016" height="353" alt="Big Timer" decoding="async">
      <h1 class="sr-only">Big Timer</h1>
      <p class="sub">Classroom countdown for Art &amp; Drama</p>
    </div>
    <div class="top-actions">
      <button type="button" class="btn btn-ghost on" id="btnRing" title="Toggle end sound" aria-pressed="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
        Ring
      </button>
      <button type="button" class="btn btn-ghost" id="btnFs" title="Fullscreen (F)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        Fullscreen
      </button>
    </div>
  </header>

  <main class="main">
    <div class="label-row">
      <input type="text" class="label-input" id="activityLabel" maxlength="60" placeholder="Activity label (optional) — e.g. Warm-up" autocomplete="off">
    </div>

    <div class="presets" id="presets" role="group" aria-label="Duration presets">
      <button type="button" class="btn" data-preset="60">1m</button>
      <button type="button" class="btn" data-preset="120">2m</button>
      <button type="button" class="btn" data-preset="180">3m</button>
      <button type="button" class="btn" data-preset="300">5m</button>
      <button type="button" class="btn" data-preset="600">10m</button>
      <span class="sep" aria-hidden="true"></span>
      <div class="custom">
        <input type="number" id="customMin" min="0" max="99" value="5" aria-label="Minutes" inputmode="numeric">
        <span>min</span>
        <input type="number" id="customSec" min="0" max="59" value="0" aria-label="Seconds" inputmode="numeric">
        <span>sec</span>
        <button type="button" class="btn btn-primary" id="btnCustomSet" style="height:32px;min-height:32px;padding:0 12px">Set</button>
      </div>
    </div>

    <div class="stage" id="stage" aria-live="polite">
      <div class="stage-glow" aria-hidden="true"></div>
      <div class="orbit" aria-hidden="true"></div>
      <div class="orbit orbit-2" aria-hidden="true"></div>
      <div class="ripple" aria-hidden="true"></div>
      <div class="burst" id="burst" aria-hidden="true"></div>
      <svg class="ring-svg" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="timerGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3B6CFF" id="gradStop0"/>
            <stop offset=".5" stop-color="#8658F5" id="gradStop1"/>
            <stop offset="1" stop-color="#D843B2" id="gradStop2"/>
          </linearGradient>
          <linearGradient id="timerGradEnd" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FF4D5A"/>
            <stop offset=".5" stop-color="#F45E68"/>
            <stop offset="1" stop-color="#FF8A3D"/>
          </linearGradient>
        </defs>
        <circle class="ring-track" cx="50" cy="50" r="43"/>
        <circle class="ring-tick" cx="50" cy="50" r="38" stroke-dasharray="1.2 6.8"/>
        <circle class="ring-glow" id="ringGlow" cx="50" cy="50" r="43"
          stroke-dasharray="270.2" stroke-dashoffset="0"/>
        <circle class="ring-progress" id="ringArc" cx="50" cy="50" r="43"
          stroke-dasharray="270.2" stroke-dashoffset="0"/>
      </svg>
      <div class="center">
        <span class="cap cap-live" id="capText"><span class="cap-dot" aria-hidden="true"></span><span id="capLabel">Ready</span></span>
        <div class="digits" id="digits">05:00</div>
        <div class="status" id="statusText"></div>
      </div>
    </div>

    <div class="controls">
      <button type="button" class="btn" id="btnMinus" title="Subtract 30 seconds">−30s</button>
      <button type="button" class="btn btn-primary" id="btnToggle">Start</button>
      <button type="button" class="btn" id="btnReset" title="Reset (R)">Reset</button>
      <button type="button" class="btn" id="btnPlus" title="Add 30 seconds">+30s</button>
    </div>

    <p class="hints">
      <kbd>Space</kbd> start / pause · <kbd>R</kbd> reset · <kbd>F</kbd> fullscreen · presets <kbd>1</kbd>–<kbd>5</kbd>
    </p>
  </main>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "tk_big_timer_v1";
  var CIRC = 2 * Math.PI * 43;
  var PRESET_KEYS = { "1": 60, "2": 120, "3": 180, "4": 300, "5": 600 };
  var WARN_RATIO = 0.2;
  var WARN_SECS = 60;
  var CRITICAL_SECS = 10;
  var reduceMotion = false;

  try {
    reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  } catch (e) {}

  var $ = function (id) { return document.getElementById(id); };

  var state = {
    total: 300,
    remaining: 300,
    running: false,
    ended: false,
    ring: true,
    label: "",
    lastTs: null,
    lastShownSec: null
  };

  var audioCtx = null;
  var toastT = null;
  var startAnimT = null;
  var cloudReady = false;

  function whenAuthReady(cb) {
    if (window.__authReady) cb();
    else {
      try { window.addEventListener("auth-guard-ready", cb, { once: true }); }
      catch (e) { window.addEventListener("auth-guard-ready", cb); }
      setTimeout(cb, 2500);
    }
  }

  function timerPrefsPayload() {
    return {
      total: state.total,
      ring: state.ring,
      label: state.label
    };
  }

  function toast(msg) {
    var el = $("toast");
    if (!el) return;
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastT);
    toastT = setTimeout(function () { el.classList.remove("show"); }, 2000);
  }

  function buildStars() {
    var wrap = $("fxStars");
    if (!wrap || reduceMotion) return;
    var n = 36;
    var html = "";
    for (var i = 0; i < n; i++) {
      var x = Math.random() * 100;
      var y = Math.random() * 100;
      var dur = (2.2 + Math.random() * 3.5).toFixed(2) + "s";
      var delay = (Math.random() * 5).toFixed(2) + "s";
      var bright = (0.35 + Math.random() * 0.55).toFixed(2);
      html += '<span class="fx-star" style="left:' + x + "%;top:" + y + "%;--dur:" + dur + ";--delay:" + delay + ";--bright:" + bright + '"></span>';
    }
    wrap.innerHTML = html;
  }

  function buildBurstRays() {
    var wrap = $("burst");
    if (!wrap) return;
    var html = "";
    for (var i = 0; i < 16; i++) {
      html += '<span class="burst-ray" style="--a:' + (i * 22.5) + 'deg"></span>';
    }
    wrap.innerHTML = html;
  }

  function spawnConfetti() {
    if (reduceMotion) return;
    var wrap = $("confetti");
    if (!wrap) return;
    wrap.innerHTML = "";
    var colors = ["#3B6CFF", "#8658F5", "#D843B2", "#F4A62A", "#F45E68", "#35C796", "#fff"];
    var n = 48;
    for (var i = 0; i < n; i++) {
      var el = document.createElement("i");
      el.style.setProperty("--x", (Math.random() * 100) + "%");
      el.style.setProperty("--c", colors[i % colors.length]);
      el.style.setProperty("--r", (Math.random() * 360) + "deg");
      el.style.setProperty("--fall", (1.8 + Math.random() * 1.6) + "s");
      el.style.width = (5 + Math.random() * 7) + "px";
      el.style.height = (8 + Math.random() * 10) + "px";
      el.style.animationDelay = (Math.random() * 0.35) + "s";
      wrap.appendChild(el);
    }
    setTimeout(function () { wrap.innerHTML = ""; }, 4200);
  }

  function loadPrefs() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      applyTimerPrefs(JSON.parse(raw));
      if (!state.running) state.remaining = state.total;
    } catch (e) {}
  }

  function applyTimerPrefs(data) {
    if (!data || typeof data !== "object") return;
    if (typeof data.total === "number" && data.total > 0) {
      state.total = Math.min(99 * 60 + 59, Math.max(1, Math.floor(data.total)));
      if (!state.running) state.remaining = state.total;
    }
    if (typeof data.ring === "boolean") state.ring = data.ring;
    if (typeof data.label === "string") state.label = data.label.slice(0, 60);
  }

  function persistPrefsLocal() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(timerPrefsPayload()));
    } catch (e) {}
  }

  function savePrefs() {
    persistPrefsLocal();
    if (cloudReady && window.ClassroomToolkitLibrary) {
      ClassroomToolkitLibrary.saveSoon(
        ClassroomToolkitLibrary.STORE.TIMER,
        timerPrefsPayload
      );
    }
  }

  function fmt(secs) {
    var s = Math.max(0, Math.ceil(secs));
    var m = Math.floor(s / 60);
    var r = s % 60;
    return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r;
  }

  function clampDuration(sec) {
    return Math.min(99 * 60 + 59, Math.max(1, Math.floor(sec)));
  }

  function ensureAudio() {
    if (audioCtx) return audioCtx;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
    return audioCtx;
  }

  function playTone(freq, start, dur, type, peak) {
    var ctx = audioCtx;
    if (!ctx) return;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(peak || 0.2, start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(start);
    osc.stop(start + dur + 0.02);
  }

  function playChime() {
    if (!state.ring) return;
    var ctx = ensureAudio();
    if (!ctx) return;
    if (ctx.state === "suspended") ctx.resume();
    var now = ctx.currentTime;
    playTone(523.25, now, 0.35, "sine", 0.16);
    playTone(659.25, now + 0.12, 0.4, "sine", 0.18);
    playTone(783.99, now + 0.24, 0.45, "sine", 0.2);
    playTone(1046.5, now + 0.38, 0.55, "triangle", 0.14);
  }

  function playStartBlip() {
    if (!state.ring) return;
    var ctx = ensureAudio();
    if (!ctx) return;
    if (ctx.state === "suspended") ctx.resume();
    var now = ctx.currentTime;
    playTone(440, now, 0.12, "sine", 0.08);
    playTone(660, now + 0.08, 0.16, "sine", 0.1);
  }

  function syncCustomInputs() {
    var m = Math.floor(state.total / 60);
    var s = state.total % 60;
    $("customMin").value = String(m);
    $("customSec").value = String(s);
  }

  function syncPresetButtons() {
    document.querySelectorAll("[data-preset]").forEach(function (btn) {
      var v = parseInt(btn.getAttribute("data-preset"), 10);
      btn.classList.toggle("on", !state.running && v === state.total);
    });
  }

  function urgencyLevel() {
    if (state.ended) return "ended";
    if (!state.running) return "idle";
    var rem = state.remaining;
    if (rem <= CRITICAL_SECS) return "critical";
    if (rem <= WARN_SECS || (state.total > 0 && rem / state.total <= WARN_RATIO)) return "warn";
    return "running";
  }

  function syncBodyClasses() {
    var body = document.body;
    var level = urgencyLevel();
    body.classList.toggle("is-running", state.running && !state.ended);
    body.classList.toggle("is-warn", level === "warn");
    body.classList.toggle("is-critical", level === "critical");
    body.classList.toggle("is-ended", state.ended);

    var stops = [
      ["#3B6CFF", "#8658F5", "#D843B2"],
      ["#F4A62A", "#FF7A3D", "#F45E68"],
      ["#FF4D5A", "#F45E68", "#FF2D55"]
    ];
    var idx = level === "critical" || level === "ended" ? 2 : level === "warn" ? 1 : 0;
    var g0 = $("gradStop0"), g1 = $("gradStop1"), g2 = $("gradStop2");
    if (g0 && g1 && g2) {
      g0.setAttribute("stop-color", stops[idx][0]);
      g1.setAttribute("stop-color", stops[idx][1]);
      g2.setAttribute("stop-color", stops[idx][2]);
    }
  }

  function pulseDigits() {
    if (reduceMotion) return;
    var el = $("digits");
    el.classList.remove("tick");
    void el.offsetWidth;
    el.classList.add("tick");
  }

  function draw() {
    var shown = Math.ceil(Math.max(0, state.remaining));
    if (state.lastShownSec !== null && shown !== state.lastShownSec && state.running) {
      pulseDigits();
    }
    state.lastShownSec = shown;

    $("digits").textContent = fmt(state.remaining);
    var progress = state.total > 0 ? state.remaining / state.total : 0;
    // On end, slam a full coral ring so the climax reads clearly on the board
    var offset = state.ended ? "0" : (CIRC * (1 - progress)).toFixed(2);
    $("ringArc").setAttribute("stroke-dasharray", CIRC.toFixed(2));
    $("ringArc").setAttribute("stroke-dashoffset", offset);
    var glow = $("ringGlow");
    if (glow) {
      glow.setAttribute("stroke-dasharray", CIRC.toFixed(2));
      glow.setAttribute("stroke-dashoffset", offset);
    }

    var stage = $("stage");
    stage.classList.toggle("ended", state.ended);
    stage.style.setProperty("--progress", String(progress));

    syncBodyClasses();

    var capLabel = $("capLabel") || $("capText");
    var status = $("statusText");
    if (state.ended) {
      if (capLabel) capLabel.textContent = "Time's up";
      status.textContent = state.label ? state.label : "Session complete";
    } else if (state.running) {
      var level = urgencyLevel();
      if (capLabel) {
        capLabel.textContent = level === "critical" ? "Almost there" : level === "warn" ? "Wrapping up" : "Time left";
      }
      status.textContent = state.label || "";
    } else if (state.remaining < state.total && state.remaining > 0) {
      if (capLabel) capLabel.textContent = "Paused";
      status.textContent = state.label || "Press Start or Space to continue";
    } else {
      if (capLabel) capLabel.textContent = "Ready";
      status.textContent = state.label || "";
    }

    $("btnToggle").textContent = state.running ? "Pause" : (state.remaining < state.total && !state.ended ? "Resume" : "Start");
    $("btnRing").classList.toggle("on", state.ring);
    $("btnRing").setAttribute("aria-pressed", state.ring ? "true" : "false");
    var canAdjust = !state.running;
    $("btnMinus").disabled = !canAdjust;
    $("btnPlus").disabled = !canAdjust;
    document.querySelectorAll("[data-preset]").forEach(function (b) { b.disabled = state.running; });
    $("btnCustomSet").disabled = state.running;
    $("customMin").disabled = state.running;
    $("customSec").disabled = state.running;
    syncPresetButtons();
  }

  function triggerStartFx() {
    var stage = $("stage");
    stage.classList.remove("is-starting");
    void stage.offsetWidth;
    stage.classList.add("is-starting");
    clearTimeout(startAnimT);
    startAnimT = setTimeout(function () { stage.classList.remove("is-starting"); }, 1000);
    playStartBlip();
  }

  function setDuration(sec, keepRunning) {
    state.total = clampDuration(sec);
    state.remaining = state.total;
    state.ended = false;
    if (!keepRunning) state.running = false;
    state.lastTs = null;
    state.lastShownSec = null;
    syncCustomInputs();
    savePrefs();
    draw();
  }

  function adjust(delta) {
    if (state.running) return;
    var next = clampDuration((state.ended ? 0 : state.remaining) + delta);
    if (state.ended || state.remaining === state.total) {
      setDuration(next, false);
    } else {
      state.remaining = next;
      state.total = Math.max(state.total, next);
      state.ended = false;
      savePrefs();
      draw();
    }
  }

  function start() {
    var wasFresh = !state.running && (state.ended || state.remaining === state.total || state.remaining <= 0);
    if (state.ended || state.remaining <= 0) {
      state.remaining = state.total;
      state.ended = false;
    }
    state.running = true;
    state.lastTs = null;
    ensureAudio();
    if (wasFresh || state.remaining === state.total) triggerStartFx();
    draw();
  }

  function pause() {
    state.running = false;
    state.lastTs = null;
    draw();
  }

  function toggle() {
    if (state.running) pause();
    else start();
  }

  function reset() {
    state.remaining = state.total;
    state.running = false;
    state.ended = false;
    state.lastTs = null;
    state.lastShownSec = null;
    $("confetti").innerHTML = "";
    draw();
  }

  function onEnded() {
    state.remaining = 0;
    state.running = false;
    state.ended = true;
    state.lastTs = null;
    draw();
    playChime();
    spawnConfetti();
    var shock = $("fxShock");
    if (shock && !reduceMotion) {
      shock.style.animation = "none";
      void shock.offsetWidth;
      shock.style.animation = "";
    }
  }

  function tick(ts) {
    if (state.running) {
      if (state.lastTs == null) state.lastTs = ts;
      var dt = (ts - state.lastTs) / 1000;
      state.lastTs = ts;
      state.remaining -= dt;
      if (state.remaining <= 0) onEnded();
      else draw();
    } else {
      state.lastTs = null;
    }
    requestAnimationFrame(tick);
  }

  function readCustomSeconds() {
    var m = parseInt($("customMin").value, 10);
    var s = parseInt($("customSec").value, 10);
    if (isNaN(m)) m = 0;
    if (isNaN(s)) s = 0;
    m = Math.min(99, Math.max(0, m));
    s = Math.min(59, Math.max(0, s));
    var total = m * 60 + s;
    return total > 0 ? total : 1;
  }

  function toggleFullscreen() {
    var doc = document;
    var el = document.documentElement;
    if (!doc.fullscreenElement && !doc.webkitFullscreenElement) {
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) req.call(el);
    } else {
      var exit = doc.exitFullscreen || doc.webkitExitFullscreen;
      if (exit) exit.call(doc);
    }
  }

  // events
  $("presets").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-preset]");
    if (!btn || state.running) return;
    setDuration(parseInt(btn.getAttribute("data-preset"), 10), false);
  });

  $("btnCustomSet").addEventListener("click", function () {
    if (state.running) return;
    setDuration(readCustomSeconds(), false);
    toast("Duration set to " + fmt(state.total));
  });

  $("btnToggle").addEventListener("click", toggle);
  $("btnReset").addEventListener("click", reset);
  $("btnMinus").addEventListener("click", function () { adjust(-30); });
  $("btnPlus").addEventListener("click", function () { adjust(30); });

  $("btnRing").addEventListener("click", function () {
    state.ring = !state.ring;
    savePrefs();
    draw();
    toast(state.ring ? "Ring at end on" : "Ring at end off");
  });

  $("btnFs").addEventListener("click", toggleFullscreen);

  $("activityLabel").addEventListener("input", function (e) {
    state.label = String(e.target.value || "").slice(0, 60);
    savePrefs();
    draw();
  });

  document.addEventListener("keydown", function (e) {
    var tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;

    if (e.code === "Space") {
      e.preventDefault();
      toggle();
      return;
    }
    if (e.key === "r" || e.key === "R") {
      e.preventDefault();
      reset();
      return;
    }
    if (e.key === "f" || e.key === "F") {
      e.preventDefault();
      toggleFullscreen();
      return;
    }
    if (PRESET_KEYS[e.key] && !state.running) {
      e.preventDefault();
      setDuration(PRESET_KEYS[e.key], false);
    }
  });

  (function patchBackLink() {
    var a = $("backLink");
    if (!a) return;
    try {
      if (new URLSearchParams(location.search).get("embed") === "1" || sessionStorage.getItem("fh-embed") === "1") {
        a.href = "../classroom_toolkit.html?embed=1";
      }
    } catch (e) {}
  })();

  buildStars();
  buildBurstRays();
  loadPrefs();
  $("activityLabel").value = state.label || "";
  $("ringArc").setAttribute("stroke-dasharray", CIRC.toFixed(2));
  syncCustomInputs();
  draw();
  requestAnimationFrame(tick);
  whenAuthReady(function () {
    var lib = window.ClassroomToolkitLibrary;
    if (!lib) {
      cloudReady = true;
      return;
    }
    lib.syncValue(lib.STORE.TIMER, timerPrefsPayload()).then(function (data) {
      applyTimerPrefs(data);
      if (!state.running) state.remaining = state.total;
      cloudReady = true;
      persistPrefsLocal();
      $("activityLabel").value = state.label || "";
      syncCustomInputs();
      draw();
    }).catch(function () {
      cloudReady = true;
    });
  });
})();
</script>
</body>
</html>
