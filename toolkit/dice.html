<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dice Roller — Classroom Toolkit</title>
<script src="../app-version.js"></script>
<script>(function(){if(window.ensureAppVersionInUrl)window.ensureAppVersionInUrl();})();</script>
<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-init.js"></script>
<script src="../allowlist-check.js"></script>
<script>window.__authGuardLoginPath='../login.html';</script>
<script src="../auth-guard.js"></script>
<script src="../embed-chrome.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="simple-tool.css">
<style>
:root{--accent:var(--amber);--glow:rgba(244,166,42,.5)}
.tray{
  width:min(1100px,100%);min-height:clamp(220px,40vh,440px);display:flex;flex-wrap:wrap;gap:clamp(14px,2.5vw,32px);
  align-items:center;justify-content:center;padding:24px;border-radius:28px;
  border:1px solid var(--line-strong);
  background:radial-gradient(ellipse 70% 80% at 50% 50%,rgba(244,166,42,.12),transparent 70%),rgba(8,16,36,.7);
}
.die{
  --s:clamp(96px,14vw,170px);
  width:var(--s);height:var(--s);border-radius:22%;position:relative;
  background:linear-gradient(145deg,#FFFFFF,#DCE3F5);
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.12),0 18px 40px -14px rgba(0,0,0,.7),0 0 40px -10px var(--glow);
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:14%;
}
.die.many{--s:clamp(70px,10vw,120px)}
.die .pip{width:72%;height:72%;margin:auto;border-radius:50%;background:#14203E;box-shadow:inset 0 2px 3px rgba(0,0,0,.45);visibility:hidden}
.die .pip.on{visibility:visible}
.die.poly{
  display:grid;grid-template-columns:1fr;grid-template-rows:1fr;place-items:center;padding:0;border-radius:18%;
  background:linear-gradient(145deg,#FFC860,#F4A62A 55%,#D9781C);
  color:#1B1406;font:700 calc(var(--s) * .42)/1 var(--font-display);
}
.die.poly small{position:absolute;bottom:8%;right:10%;font:700 calc(var(--s) * .12)/1 var(--font);opacity:.6}
.die.rolling{animation:tumble .5s var(--ease) infinite}
.die.landed{animation:land .45s var(--ease-out)}
@keyframes tumble{0%{transform:rotate(0) translateY(0)}25%{transform:rotate(18deg) translateY(-12px)}50%{transform:rotate(-12deg) translateY(4px)}75%{transform:rotate(10deg) translateY(-6px)}100%{transform:rotate(0)}}
@keyframes land{0%{transform:scale(1.18)}60%{transform:scale(.94)}100%{transform:scale(1)}}
.total{font:700 clamp(40px,7vw,92px)/1 var(--font-display);letter-spacing:-.03em;text-align:center}
.total span{display:block;font:600 13px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.log{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:min(900px,100%)}
.log span{padding:6px 10px;border-radius:999px;background:rgba(13,24,49,.75);border:1px solid var(--line);font:600 13px/1 var(--font);color:var(--text-2);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="back" id="backLink" href="../classroom_toolkit.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Toolkit
    </a>
    <div class="top-brand">
      <span class="top-mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.7" cy="8.7" r="1.2" fill="currentColor" stroke="none"/><circle cx="15.3" cy="8.7" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="8.7" cy="15.3" r="1.2" fill="currentColor" stroke="none"/><circle cx="15.3" cy="15.3" r="1.2" fill="currentColor" stroke="none"/></svg></span>
      <div class="top-text">
        <h1>Dice Roller</h1>
        <p class="sub">Roll one or more dice on the big screen</p>
      </div>
    </div>
    <div class="top-actions">
      <button type="button" class="btn btn-ghost" id="btnFs" title="Fullscreen (F)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        Fullscreen
      </button>
    </div>
  </header>

  <main class="main center">
    <div class="row">
      <div class="seg" role="group" aria-label="How many dice" id="countSeg"></div>
      <div class="seg" role="group" aria-label="Type of dice" id="sidesSeg"></div>
    </div>
    <div class="tray" id="tray" aria-live="polite"></div>
    <div class="total" id="total"></div>
    <button type="button" class="btn btn-primary btn-big" id="btnRoll">Roll <kbd>Space</kbd></button>
    <div class="log" id="log" aria-label="Previous rolls"></div>
  </main>
</div>

<script src="simple-tool.js"></script>
<script>
(function () {
  var S = window.SimpleTool, $ = S.$;
  var KEY = "tk_dice_roller_v1";
  var COUNTS = [1, 2, 3, 4, 5, 6];
  var SIDES = [4, 6, 8, 10, 12, 20];
  var PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
  var saved = S.load(KEY, {});
  var count = COUNTS.indexOf(saved.count) >= 0 ? saved.count : 2;
  var sides = SIDES.indexOf(saved.sides) >= 0 ? saved.sides : 6;
  var values = [], log = [], rolling = false;

  function persist() { S.save(KEY, { count: count, sides: sides }); }
  function rnd() { return 1 + Math.floor(Math.random() * sides); }

  function seg(id, items, current, label, onPick) {
    $(id).innerHTML = items.map(function (v) {
      return '<button type="button" data-v="' + v + '" class="' + (v === current ? "on" : "") + '">' + label(v) + "</button>";
    }).join("");
    Array.prototype.forEach.call($(id).querySelectorAll("button"), function (b) {
      b.addEventListener("click", function () { onPick(parseInt(b.getAttribute("data-v"), 10)); });
    });
  }
  function renderControls() {
    seg("countSeg", COUNTS, count, function (v) { return v + (v === 1 ? " die" : " dice"); }, function (v) { count = v; persist(); reset(); });
    seg("sidesSeg", SIDES, sides, function (v) { return "d" + v; }, function (v) { sides = v; persist(); reset(); });
  }

  function dieHtml(v, cls) {
    var extra = (count > 3 ? " many" : "") + (cls ? " " + cls : "");
    if (sides === 6) {
      var on = PIPS[v] || [];
      var pips = "";
      for (var i = 0; i < 9; i++) pips += '<span class="pip' + (on.indexOf(i) >= 0 ? " on" : "") + '"></span>';
      return '<div class="die' + extra + '" role="img" aria-label="' + v + '">' + pips + "</div>";
    }
    return '<div class="die poly' + extra + '" role="img" aria-label="' + v + '">' + v + "<small>d" + sides + "</small></div>";
  }
  function renderTray(cls) {
    $("tray").innerHTML = values.map(function (v) { return dieHtml(v, cls); }).join("");
  }
  function renderTotal() {
    if (!values.length || rolling) { $("total").innerHTML = ""; return; }
    var sum = values.reduce(function (a, b) { return a + b; }, 0);
    $("total").innerHTML = count > 1 ? "<span>Total</span>" + sum : "";
  }
  function renderLog() {
    $("log").innerHTML = log.map(function (r) { return "<span>" + r + "</span>"; }).join("");
  }

  function reset() {
    values = [];
    for (var i = 0; i < count; i++) values.push(sides === 6 ? i % 6 + 1 : sides);
    renderControls(); renderTray(); $("total").innerHTML = "";
  }

  function roll() {
    if (rolling) return;
    rolling = true;
    $("btnRoll").disabled = true;
    renderTotal();
    var frames = S.reduceMotion ? 1 : 9, f = 0;
    (function step() {
      values = [];
      for (var i = 0; i < count; i++) values.push(rnd());
      f++;
      if (f < frames) { renderTray("rolling"); setTimeout(step, 70 + f * 12); return; }
      rolling = false;
      $("btnRoll").disabled = false;
      renderTray("landed");
      renderTotal();
      var sum = values.reduce(function (a, b) { return a + b; }, 0);
      log.unshift(count > 1 ? values.join(" + ") + " = " + sum : String(sum));
      if (log.length > 12) log.pop();
      renderLog();
    })();
  }

  $("btnRoll").addEventListener("click", roll);
  $("tray").addEventListener("click", roll);
  document.addEventListener("keydown", function (e) {
    if (S.isTyping(e)) return;
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); roll(); }
  });

  reset();
})();
</script>
</body>
</html>
