<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#17141f">
<title>Join Stimulus Generator — Classroom Toolkit</title>
<script>window.FH_NO_VERSION_RELOAD=true;</script>
<script src="../app-version.js"></script>
<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-init.js"></script>
<script src="stimulus-banks.js"></script>
<script src="stimulus-engine.js"></script>
<script src="stimulus-junior.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Stop iOS double-tap zoom when pupils tap buttons quickly */
html{touch-action:manipulation}
:root{
  --bg:#17141f; --text:#F5F7FF; --text-2:#B6C0D9; --muted:#7D8AA8;
  --line:rgba(124,148,205,.18); --violet:#8658F5; --amber:#F4A62A; --mint:#35C796;
  --font:"Inter",ui-sans-serif,system-ui,sans-serif;
  --font-display:"General Sans","Inter",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{
  margin:0;min-height:100dvh;font-family:var(--font);color:var(--text);
  background:
    radial-gradient(ellipse 55% 40% at 16% -8%,rgba(134,88,245,.32),transparent 52%),
    radial-gradient(ellipse 48% 36% at 92% 8%,rgba(244,166,42,.16),transparent 48%),
    var(--bg);
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}

.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.spark{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle,#fff,rgba(200,170,255,.85) 40%,transparent 70%);
  box-shadow:0 0 8px rgba(134,88,245,.7);
  animation:twinkle ease-in-out infinite;
}
.spark.amber{
  background:radial-gradient(circle,#fff,rgba(255,210,120,.85) 40%,transparent 70%);
  box-shadow:0 0 8px rgba(244,166,42,.7);
}
@keyframes twinkle{
  0%,100%{opacity:.22;transform:scale(.7)}
  50%{opacity:1;transform:scale(1.2)}
}

.wrap{
  position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;
  align-items:center;padding:max(16px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom));
}
.card{
  width:min(440px,100%);border-radius:20px;padding:22px 16px 20px;
  background:linear-gradient(150deg,rgba(134,88,245,.12),#1d1828 55%);
  border:1px solid rgba(134,88,245,.3);
  box-shadow:0 16px 40px rgba(0,0,0,.35),0 0 40px rgba(134,88,245,.12);
}
.logo-wrap{width:min(260px,78%);margin:0 auto 10px}
.logo{width:100%;height:auto;display:block;filter:drop-shadow(0 0 18px rgba(134,88,245,.45))}
h1{margin:0 0 6px;font:700 22px/1.2 var(--font-display);letter-spacing:-.02em;text-align:center}
.sub{margin:0 0 16px;text-align:center;color:var(--muted);font:500 13.5px/1.45 var(--font)}
label{display:block;font:600 11px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
input{
  width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:#1d1828;
  padding:12px 14px;outline:none;font:600 16px/1.35 var(--font);letter-spacing:.03em;
}
input:focus{border-color:rgba(134,88,245,.55);box-shadow:0 0 0 3px rgba(134,88,245,.16)}
.btn{
  width:100%;min-height:50px;border:none;border-radius:14px;font:700 15px/1 var(--font);
  color:#fff;background:linear-gradient(135deg,#8658F5,#3B6CFF);
  box-shadow:0 10px 24px -8px rgba(134,88,245,.55);margin-top:12px;
}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{
  background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--text-2);
}
.err{color:#FFB4B9;font:600 13px/1.4 var(--font);min-height:1.2em;margin:0 0 8px;text-align:center}
.ok{color:#9FE7C8;font:600 13px/1.4 var(--font);text-align:center}
.meta{text-align:center;color:var(--text-2);font:500 13px/1.4 var(--font);margin:0 0 10px}
.wait{text-align:center;padding:28px 8px;color:var(--text-2);font:500 15px/1.5 var(--font)}
.hidden{display:none!important}

.axis{margin:0 0 12px}
.axis h2{
  margin:0 0 8px;font:700 11px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  min-height:40px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);color:var(--text-2);font:650 13px/1.2 var(--font);
}
.chip.on{
  border-color:rgba(134,88,245,.55);background:rgba(134,88,245,.22);color:#fff;
  box-shadow:0 0 12px rgba(134,88,245,.2);
}
.chip:disabled{opacity:.55;cursor:not-allowed}
.chip.lock{border-color:rgba(244,166,42,.45);background:rgba(244,166,42,.12);color:#FFD899}

.result-title{
  margin:4px 0 8px;font:800 26px/1.15 var(--font-display);letter-spacing:-.03em;text-align:center;
}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 14px}
.tag{
  padding:5px 10px;border-radius:999px;font:650 11px/1 var(--font);letter-spacing:.04em;text-transform:uppercase;
  background:rgba(134,88,245,.16);border:1px solid rgba(134,88,245,.3);color:#D7CCFF;
}
.scenario{font:500 15.5px/1.5 var(--font);color:var(--text);margin:0 0 16px}
.chars{display:grid;gap:8px;margin:0 0 14px}
.char{
  padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(29,24,40,.7);
}
.char strong{display:block;font:700 14.5px/1.25 var(--font-display);margin-bottom:2px}
.char .role{color:#C4B4FF;font:600 12.5px/1.3 var(--font)}
.char .want{margin:4px 0 0;color:var(--text-2);font:500 13px/1.4 var(--font)}
.devising{
  margin:0;padding:10px 12px;border-radius:12px;
  background:rgba(244,166,42,.08);border:1px solid rgba(244,166,42,.25);
  color:#F8D48A;font:500 13px/1.45 var(--font);
}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}

/* Simple mode (S1–S2): two choices, then the plot mountain */
.q{margin:6px 0 10px;font:750 18px/1.25 var(--font-display);letter-spacing:-.01em}
.q small{display:block;margin-top:3px;color:var(--muted);font:500 13px/1.35 var(--font)}
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 18px}
.type{
  text-align:left;padding:12px 12px 11px;border-radius:16px;border:1.5px solid var(--line);
  background:rgba(255,255,255,.04);color:var(--text);min-height:92px;
}
.type .em{display:block;font-size:26px;line-height:1;margin-bottom:6px}
.type b{display:block;font:750 15px/1.2 var(--font-display)}
.type span.bl{display:block;margin-top:3px;color:var(--text-2);font:500 12px/1.3 var(--font)}
.type.on{border-color:#a78bfa;background:rgba(134,88,245,.24);box-shadow:0 0 16px rgba(134,88,245,.25)}
.type.wide{grid-column:1/-1;min-height:0;display:flex;align-items:center;gap:10px}
.type.wide .em{margin:0}
.locked-note{margin:-8px 0 16px;color:#FFD899;font:600 12.5px/1.35 var(--font)}
.sizes{display:flex;gap:8px;margin:0 0 6px}
.size{
  flex:1;height:56px;border-radius:14px;border:1.5px solid var(--line);background:rgba(255,255,255,.04);
  font:800 22px/1 var(--font-display);color:var(--text)
}
.size.on{border-color:#a78bfa;background:rgba(134,88,245,.24)}

.where{text-align:center;color:var(--text-2);font:500 14px/1.4 var(--font);margin:0 0 14px}
.sec-h{margin:18px 0 8px;font:700 11px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cast{display:grid;gap:6px}
.cast .char{padding:9px 11px}
.cast .char strong{font-size:14px}
.cast .char .want{margin:2px 0 0}
.plot-mountain{display:block;width:100%;height:auto}
.mountain-box{padding:8px;border-radius:16px;border:1px solid var(--line);background:rgba(16,13,24,.6)}
.progress{margin:8px 0 0;text-align:center;font:700 13.5px/1.3 var(--font);color:var(--text-2)}
.progress b{color:#9FE7C8}
.stage{
  margin:12px 0 0;padding:14px 13px;border-radius:16px;border:1.5px solid var(--line);
  background:rgba(29,24,40,.82);scroll-margin-top:12px;
}
.stage.done{border-color:rgba(53,199,150,.55);background:linear-gradient(160deg,rgba(53,199,150,.10),rgba(29,24,40,.82) 60%)}
.stage-head{display:flex;align-items:flex-start;gap:10px}
.stage-num{
  flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:rgba(134,88,245,.25);color:#fff;font:800 14px/1 var(--font-display)
}
.stage.done .stage-num{background:#35C796;color:#10241c}
.stage-head h3{margin:0;font:800 17px/1.15 var(--font-display)}
.stage-head .plain{display:block;margin-top:2px;color:var(--text-2);font:600 13px/1.3 var(--font)}
.tension{margin-left:auto;flex:none;text-align:right}
.tension small{display:block;font:700 9.5px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.pips{display:flex;gap:3px;align-items:flex-end;height:20px}
.pips i{display:block;width:6px;border-radius:2px;background:rgba(255,255,255,.12)}
.pips i.on{background:linear-gradient(180deg,#F45E68,#F4A62A)}
.idea{margin:12px 0 0;font:500 15.5px/1.5 var(--font);color:var(--text)}
.beats{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:7px;counter-reset:beat}
.beats li{
  position:relative;padding:9px 10px 9px 38px;border-radius:12px;background:rgba(255,255,255,.04);
  font:500 14.5px/1.4 var(--font)
}
.beats li::before{
  counter-increment:beat;content:counter(beat);position:absolute;left:10px;top:9px;width:20px;height:20px;border-radius:50%;
  display:grid;place-items:center;background:rgba(244,94,104,.25);color:#FFC7CB;font:800 11.5px/1 var(--font)
}
.opts{display:grid;gap:7px;margin:12px 0 0}
.opt{
  text-align:left;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);
  background:rgba(255,255,255,.04);font:500 14.5px/1.4 var(--font);color:var(--text)
}
.opt.on{border-color:#a78bfa;background:rgba(134,88,245,.24)}
.opt .letter{font-weight:800;color:#C4B4FF;margin-right:4px}
.opt.own{color:var(--text-2);font-weight:600}
.waiting{margin:12px 0 0;color:var(--muted);font:600 14px/1.4 var(--font);font-style:italic}
.think{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:rgba(59,108,255,.10);border:1px solid rgba(59,108,255,.25)}
.think b{display:block;font:700 11px/1 var(--font);letter-spacing:.07em;text-transform:uppercase;color:#A9C0FF;margin-bottom:6px}
.think ul{margin:0;padding-left:18px;color:var(--text);font:500 13.5px/1.45 var(--font)}
.tip{margin:8px 0 0;padding:9px 12px;border-radius:12px;background:rgba(244,166,42,.08);border:1px solid rgba(244,166,42,.25);color:#F8D48A;font:500 13px/1.45 var(--font)}
.tip b{color:#FFD899}
.tick{
  width:100%;min-height:48px;margin-top:12px;border-radius:12px;border:1.5px dashed rgba(53,199,150,.5);
  background:transparent;color:#9FE7C8;font:750 14.5px/1 var(--font)
}
.tick.on{border-style:solid;background:#35C796;border-color:#35C796;color:#10241c}
.tick:disabled{opacity:.45;border-color:var(--line);color:var(--muted)}
.ready{
  margin:16px 0 0;padding:16px;border-radius:16px;text-align:center;
  background:linear-gradient(150deg,rgba(53,199,150,.22),rgba(59,108,255,.14));border:1px solid rgba(53,199,150,.5)
}
.ready b{display:block;font:800 20px/1.2 var(--font-display);margin-bottom:4px}
.ready span{color:var(--text-2);font:500 13.5px/1.4 var(--font)}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<body>
<div class="sky" id="sky" aria-hidden="true"></div>
<div class="wrap">
  <div class="card" id="viewJoin">
    <div class="logo-wrap">
      <img class="logo" src="stimulus-generator-logo.png" width="1276" height="485" alt="Stimulus Generator" decoding="async">
    </div>
    <h1>Join stimulus generator</h1>
    <p class="sub">Enter the PIN from the board and your group name.</p>
    <p class="err" id="joinErr"></p>
    <label for="pin">PIN</label>
    <input id="pin" inputmode="numeric" maxlength="6" placeholder="6-digit PIN" autocomplete="one-time-code">
    <label for="nick">Group name</label>
    <input id="nick" maxlength="24" placeholder="e.g. Group 3" autocomplete="nickname">
    <button type="button" class="btn" id="btnJoin">Join</button>
  </div>

  <div class="card hidden" id="viewPlay">
    <div class="logo-wrap" style="width:min(220px,72%);margin-bottom:6px">
      <img class="logo" src="stimulus-generator-logo.png" width="1276" height="485" alt="" decoding="async">
    </div>
    <p class="meta" id="playMeta"></p>
    <div id="playBody"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var AXES = [
    { key: "genre", title: "Genre", list: "genres" },
    { key: "form", title: "Form", list: "forms" },
    { key: "structure", title: "Structure", list: "structures" },
    { key: "style", title: "Style", list: "styles" },
    { key: "cast", title: "Characters", list: "casts" },
    { key: "setting", title: "Setting (optional)", list: "settingTypes" },
    { key: "time", title: "Time (optional)", list: "times" },
    { key: "extra", title: "Extra (optional)", list: "extras" }
  ];

  var state = {
    pin: "",
    token: "",
    nickname: "",
    poll: null,
    cache: null,
    choices: { genre: "", form: "", structure: "", style: "", cast: "", setting: "", time: "", extra: "" },
    jchoices: { type: "", cast: "" },
    result: null,
    recent: [],
    view: "join",
    submitting: false,
    playKey: ""
  };

  function buildSky() {
    var sky = $("sky");
    if (!sky || sky.dataset.ready) return;
    sky.dataset.ready = "1";
    var html = "";
    for (var i = 0; i < 26; i++) {
      var size = 2 + Math.random() * 5;
      var cls = "spark" + (Math.random() > 0.55 ? " amber" : "");
      html += '<span class="' + cls + '" style="width:' + size + "px;height:" + size +
        "px;left:" + (Math.random() * 100) + "%;top:" + (Math.random() * 100) +
        "%;animation-duration:" + (1.5 + Math.random() * 2.8) +
        "s;animation-delay:" + (Math.random() * 3) + 's"></span>';
    }
    sky.innerHTML = html;
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function tokenKey(pin) { return "tk_stimulus_player_" + pin; }

  function getOrCreateToken(pin) {
    var key = tokenKey(pin);
    try {
      var t = localStorage.getItem(key);
      if (t && t.length >= 16) return t;
    } catch (e) {}
    var t2 = "p_" + Math.random().toString(36).slice(2) + Date.now().toString(36) + Math.random().toString(36).slice(2);
    try { localStorage.setItem(key, t2); } catch (e2) {}
    return t2;
  }

  function rpc(name, args) {
    if (!window.supabase || !window.supabase.rpc) {
      return Promise.reject(new Error("Connection not ready"));
    }
    return window.supabase.rpc(name, args).then(function (res) {
      if (res.error) throw res.error;
      return res.data;
    });
  }

  // A missing function means the tool's database setup hasn't been run yet
  function joinError(err) {
    var code = err && err.code;
    if (code === "PGRST202" || code === "PGRST205" || code === "42883") {
      return "This activity isn't switched on yet. Tell your teacher.";
    }
    return (err && err.message) || "Could not join";
  }

  function options() {
    return window.StimulusEngine ? window.StimulusEngine.options() : {};
  }

  function locksFrom(data) {
    return (data && data.locks) || {};
  }

  function chipRow(axis, locks) {
    var opts = options();
    var items = opts[axis.list] || [];
    var locked = locks && locks[axis.key];
    var selected = locked || state.choices[axis.key] || "";
    var html = '<div class="axis"><h2>' + esc(axis.title) + "</h2><div class=\"chips\">";
    var anyOn = !selected;
    html += '<button type="button" class="chip' + (anyOn ? " on" : "") + '" data-axis="' + axis.key + '" data-id=""' +
      (locked ? " disabled" : "") + ">Any</button>";
    items.forEach(function (item) {
      var on = selected === item.id;
      var lockCls = locked && locked === item.id ? " lock" : "";
      html += '<button type="button" class="chip' + (on ? " on" : "") + lockCls + '" data-axis="' + axis.key +
        '" data-id="' + esc(item.id) + '"' + (locked ? " disabled" : "") + ">" + esc(item.label) + "</button>";
    });
    html += "</div></div>";
    return html;
  }

  function renderStimulus(s) {
    if (!s) return "";
    var tags = ["genre", "form", "structure", "style", "cast"].map(function (k) {
      return '<span class="tag">' + esc(s.labels[k]) + "</span>";
    }).join("");
    if (s.labels.extra) tags += '<span class="tag">' + esc(s.labels.extra) + "</span>";
    var chars = (s.characters || []).map(function (c) {
      return (
        '<div class="char"><strong>' + esc(c.name) + '</strong>' +
        '<div class="role">' + esc(c.role) + "</div>" +
        '<p class="want">Wants: ' + esc(c.want) + (c.note ? " — " + esc(c.note) : "") + "</p></div>"
      );
    }).join("");
    return (
      '<h2 class="result-title">' + esc(s.title) + "</h2>" +
      '<div class="tagrow">' + tags + "</div>" +
      '<p class="scenario">' + esc(s.scenario) + "</p>" +
      '<div class="chars">' + chars + "</div>" +
      '<p class="devising">' + esc(s.devising) + "</p>"
    );
  }

  /* ---------- Simple mode (S1–S2): story type + group size, then the plot mountain ---------- */

  var J = window.StimulusJunior;
  var LETTERS = ["A", "B", "C"];

  function isJunior(locks) { return !!(J && locks && locks.level === "junior"); }

  function juniorPickHtml(locks) {
    var lockedType = locks.type && J.TYPES.filter(function (t) { return t.id === locks.type; })[0];
    var html = '<p class="q">What kind of story?</p>';
    if (lockedType) {
      html += '<div class="types"><button type="button" class="type wide on" disabled><span class="em">' + lockedType.emoji +
        "</span><span><b>" + esc(lockedType.label) + '</b><span class="bl">' + esc(lockedType.blurb) + "</span></span></button></div>" +
        '<p class="locked-note">Your teacher chose this story type.</p>';
    } else {
      html += '<div class="types">' + J.TYPES.map(function (t) {
        return '<button type="button" class="type' + (state.jchoices.type === t.id ? " on" : "") + '" data-type="' + t.id + '">' +
          '<span class="em">' + t.emoji + "</span><b>" + esc(t.label) + '</b><span class="bl">' + esc(t.blurb) + "</span></button>";
      }).join("") +
        '<button type="button" class="type wide' + (!state.jchoices.type ? " on" : "") + '" data-type=""><span class="em">🎲</span>' +
        '<span><b>Surprise us!</b><span class="bl">Pick any story type for us</span></span></button></div>';
    }
    html += '<p class="q">How many people are in your group?</p><div class="sizes">' + J.CASTS.map(function (n) {
      return '<button type="button" class="size' + (String(state.jchoices.cast) === String(n) ? " on" : "") + '" data-cast="' + n + '">' + n + "</button>";
    }).join("") + "</div>";
    html += '<button type="button" class="btn" id="btnGo"' + (state.jchoices.cast ? "" : " disabled") + ">Make our story</button>" +
      '<p class="meta" style="margin-top:8px">' + (state.jchoices.cast ? "" : "Choose your group size to carry on.") + "</p>" +
      '<p class="err" id="genErr"></p>';
    return html;
  }

  function pips(n) {
    var h = "";
    for (var i = 1; i <= 5; i++) h += '<i class="' + (i <= n ? "on" : "") + '" style="height:' + (6 + i * 3) + 'px"></i>';
    return h;
  }

  function stageHtml(s, st, i) {
    var content = J.stageContent(s, st.id);
    var done = !!(s.planned && s.planned[st.id]);
    var body = "";
    if (content.list) {
      body = '<ol class="beats">' + content.list.map(function (b) { return "<li>" + esc(b) + "</li>"; }).join("") + "</ol>";
    } else if (content.options) {
      body = '<div class="opts">' + content.options.map(function (o, k) {
        return '<button type="button" class="opt' + (content.picked === k ? " on" : "") + '" data-stage="' + st.id + '" data-opt="' + k + '">' +
          '<span class="letter">' + LETTERS[k] + "</span> " + esc(o) + "</button>";
      }).join("") +
        '<button type="button" class="opt own' + (content.picked === J.OWN_IDEA ? " on" : "") + '" data-stage="' + st.id + '" data-opt="' + J.OWN_IDEA + '">' +
        "✏️ We'll make up our own</button></div>";
    } else if (content.waiting) {
      body = '<p class="waiting">' + esc(content.waiting) + "</p>";
    } else {
      body = '<p class="idea">' + esc(content.text) + "</p>";
    }
    var can = J.canPlan(s, st.id);
    return (
      '<section class="stage' + (done ? " done" : "") + '" id="stage-' + st.id + '">' +
        '<div class="stage-head"><span class="stage-num">' + (done ? "✓" : i + 1) + "</span>" +
          "<div><h3>" + esc(st.label) + '</h3><span class="plain">' + esc(st.plain) + "</span></div>" +
          '<div class="tension"><small>Tension</small><div class="pips">' + pips(st.tension) + "</div></div></div>" +
        body +
        '<div class="think"><b>Talk about it</b><ul>' + st.think.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul></div>" +
        '<p class="tip"><b>Drama tip:</b> ' + esc(st.tip) + "</p>" +
        '<button type="button" class="tick' + (done ? " on" : "") + '" data-tick="' + st.id + '"' + (can ? "" : " disabled") + ">" +
          (done ? "✓ Planned" : can ? "We've planned this" : (st.id === "resolution" ? "Choose an ending first" : "Choose a climax first")) +
        "</button>" +
      "</section>"
    );
  }

  function juniorResultHtml(s) {
    var count = J.plannedCount(s);
    var chars = (s.characters || []).map(function (c) {
      return '<div class="char"><strong>' + esc(c.role) + '</strong><p class="want">Wants ' + esc(c.want) + "</p></div>";
    }).join("");
    return (
      '<h2 class="result-title">' + esc(s.title) + "</h2>" +
      '<div class="tagrow"><span class="tag">' + esc(s.labels.type) + '</span><span class="tag">' + esc(s.labels.cast) + "</span></div>" +
      '<p class="where">📍 ' + esc(s.where) + "</p>" +
      '<p class="sec-h">Your characters · you choose their names</p><div class="cast">' + chars + "</div>" +
      '<p class="sec-h">Your story mountain</p>' +
      '<div class="mountain-box">' + J.mountainSvg(s, { links: true }) + "</div>" +
      '<p class="progress"><b>' + count + " of 6</b> stages planned" + (count < 6 ? ". Work through each one below." : "") + "</p>" +
      J.STAGES.map(function (st, i) { return stageHtml(s, st, i); }).join("") +
      (count === 6
        ? '<div class="ready"><b>Your story is planned!</b><span>Now get it on its feet. Rehearse it from exposition to resolution.</span></div>'
        : "") +
      '<div class="row2">' +
        '<button type="button" class="btn btn-ghost" id="btnBack">Change choices</button>' +
        '<button type="button" class="btn" id="btnAgain">New story</button>' +
      "</div>" +
      '<p class="ok" id="saveMsg">On the board</p>'
    );
  }

  function renderJunior(body, locks) {
    if (state.view === "result" && state.result && state.result.level === "junior") {
      var s = state.result;
      var key = "jresult:" + s.combo + JSON.stringify(s.picks) + JSON.stringify(s.planned);
      if (state.playKey === key) return;
      state.playKey = key;
      body.innerHTML = juniorResultHtml(s);
      body.querySelectorAll(".opt").forEach(function (btn) {
        btn.onclick = function () {
          var stage = btn.getAttribute("data-stage");
          var raw = btn.getAttribute("data-opt");
          var val = raw === J.OWN_IDEA ? J.OWN_IDEA : parseInt(raw, 10);
          var field = stage === "climax" ? "climax" : "resolution";
          if (s.picks[field] === val) return;
          s.picks[field] = val;
          // A different choice needs re-planning, including the falling action that follows a climax
          delete s.planned[stage];
          if (stage === "climax") delete s.planned.falling;
          renderJunior(body, locks);
          sendSoon();
        };
      });
      body.querySelectorAll(".tick").forEach(function (btn) {
        btn.onclick = function () {
          var id = btn.getAttribute("data-tick");
          if (!J.canPlan(s, id)) return;
          if (s.planned[id]) delete s.planned[id];
          else s.planned[id] = true;
          renderJunior(body, locks);
          sendSoon();
        };
      });
      $("btnBack").onclick = function () {
        if (J.plannedCount(s) && !window.confirm("Change your choices? You will lose the stages you have ticked.")) return;
        state.view = "pick";
        renderPlay(state.cache);
      };
      $("btnAgain").onclick = function () {
        if (J.plannedCount(s) && !window.confirm("Make a new story? You will lose the stages you have ticked.")) return;
        generateAndSend();
        window.scrollTo(0, 0);
      };
      return;
    }

    state.view = "pick";
    var pickKey = "jpick:" + JSON.stringify(state.jchoices) + JSON.stringify(locks);
    if (state.playKey === pickKey) return;
    state.playKey = pickKey;
    body.innerHTML = juniorPickHtml(locks);
    body.querySelectorAll(".type[data-type]").forEach(function (btn) {
      btn.onclick = function () {
        state.jchoices.type = btn.getAttribute("data-type") || "";
        renderPlay(state.cache);
      };
    });
    body.querySelectorAll(".size").forEach(function (btn) {
      btn.onclick = function () {
        state.jchoices.cast = btn.getAttribute("data-cast");
        renderPlay(state.cache);
      };
    });
    $("btnGo").onclick = function () {
      if (!state.jchoices.cast) return;
      generateAndSend();
      window.scrollTo(0, 0);
    };
  }

  function renderPlay(data) {
    if (!data) return;
    state.cache = data;
    $("playMeta").textContent = (data.title || "Stimulus") + " · " + (state.nickname || data.nickname || "");
    var body = $("playBody");
    var status = data.status;
    var locks = locksFrom(data);

    if (status === "open" && isJunior(locks)) {
      renderJunior(body, locks);
      return;
    }

    if (status === "lobby") {
      if (state.playKey !== "lobby") {
        state.playKey = "lobby";
        body.innerHTML = '<div class="wait">You\'re in!<br>Waiting for the teacher to open generating…</div>';
      }
      return;
    }
    if (status === "closed") {
      if (state.playKey !== "closed") {
        state.playKey = "closed";
        body.innerHTML = '<div class="wait"><strong>Session ended.</strong><br>You can put your phone away.</div>';
      }
      return;
    }

    if (state.view === "result" && state.result) {
      var resultKey = "result:" + (state.result.combo || state.result.title);
      if (state.playKey === resultKey) return;
      state.playKey = resultKey;
      body.innerHTML =
        renderStimulus(state.result) +
        '<div class="row2">' +
          '<button type="button" class="btn btn-ghost" id="btnBack">Change choices</button>' +
          '<button type="button" class="btn" id="btnAgain">Generate again</button>' +
        "</div>" +
        '<p class="ok" id="saveMsg">On the board</p>';
      $("btnBack").onclick = function () {
        state.view = "pick";
        renderPlay(state.cache);
      };
      $("btnAgain").onclick = function () { generateAndSend(); };
      return;
    }

    state.view = "pick";
    var pickKey = "pick:" + JSON.stringify(state.choices) + JSON.stringify(locks);
    if (state.playKey === pickKey) return;
    state.playKey = pickKey;
    body.innerHTML =
      AXES.map(function (axis) { return chipRow(axis, locks); }).join("") +
      '<button type="button" class="btn" id="btnGo">Generate stimulus</button>' +
      '<p class="err" id="genErr"></p>';

    body.querySelectorAll(".chip").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (btn.disabled) return;
        var axis = btn.getAttribute("data-axis");
        var id = btn.getAttribute("data-id") || "";
        state.choices[axis] = id;
        renderPlay(state.cache);
      });
    });
    $("btnGo").onclick = function () { generateAndSend(); };
  }

  function generateAndSend() {
    if (state.submitting) return;
    var engine = window.StimulusEngine;
    if (!engine) {
      var errEl = $("genErr");
      if (errEl) errEl.textContent = "Generator not loaded.";
      return;
    }
    var locks = locksFrom(state.cache);
    var stimulus = isJunior(locks)
      ? J.generate(state.jchoices, { locks: locks, avoid: state.recent })
      : engine.generate(state.choices, { locks: locks, avoid: state.recent });
    if (stimulus.combo) {
      state.recent.unshift(stimulus.combo);
      if (state.recent.length > engine.RECENT_MAX) state.recent.length = engine.RECENT_MAX;
    }
    state.result = stimulus;
    state.view = "result";
    state.playKey = "";
    renderPlay(state.cache);
    sendResult();
  }

  // Simple mode re-sends after every choice and tick so the board shows each group's progress
  function sendSoon() {
    clearTimeout(sendSoon._t);
    sendSoon._t = setTimeout(sendResult, 500);
  }

  function setSaveMsg(cls, text) {
    var el = $("saveMsg");
    if (el) { el.className = cls; el.textContent = text; }
  }

  function sendResult() {
    var stimulus = state.result;
    if (!stimulus) return;
    if (state.submitting) { state.resendAfter = true; return; }
    state.submitting = true;
    state.resendAfter = false;
    setSaveMsg("meta", "Sending to the board…");
    var choices = stimulus.level === "junior"
      ? { level: "junior", type: stimulus.type, cast: String(stimulus.cast) }
      : stimulus.tags;
    rpc("stimulus_submit_result", {
      p_token: state.token,
      p_choices: choices,
      p_stimulus: stimulus
    }).then(function () {
      state.submitting = false;
      setSaveMsg("ok", "On the board");
      if (state.resendAfter) sendResult();
    }).catch(function (err) {
      state.submitting = false;
      setSaveMsg("err", (err && err.message) || "Could not send to the board");
      if (state.resendAfter) sendResult();
    });
  }

  function poll() {
    if (!state.pin || !state.token) return;
    // Skip while the tab is hidden, and on slow wifi wait for the last check to answer (or give up after 10s)
    if (document.hidden || (state.polling && Date.now() - state.polling < 10000)) return;
    state.polling = Date.now();
    rpc("stimulus_get_session_state", { p_pin: state.pin, p_token: state.token })
      .then(function (data) {
        var prev = state.cache && state.cache.status;
        if (prev === "lobby" && data.status === "open") state.view = "pick";
        renderPlay(data);
      })
      .catch(function () {})
      .then(function () { state.polling = 0; });
  }

  // Catch up straight away when the pupil comes back to the tab
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && state.poll) poll();
  });

  function join() {
    var pin = String($("pin").value || "").replace(/\D/g, "").slice(0, 6);
    var nick = String($("nick").value || "").trim();
    $("joinErr").textContent = "";
    if (pin.length !== 6) {
      $("joinErr").textContent = "Enter the 6-digit PIN.";
      return;
    }
    if (!nick) {
      $("joinErr").textContent = "Enter a group name.";
      return;
    }
    var token = getOrCreateToken(pin);
    rpc("stimulus_join_session", { p_pin: pin, p_nickname: nick, p_token: token })
      .then(function (data) {
        state.pin = pin;
        state.token = token;
        state.nickname = (data && data.nickname) || nick;
        try {
          sessionStorage.setItem("tk_stimulus_join_pin", pin);
          sessionStorage.setItem("tk_stimulus_join_nick", state.nickname);
        } catch (e) {}
        $("viewJoin").classList.add("hidden");
        $("viewPlay").classList.remove("hidden");
        renderPlay(data);
        if (state.poll) clearInterval(state.poll);
        state.poll = setInterval(poll, 3000);
      })
      .catch(function (err) {
        $("joinErr").textContent = joinError(err);
      });
  }

  buildSky();
  $("btnJoin").onclick = join;
  $("pin").addEventListener("keydown", function (e) { if (e.key === "Enter") $("nick").focus(); });
  $("nick").addEventListener("keydown", function (e) { if (e.key === "Enter") join(); });
  try {
    var c = new URLSearchParams(location.search).get("c");
    if (c && /^\d{6}$/.test(c)) $("pin").value = c;
  } catch (e) {}
})();
</script>
</body>
