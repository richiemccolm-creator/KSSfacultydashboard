<style>
/* Mini Whiteboards: only what is special to this tool. Shared look is in toolkit-ui.css. */
body{--accent:#0e7490;--accent-stage:#3bd6ff;--paper:#F4F1E8}

.host-grid{display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:980px){.host-grid{grid-template-columns:1fr}}
.chip.ink{border-color:color-mix(in srgb,var(--accent-stage) 55%,transparent);color:#bff1ff}

/* The wall: every pupil board, on the class screen */
.wall-wrap{min-height:320px}
.wall-prompt{margin:0 0 4px;font:700 clamp(22px,2.8vw,34px)/1.15 var(--font-display);letter-spacing:-.025em}
.wall-sub{margin:0 0 16px;color:var(--muted);font:500 14px/1.4 var(--font)}
.wall{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.tile-board{
  position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;cursor:pointer;padding:0;
  background:var(--paper);border:2px solid transparent;
  box-shadow:0 8px 20px rgba(0,0,0,.3);transition:transform .12s,border-color .15s;
}
.tile-board:hover,.tile-board:focus-visible{transform:translateY(-2px);border-color:var(--accent-stage);outline:none}
.tile-board canvas{width:100%;height:100%;display:block;background:var(--paper)}
.tile-name{
  position:absolute;left:0;right:0;bottom:0;padding:20px 10px 8px;text-align:left;
  background:linear-gradient(transparent,rgba(11,20,39,.82));
  color:#fff;font:600 13.5px/1.2 var(--font);pointer-events:none;
}
.tile-board.empty::after{
  content:"Waiting";position:absolute;inset:0;display:grid;place-items:center;
  color:rgba(26,35,64,.4);font:600 13px/1 var(--font);pointer-events:none;
}
.wall-empty{
  grid-column:1/-1;padding:56px 16px;text-align:center;color:var(--text-2);
  border:1px dashed var(--stage-line-strong);border-radius:14px;font:500 16px/1.45 var(--font);
}

.lightbox{
  position:fixed;inset:0;z-index:60;background:rgba(5,10,22,.85);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;
}
.lightbox-card{width:min(960px,100%);background:var(--paper);border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.lightbox-card canvas{width:100%;height:auto;display:block;aspect-ratio:4/3;background:var(--paper)}
.lightbox-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--stage-2);color:#fff}
.lightbox-bar strong{font:700 16px/1.2 var(--font-display)}

.focus-exit{display:none;position:fixed;top:16px;right:16px;z-index:40}
body.host-live .top .sub{display:none}
body.board-focus .top{display:none}
body.board-focus .shell{padding:18px;width:min(1440px,100%)}
body.board-focus .host-grid{grid-template-columns:1fr}
body.board-focus #hostLobby{display:none!important}
body.board-focus .focus-exit{display:flex;gap:8px}
body.board-focus .wall{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
</style>
</head>
<body>

  try{
    var q=new URLSearchParams(location.search);

<div class="sky" id="sky" aria-hidden="true"></div>
<div class="app">
  <header class="top">
    <a class="back" id="homeLink" href="../classroom_toolkit.html" title="Back to Classroom Toolkit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      Toolkit
    </a>
    <div class="top-brand">
      <h1 class="tk-name">Mini Whiteboards</h1>
      <p class="sub">Every pupil's board on one screen</p>
    </div>
    <div class="top-actions" id="topActions"></div>
  </header>
  <main class="shell">
    <section id="viewSetup"></section>
    <section class="hidden" id="viewHost"></section>
  </main>
</div>
<div class="focus-exit" id="focusExit"></div>
<div class="lightbox hidden" id="lightbox" hidden></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  "use strict";

  var DEFAULT_PROMPT = "Show me your thinking";
  var PAPER = "#F4F1E8";
  var QR_PLACEHOLDER = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==";
  var $ = function (id) { return document.getElementById(id); };
  var state = {
    host: null,
    poll: null,
    boardFocus: false,
    boards: {},
    knownRevs: {},
    wallSig: "",
    enlargeId: null,
    setupError: ""
  };

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function toast(msg) {
    var el = $("toast");
    if (!el) return;
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove("show"); }, 2200);
  }

  function buildSky() {
    var sky = $("sky");
    if (!sky || sky.dataset.ready) return;
    sky.dataset.ready = "1";
    var html = "";
    var kinds = ["", " amber", " mint"];
    for (var i = 0; i < 32; i++) {
      var size = 2 + Math.random() * 5;
      html += '<span class="spark' + kinds[i % kinds.length] + '" style="width:' + size + "px;height:" + size +
        "px;left:" + (Math.random() * 100) + "%;top:" + (Math.random() * 100) +
        "%;animation-duration:" + (1.4 + Math.random() * 2.8) +
        "s;animation-delay:" + (Math.random() * 3) + 's"></span>';
    }
    for (var s = 0; s < 4; s++) {
      html += '<span class="streak" style="width:' + (18 + Math.random() * 28) +
        "vw;top:" + (8 + Math.random() * 80) +
        "%;animation-duration:" + (2.2 + Math.random() * 2.4) +
        "s;animation-delay:" + (Math.random() * 4) + 's"></span>';
    }
    sky.innerHTML = html;
  }

  function show(view) {
    ["viewSetup", "viewHost"].forEach(function (id) {
      $(id).classList.toggle("hidden", id !== view);
    });
    document.body.classList.toggle("host-live", view === "viewHost");
    document.body.classList.toggle("tk-stage", view === "viewHost");
  }

  function setTop(html) {
    $("topActions").innerHTML = html || "";
  }

  function stopPoll() {
    if (state.poll) { clearInterval(state.poll); state.poll = null; }
  }

  function joinUrlForPin(pin) {
    var base = location.href.replace(/[^/]*$/, "whiteboard-join.html");
    base = base.split("#")[0].split("?")[0];
    return base + (base.indexOf("?") >= 0 ? "&" : "?") + "c=" + encodeURIComponent(pin);
  }

  function randomPin() {
    return String(Math.floor(100000 + Math.random() * 900000));
  }

  function whenAuthReady(cb) {
    if (window.__authReady) cb();
    else {
      try { window.addEventListener("auth-guard-ready", cb, { once: true }); }
      catch (e) { window.addEventListener("auth-guard-ready", cb); }
      setTimeout(cb, 2500);
    }
  }

  // Sticker ids must match whiteboard-join.html and wb_sanitize_strokes
  var STICKER_EMOJI = {
    thumbs_up: "\uD83D\uDC4D", thumbs_down: "\uD83D\uDC4E", clap: "\uD83D\uDC4F", star: "\u2B50",
    heart: "\u2764\uFE0F", check: "\u2705", cross: "\u274C", question: "\u2753", idea: "\uD83D\uDCA1",
    think: "\uD83E\uDD14", laugh: "\uD83D\uDE02", smile: "\uD83D\uDE0A", wow: "\uD83D\uDE2E",
    sad: "\uD83D\uDE22", fire: "\uD83D\uDD25", hundred: "\uD83D\uDCAF", party: "\uD83C\uDF89",
    theatre: "\uD83C\uDFAD", palette: "\uD83C\uDFA8", rocket: "\uD83D\uDE80"
  };

  // Stickers are drawn from image files so they look the same on every device;
  // a device's own emoji font can come out as dark blobs, so it is only a fallback while loading
  var stickerImgs = {};
  function stickerImg(id, onReady) {
    var img = stickerImgs[id];
    if (!img) {
      img = new Image();
      img.decoding = "async";
      img.onload = function () { if (onReady) onReady(); };
      img.src = "stickers/" + id + ".svg";
      stickerImgs[id] = img;
    }
    return img.complete && img.naturalWidth ? img : null;
  }

  // When a sticker image finishes loading, repaint the wall and any enlarged board
  function repaintAfterSticker() {
    if (state.host) renderHostBody();
    if (state.enlargeId) refreshLightbox();
  }

  function drawSticker(ctx, s, sx, sy) {
    var em = STICKER_EMOJI[s.e];
    if (!em || !s.p || s.p.length < 2) return;
    var size = Math.max(8, (s.w || 110) * sx);
    var img = stickerImg(s.e, repaintAfterSticker);
    if (img) {
      ctx.drawImage(img, s.p[0] * sx - size / 2, s.p[1] * sy - size / 2, size, size);
      return;
    }
    ctx.save();
    ctx.fillStyle = "#1A2340";
    ctx.font = size + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(em, s.p[0] * sx, s.p[1] * sy);
    ctx.restore();
  }

  function paintStrokes(canvas, strokes) {
    if (!canvas) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var cssW = canvas.clientWidth || canvas.getBoundingClientRect().width || 320;
    var cssH = canvas.clientHeight || canvas.getBoundingClientRect().height || 240;
    var w = Math.max(1, Math.round(cssW * dpr));
    var h = Math.max(1, Math.round(cssH * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
    var ctx = canvas.getContext("2d");
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, w, h);
    var sx = w / 1000;
    var sy = h / 750;
    (strokes || []).forEach(function (s) {
      var p = s && s.p;
      if (!p || p.length < 2) return;
      if (s.e) { drawSticker(ctx, s, sx, sy); return; }
      ctx.strokeStyle = s.c || "#1A2340";
      ctx.fillStyle = ctx.strokeStyle;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = Math.max(1.5, (s.w || 4) * Math.min(sx, sy));
      if (p.length < 4) {
        ctx.beginPath();
        ctx.arc(p[0] * sx, p[1] * sy, ctx.lineWidth / 2, 0, Math.PI * 2);
        ctx.fill();
        return;
      }
      ctx.beginPath();
      ctx.moveTo(p[0] * sx, p[1] * sy);
      for (var i = 2; i < p.length; i += 2) ctx.lineTo(p[i] * sx, p[i + 1] * sy);
      ctx.stroke();
    });
  }

  // Supabase reports a missing table/function with these codes when the tool's migration hasn't been run
  function friendlyError(err, fallback) {
    var code = err && err.code;
    if (code === "PGRST205" || code === "PGRST202" || code === "42P01" || code === "42883") {
      return "Live Mini Whiteboards isn't set up on the database yet. An admin needs to run supabase/migrations/20260919080000_whiteboard_sessions.sql in the Supabase SQL Editor.";
    }
    return (err && err.message) || fallback;
  }

  function boardLabel(board, index) {
    var h = state.host;
    if (h && h.anonymous) return "Board " + (index + 1);
    return board.nickname || ("Board " + (index + 1));
  }

  function renderSetup() {
    stopPoll();
    state.host = null;
    state.boards = {};
    state.knownRevs = {};
    state.wallSig = "";
    state.boardFocus = false;
    document.body.classList.remove("board-focus");
    closeLightbox();
    show("viewSetup");
    setTop("");
    $("focusExit").innerHTML = "";
    $("viewSetup").innerHTML =
      '<div class="hero">' +
        "<div><h2>Start a live board session</h2>" +
        "<p>Pupils scan a QR on their iPad, write their answer, and every board appears on your screen at once. Like holding up mini whiteboards, without the scramble.</p></div>" +
        '<div class="hero-visual">' +
          '<img class="hero-logo" src="whiteboards-logo.png" width="1280" height="533" alt="Mini Whiteboards" decoding="async">' +
        "</div>" +
      "</div>" +
      '<div class="form">' +
        (state.setupError ? '<p class="setup-error" role="alert">' + esc(state.setupError) + "</p>" : "") +
        '<div><label for="edTitle">Title (optional)</label>' +
        '<input id="edTitle" maxlength="80" placeholder="e.g. Mime, lesson 2 check"></div>' +
        '<div><label for="edPrompt">Question on the boards</label>' +
        '<input id="edPrompt" maxlength="160" value="' + esc(DEFAULT_PROMPT) + '"></div>' +
        '<label class="check"><input type="checkbox" id="edNames" checked>' +
        "<span>Show pupil names on the wall. You can turn this off later if you want the class to look without names.</span></label>" +
        '<p class="hint">Pupils always type a name to join. The toggle only hides names on the big screen.</p>' +
        '<div class="form-actions">' +
          '<button type="button" class="btn btn-primary" id="btnLaunch">Launch live boards</button>' +
        "</div>" +
      "</div>";

    document.getElementById("btnLaunch").onclick = function () {
      var title = $("edTitle").value.trim() || "Mini Whiteboards";
      var prompt = $("edPrompt").value.trim() || DEFAULT_PROMPT;
      var showNames = $("edNames").checked;
      state.setupError = "";
      launchHost({ title: title, prompt: prompt, anonymous: !showNames });
    };
  }

  function createLiveSession(pack) {
    if (!window.supabase || !window.supabase.auth) {
      return Promise.reject(new Error("Live boards are not available right now"));
    }
    return window.supabase.auth.getSession().then(function (r) {
      var session = r && r.data && r.data.session;
      if (!session || !session.user) throw new Error("Sign in required for live boards");
      var pin = randomPin();
      var payload = {
        host_id: session.user.id,
        pin: pin,
        title: pack.title,
        prompt: pack.prompt,
        status: "open",
        anonymous: !!pack.anonymous,
        locked: false,
        round: 1
      };
      return window.supabase.from("whiteboard_sessions").insert(payload).select("*").single().then(function (res) {
        if (res.error) {
          payload.pin = randomPin();
          return window.supabase.from("whiteboard_sessions").insert(payload).select("*").single().then(function (res2) {
            if (res2.error) throw res2.error;
            return res2.data;
          });
        }
        return res.data;
      });
    });
  }

  function patchSession(patch) {
    var h = state.host;
    if (!h || !h.sessionId || !window.supabase) return Promise.resolve();
    return window.supabase
      .from("whiteboard_sessions")
      .update(patch)
      .eq("id", h.sessionId)
      .eq("host_id", h.hostUserId)
      .then(function (res) {
        if (res.error) throw res.error;
      });
  }

  function closeLiveSession() {
    stopPoll();
    var h = state.host;
    if (!h || !h.sessionId || !window.supabase) return Promise.resolve();
    return window.supabase
      .from("whiteboard_sessions")
      .update({ status: "closed" })
      .eq("id", h.sessionId)
      .then(function () {});
  }

  function drawQr() {
    var el = document.getElementById("hostQr");
    var h = state.host;
    if (!el || !h || !h.pin) return;
    var url = joinUrlForPin(h.pin);
    function setSrc(src) { el.src = src; }
    function fallback() {
      setSrc("https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data=" + encodeURIComponent(url));
    }
    var lib = window.QRCode;
    if (lib && typeof lib.toDataURL === "function") {
      lib.toDataURL(url, {
        width: 220, margin: 1,
        color: { dark: "#081126", light: "#ffffff" }
      }, function (err, dataUrl) {
        if (err || !dataUrl) fallback();
        else setSrc(dataUrl);
      });
      return;
    }
    fallback();
  }

  function launchHost(pack) {
    show("viewHost");
    setTop('<span class="meta">Starting live session…</span>');
    $("viewHost").innerHTML = '<p class="meta">Connecting…</p>';
    createLiveSession(pack).then(function (row) {
      state.host = {
        sessionId: row.id,
        pin: row.pin,
        hostUserId: row.host_id,
        pack: pack,
        status: row.status,
        anonymous: !!row.anonymous,
        locked: !!row.locked,
        round: row.round || 1,
        prompt: row.prompt || pack.prompt,
        list: []
      };
      state.boards = {};
      state.knownRevs = {};
      state.wallSig = "";
      renderHost();
      startPoll();
    }).catch(function (err) {
      state.setupError = friendlyError(err, "Could not start live session");
      renderSetup();
    });
  }

  function startPoll() {
    stopPoll();
    refreshHost();
    state.poll = setInterval(refreshHost, 1100);
  }

  function refreshHost() {
    var h = state.host;
    if (!h || !h.sessionId || !window.supabase) return;
    window.supabase.rpc("wb_list_host_state", {
      p_session_id: h.sessionId,
      p_known: state.knownRevs
    }).then(function (res) {
      if (res.error) return;
      var data = res.data || {};
      h.status = data.status;
      h.anonymous = !!data.anonymous;
      h.locked = !!data.locked;
      h.round = data.round || 1;
      h.prompt = data.prompt || h.prompt;
      h.pack.prompt = h.prompt;
      var incoming = Array.isArray(data.boards) ? data.boards : [];
      incoming.forEach(function (b) {
        if (!state.boards[b.id]) state.boards[b.id] = { strokes: [], rev: 0 };
        if (b.strokes != null) state.boards[b.id].strokes = b.strokes;
        state.boards[b.id].hasInk = !!b.has_ink || (state.boards[b.id].strokes && state.boards[b.id].strokes.length);
        state.boards[b.id].rev = b.rev || 0;
        state.knownRevs[b.id] = b.rev || 0;
      });
      h.list = incoming.map(function (b) {
        return {
          id: b.id,
          nickname: b.nickname,
          joined_at: b.joined_at,
          has_ink: state.boards[b.id] && state.boards[b.id].hasInk,
          rev: b.rev
        };
      });
      renderHostBody();
      if (state.enlargeId) refreshLightbox();
    });
  }

  function renderHost() {
    var h = state.host;
    if (!h) return;
    show("viewHost");
    setTop(
      '<button type="button" class="btn' + (h.anonymous ? "" : " on") + '" id="btnNames">Names ' +
        (h.anonymous ? "off" : "on") + "</button>" +
      '<button type="button" class="btn' + (h.locked ? " on" : "") + '" id="btnLock">' +
        (h.locked ? "Unlock" : "Lock boards") + "</button>" +
      '<button type="button" class="btn" id="btnFocus">Wall focus</button>' +
      '<button type="button" class="btn btn-ghost" id="btnEnd">End session</button>'
    );
    $("viewHost").innerHTML =
      '<div class="host-grid">' +
        '<div class="panel" id="hostLobby">' +
          '<div class="host-brand"><img src="whiteboards-logo.png" width="1280" height="533" alt="Mini Whiteboards" decoding="async"></div>' +
          '<h3 style="text-align:center">' + esc(h.pack.title) + "</h3>" +
          '<p class="meta" style="text-align:center;margin:0 0 4px">Game PIN</p>' +
          '<div class="pin" id="hostPin">' + esc(h.pin) + "</div>" +
          '<div class="qr-wrap"><img id="hostQr" alt="QR code to join the whiteboards" width="220" height="220" src="' + QR_PLACEHOLDER + '"></div>' +
          '<p class="meta" style="text-align:center">Pupils scan on an iPad or phone. No sign-in.</p>' +
          '<p class="meta" style="margin-top:12px"><span id="hostPlayerCount">0</span> joined · <span id="hostInkCount">0</span> writing</p>' +
          '<div class="player-chips" id="hostPlayers"></div>' +
          '<div style="margin-top:14px"><label for="livePrompt">Question</label>' +
          '<input id="livePrompt" maxlength="160" value="' + esc(h.prompt) + '"></div>' +
          '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">' +
            '<button type="button" class="btn btn-primary" id="btnPrompt">Update question</button>' +
            '<button type="button" class="btn" id="btnCopy">Copy link</button>' +
            '<button type="button" class="btn warn" id="btnWipe">Wipe all boards</button>' +
          "</div>" +
        "</div>" +
        '<div class="wall-wrap" id="hostWallWrap">' +
          '<p class="wall-prompt" id="wallPrompt"></p>' +
          '<p class="wall-sub" id="wallSub"></p>' +
          '<div class="wall" id="hostWall"></div>' +
        "</div>" +
      "</div>";

    state.wallSig = "";
    drawQr();
    wireHostChrome();
    renderHostBody();
  }

  function setFocusMode(on) {
    state.boardFocus = !!on;
    document.body.classList.toggle("board-focus", state.boardFocus);
    var exit = $("focusExit");
    if (state.boardFocus) {
      exit.innerHTML =
        '<button type="button" class="btn" id="btnFocusOut">Exit wall focus</button>' +
        '<button type="button" class="btn btn-ghost" id="btnEndFocus">End session</button>';
      document.getElementById("btnFocusOut").onclick = function () { setFocusMode(false); };
      document.getElementById("btnEndFocus").onclick = function () {
        closeLiveSession().then(function () { toast("Session ended"); renderSetup(); });
      };
    } else {
      exit.innerHTML = "";
      renderHost();
      startPoll();
    }
  }

  function wireHostChrome() {
    var h = state.host;
    var endBtn = document.getElementById("btnEnd");
    if (endBtn) {
      endBtn.onclick = function () {
        closeLiveSession().then(function () {
          toast("Session ended");
          renderSetup();
        });
      };
    }
    var namesBtn = document.getElementById("btnNames");
    if (namesBtn) {
      namesBtn.onclick = function () {
        h.anonymous = !h.anonymous;
        patchSession({ anonymous: h.anonymous }).then(function () {
          renderHost();
          startPoll();
        }).catch(function (err) { toast(err.message || "Could not update"); });
      };
    }
    var lockBtn = document.getElementById("btnLock");
    if (lockBtn) {
      lockBtn.onclick = function () {
        h.locked = !h.locked;
        patchSession({ locked: h.locked }).then(function () {
          toast(h.locked ? "Boards locked" : "Boards unlocked");
          renderHostBody();
          wireHostChrome();
        }).catch(function (err) { toast(err.message || "Could not lock"); });
      };
    }
    var focusBtn = document.getElementById("btnFocus");
    if (focusBtn) focusBtn.onclick = function () { setFocusMode(true); };
    var copyBtn = document.getElementById("btnCopy");
    if (copyBtn) {
      copyBtn.onclick = function () {
        var url = joinUrlForPin(h.pin);
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(function () { toast("Link copied"); })
            .catch(function () { prompt("Copy this link:", url); });
        } else prompt("Copy this link:", url);
      };
    }
    var promptBtn = document.getElementById("btnPrompt");
    if (promptBtn) {
      promptBtn.onclick = function () {
        var next = ($("livePrompt").value || "").trim() || DEFAULT_PROMPT;
        patchSession({ prompt: next }).then(function () {
          h.prompt = next;
          h.pack.prompt = next;
          toast("Question updated");
          renderHostBody();
        }).catch(function (err) { toast(err.message || "Could not update question"); });
      };
    }
    var wipeBtn = document.getElementById("btnWipe");
    if (wipeBtn) {
      wipeBtn.onclick = function () {
        if (!confirm("Wipe every pupil board for a new round?")) return;
        window.supabase.rpc("wb_wipe_boards", { p_session_id: h.sessionId }).then(function (res) {
          if (res.error) throw res.error;
          Object.keys(state.boards).forEach(function (id) {
            state.boards[id].strokes = [];
            state.boards[id].hasInk = false;
          });
          state.knownRevs = {};
          toast("Boards wiped");
          refreshHost();
        }).catch(function (err) { toast((err && err.message) || "Could not wipe"); });
      };
    }
  }

  function renderHostBody() {
    var h = state.host;
    if (!h) return;
    var count = document.getElementById("hostPlayerCount");
    var inkCount = document.getElementById("hostInkCount");
    var players = document.getElementById("hostPlayers");
    var wall = document.getElementById("hostWall");
    var promptEl = document.getElementById("wallPrompt");
    var subEl = document.getElementById("wallSub");
    var namesBtn = document.getElementById("btnNames");
    var lockBtn = document.getElementById("btnLock");

    if (count) count.textContent = String(h.list.length);
    var writing = h.list.filter(function (b) { return b.has_ink; }).length;
    if (inkCount) inkCount.textContent = String(writing);

    if (players) {
      if (h.anonymous) {
        players.innerHTML = '<span class="meta">Names hidden on the wall. ' + h.list.length + " joined</span>";
      } else if (h.list.length) {
        players.innerHTML = h.list.map(function (p) {
          return '<span class="chip' + (p.has_ink ? " ink" : "") + '">' + esc(p.nickname) + "</span>";
        }).join("");
      } else {
        players.innerHTML = '<span class="meta">Waiting for pupils…</span>';
      }
    }

    if (namesBtn) {
      namesBtn.classList.toggle("on", !h.anonymous);
      namesBtn.textContent = "Names " + (h.anonymous ? "off" : "on");
    }
    if (lockBtn) {
      lockBtn.classList.toggle("on", !!h.locked);
      lockBtn.textContent = h.locked ? "Unlock" : "Lock boards";
    }
    if (promptEl) promptEl.textContent = h.prompt || DEFAULT_PROMPT;
    if (subEl) {
      subEl.textContent = (h.pack.title || "Mini Whiteboards") +
        (h.locked ? " · Locked" : " · Live") +
        (h.anonymous ? " · Names hidden" : "") +
        " · Round " + (h.round || 1);
    }

    if (!wall) return;
    var sig = h.list.map(function (b) { return b.id; }).join("|") + "::" + (h.anonymous ? "a" : "n");
    if (sig !== state.wallSig) {
      state.wallSig = sig;
      if (!h.list.length) {
        wall.innerHTML = '<div class="wall-empty">Waiting for pupils to scan the QR…</div>';
      } else {
        wall.innerHTML = h.list.map(function (b, i) {
          var empty = !(state.boards[b.id] && state.boards[b.id].hasInk);
          return (
            '<button type="button" class="tile-board' + (empty ? " empty" : "") + '" data-id="' + esc(b.id) + '" aria-label="' + esc(boardLabel(b, i)) + '">' +
              '<canvas data-board="' + esc(b.id) + '" width="400" height="300"></canvas>' +
              '<span class="tile-name">' + esc(boardLabel(b, i)) + "</span>" +
            "</button>"
          );
        }).join("");
        wall.querySelectorAll(".tile-board").forEach(function (btn) {
          btn.onclick = function () { openLightbox(btn.getAttribute("data-id")); };
        });
      }
    } else {
      h.list.forEach(function (b, i) {
        var tile = wall.querySelector('.tile-board[data-id="' + b.id + '"]');
        if (!tile) return;
        tile.classList.toggle("empty", !b.has_ink);
        var name = tile.querySelector(".tile-name");
        if (name) name.textContent = boardLabel(b, i);
      });
    }

    requestAnimationFrame(function () {
      h.list.forEach(function (b) {
        var canvas = wall.querySelector('canvas[data-board="' + b.id + '"]');
        paintStrokes(canvas, state.boards[b.id] && state.boards[b.id].strokes);
      });
    });
  }

  function openLightbox(id) {
    state.enlargeId = id;
    refreshLightbox();
  }

  function closeLightbox() {
    state.enlargeId = null;
    var box = $("lightbox");
    box.classList.add("hidden");
    box.hidden = true;
    box.innerHTML = "";
  }

  function refreshLightbox() {
    var id = state.enlargeId;
    var h = state.host;
    if (!id || !h) return;
    var board = null;
    var idx = 0;
    h.list.forEach(function (b, i) {
      if (b.id === id) { board = b; idx = i; }
    });
    if (!board) { closeLightbox(); return; }
    var box = $("lightbox");
    box.hidden = false;
    box.classList.remove("hidden");
    box.innerHTML =
      '<div class="lightbox-card">' +
        '<canvas id="lightCanvas" width="1000" height="750"></canvas>' +
        '<div class="lightbox-bar"><strong>' + esc(boardLabel(board, idx)) + "</strong>" +
        '<button type="button" class="btn" id="btnLightClose">Close</button></div>' +
      "</div>";
    box.onclick = function (e) { if (e.target === box) closeLightbox(); };
    document.getElementById("btnLightClose").onclick = closeLightbox;
    requestAnimationFrame(function () {
      paintStrokes($("lightCanvas"), state.boards[id] && state.boards[id].strokes);
    });
  }

  function boot() {
    buildSky();
    try {
      var home = document.getElementById("homeLink");
      if (home && (new URLSearchParams(location.search).get("embed") === "1" || sessionStorage.getItem("fh-embed") === "1")) {
        home.href = "../classroom_toolkit.html?embed=1";
      }
    } catch (e) {}
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        if (state.enlargeId) closeLightbox();
        else if (state.boardFocus) setFocusMode(false);
      }
    });
    window.addEventListener("resize", function () {
      if (!state.host) return;
      var wall = document.getElementById("hostWall");
      if (!wall) return;
      state.host.list.forEach(function (b) {
        var canvas = wall.querySelector('canvas[data-board="' + b.id + '"]');
        paintStrokes(canvas, state.boards[b.id] && state.boards[b.id].strokes);
      });
      if (state.enlargeId) refreshLightbox();
    });
    renderSetup();
  }

  whenAuthReady(boot);
})();
</script>
</body>
</html>
