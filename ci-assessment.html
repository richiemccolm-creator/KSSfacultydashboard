<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Creative Industries Assessment · Faculty Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="design-tokens.css">
  <link rel="stylesheet" href="ci-assessment.css">
  <link rel="icon" type="image/png" href="faculty-hub-logo.png">
  <script>
    window.CIA_EMBED = new URLSearchParams(window.location.search).get('embed') === '1';
    if (window.CIA_EMBED) {
      document.documentElement.classList.add('cia-embed', 'cia-embed-pending');
      window.__authGuardLoginPath = 'login.html';
    }
  </script>
  <script src="app-version.js"></script>
  <script>
    (function () {
      if (window.ensureAppVersionInUrl) window.ensureAppVersionInUrl();
    })();
  </script>
  <script src="config.js"></script>
  <script src="embed-chrome.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-init.js"></script>
  <script src="allowlist-check.js"></script>
  <script src="auth-guard.js"></script>
  <script src="ci-assessment-units.js"></script>
  <script src="ci-assessment-core.js"></script>
  <script src="ci-assessment-service.js"></script>
</head>
<body>
  <header class="cia-bar">
    <a class="cia-bar-brand" href="faculty-hub.html"><img src="faculty-hub-logo.png" alt="" width="24" height="24">Faculty Hub</a>
    <span class="cia-bar-place">Drama · N5 Creative Industries</span>
  </header>

  <main class="cia-shell" id="cia-root">
    <div class="cia-title-row">
      <div class="cia-title">
        <h1>Creative Industries assessment</h1>
        <p class="cia-scope" id="cia-scope"></p>
      </div>
      <div class="cia-title-end">
        <span class="cia-sync" id="cia-sync" data-kind="busy" aria-live="polite">Loading…</span>
        <a class="cia-btn cia-btn-primary" href="#grid" data-go="grid">Mark evidence</a>
      </div>
    </div>
    <p class="cia-finding" id="cia-finding"></p>
    <p class="cia-banner" id="cia-banner" role="status" hidden></p>

    <nav class="cia-tabs" id="cia-tabs" aria-label="Tracker sections"></nav>
    <p class="cia-notice" id="cia-notice" role="status" aria-live="polite" hidden></p>

    <div id="cia-view"></div>
  </main>

  <div class="cia-pop" id="cia-pop" role="dialog" aria-label="Record a decision" hidden></div>
  <dialog class="cia-dialog" id="cia-dialog"></dialog>
  <div class="cia-print" id="cia-print" aria-hidden="true"></div>

  <script src="ci-assessment-app.js"></script>
</body>
</html>
